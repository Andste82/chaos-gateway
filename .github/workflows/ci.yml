name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.14.0

jobs:
  # Level 0 (plan §4.5): everything that needs no root. Generated code is checked here too:
  # the spec lints, the examples validate, the Go code is current and all clients compile.
  level0:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install golangci-lint
        run: curl -fsSL "https://raw.githubusercontent.com/golangci/golangci-lint/$GOLANGCI_LINT_VERSION/install.sh" | sh -s -- -b "$HOME/.local/bin" "$GOLANGCI_LINT_VERSION" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: make check-spec
      - run: make check-generated
      - run: make check-clients
      - run: make lint
      # the scripts that run on the host (M28): the host setup, the update, the smoke tests of the image and of the deployment
      - run: shellcheck deploy/*.sh deploy/chaosgw-kea-hook
      - run: go vet -tags appliance ./internal/appliance
      - run: go vet -tags testbed,browser ./internal/api
      - run: go vet -tags examples ./internal/api
      # the real mitmproxy that the tests of the interception proxy start (M22, internal/tlsresponder); the version is the one of the images
      # (tools/ciconfig checks it), and a run without it fails instead of skipping those tests
      - name: Install mitmproxy
        run: |
          python -m venv "$RUNNER_TEMP/mitm"
          "$RUNNER_TEMP/mitm/bin/pip" install -q mitmproxy==12.2.3
          echo "CHAOSGW_MITM_PYTHON=$RUNNER_TEMP/mitm/bin/python" >> "$GITHUB_ENV"
          echo "CHAOSGW_REQUIRE_MITMPROXY=1" >> "$GITHUB_ENV"
      - run: make test
      # the example suites for pytest and Jest (M18) against a gateway on the simulated kernel
      - run: make test-examples
      # 6 minutes of fuzzing on the executor's interface (plan M3, M29: six targets, a minute each); the nightly run goes longer
      - run: make fuzz

  # The examples of the user documentation (M30): the shell examples of docs/*.md run against a gateway on the simulated kernel with the real
  # engine, their printed output is compared with what the documents show (internal/api/docs_test.go). The lint of the blocks, the checks
  # against the schemas of the spec and the links are level 0 tests (internal/docscheck, run by `make test`).
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test-docs

  # Playwright end-to-end tests of the web app.
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npx playwright install --with-deps chromium
      - run: make test-e2e

  # The devcontainer image holds all test tools and the stock kernels for level 1b.
  testbed-vm:
    name: testbed (level 1b, VM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          load: true
          tags: chaos-gateway-dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max
      - name: Enable KVM if the runner offers it
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          if [ -w /dev/kvm ]; then echo kvm=yes; else echo "::warning title=No KVM::level 1b runs emulated"; fi
      # Without /dev/kvm the VM runs in software emulation: functional assertions only, minutes
      # of boot time (plan §4.3, open question Q1 in §7.2).
      - name: Load the lists of level 1 tests that must pass
        run: grep -E '^[A-Z0-9_]+=' .github/level1-tests.env >> "$GITHUB_ENV"
      - name: Run the testbed tests in a VM
        run: |
          kvm=()
          if [ -e /dev/kvm ]; then kvm=(--device /dev/kvm); fi
          # The engine package alone needs more than the default 20 minutes since M8b (about 50 minutes under KVM since M10): its measurement
          # tests of the fault engine send thousands of probes through delays of 100 to 600 ms each.
          docker run --rm "${kvm[@]}" -v "$PWD:/workspace" -w /workspace chaos-gateway-dev make test-vm ARGS="-test-timeout 100m -vm-timeout 3h -measurements measurements.jsonl -expect-pass $M35A_LEVEL1,$M15_LEVEL1,$M16_LEVEL1,$M17_LEVEL1,$M18_LEVEL1,$M20_LEVEL1,$M21_LEVEL1,$M22_LEVEL1,$M23_LEVEL1,$M24_LEVEL1,$M25_LEVEL1,$M26_LEVEL1,$M27_LEVEL1,$M29_LEVEL1,$I64_LEVEL1,$KEA_LEVEL1,$I79_LEVEL1"
      # The measurement record (plan §4.3, P2-AUDIT-07): one JSON line per check of every accuracy assertion. It is
      # kept for 90 days; `go run ./tools/measurements <dirs of downloaded artifacts>` compares the runs.
      - name: Summarize the measurement record
        if: always()
        run: |
          f=measurements.jsonl
          if [ -f "$f" ]; then
            echo "measurement record ($ARTIFACT): $(wc -l < "$f") lines, $(grep -c '"pass":false' "$f" || true) failed checks" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=No measurement record::$f is missing"
          fi
        env:
          ARTIFACT: measurements-level1b
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: measurements-level1b
          path: measurements.jsonl
          retention-days: 90
          if-no-files-found: warn

  # Level 1: the same tests directly in a privileged container. The container has no modules of
  # its own, so the runner's /lib/modules is mounted read-only and the tests load them into the
  # runner's kernel. This job runs the tests directly (`test-privileged`), never in a VM: if the
  # hosted kernel lacked a module (netem, for one) the preflight would fail the job with the list.
  # The first run showed that the hosted ubuntu-24.04 kernel has them.
  testbed-privileged:
    name: testbed (level 1, privileged container)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          load: true
          tags: chaos-gateway-dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max
      - name: Load the lists of level 1 tests that must pass
        run: grep -E '^[A-Z0-9_]+=' .github/level1-tests.env >> "$GITHUB_ENV"
      # The engine package alone needs more than the default 20 minutes since M10 (about 25 native):
      # its measurement tests send thousands of probes through delays of 100 to 600 ms each.
      - run: docker run --rm --privileged -v /lib/modules:/lib/modules:ro -v "$PWD:/workspace" -w /workspace chaos-gateway-dev make test-privileged ARGS="-test-timeout 60m -measurements measurements.jsonl -expect-pass $M35A_LEVEL1,$M15_LEVEL1,$M16_LEVEL1,$M17_LEVEL1,$M18_LEVEL1,$M20_LEVEL1,$M21_LEVEL1,$M22_LEVEL1,$M23_LEVEL1,$M24_LEVEL1,$M25_LEVEL1,$M26_LEVEL1,$M27_LEVEL1,$M29_LEVEL1,$I64_LEVEL1,$KEA_LEVEL1,$I79_LEVEL1"
      # The measurement record (plan §4.3, P2-AUDIT-07): one JSON line per check of every accuracy assertion. It is
      # kept for 90 days; `go run ./tools/measurements <dirs of downloaded artifacts>` compares the runs.
      - name: Summarize the measurement record
        if: always()
        run: |
          f=measurements.jsonl
          if [ -f "$f" ]; then
            echo "measurement record ($ARTIFACT): $(wc -l < "$f") lines, $(grep -c '"pass":false' "$f" || true) failed checks" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=No measurement record::$f is missing"
          fi
        env:
          ARTIFACT: measurements-level1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: measurements-level1
          path: measurements.jsonl
          retention-days: 90
          if-no-files-found: warn

  # The browser flows of M12, M13 and M14 against the real stack (plan §5 M12, M13 and M14 Tests):
  # the gateway runs on the real executor in the namespace testbed and serves the built web app, and
  # Chromium walks through the setup wizard until the device list shows a discovered device (M12,
  # TestFirstStartInTheBrowserUntilADiscoveredDevice), creates a fault in the UI whose effect is
  # then measured on the wire (M13, TestAFaultCreatedInTheBrowserTakesEffectOnTheWire), and creates
  # a WireGuard client in the UI, scans its QR code, brings its tunnel up and sees an unconfirmed
  # change rolled back (M14, TestAWireGuardClientCreatedInTheBrowserBringsUpItsTunnel); `-run
  # InTheBrowser` selects all three, and `-expect-pass` fails the job unless each of the three
  # passed (a renamed flow or a lost build tag must not leave the job green with no flow run; the
  # runner also fails a run in which no test ran at all). The 45 minutes leave room for the three
  # flows (the M14 flow waits out a 90 s commit-confirm window; under software emulation in the VM
  # it alone took 18 minutes); CI run 38447039664 ran the three flows within them (closed open item
  # P3-M14-04). Level 1 (a privileged container) like the job above; the tag browser keeps the
  # tests out of the other testbed jobs, which have no web build and no browser.
  testbed-ui:
    name: testbed UI flow (level 1, privileged container)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          load: true
          tags: chaos-gateway-dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max
      - run: >-
          docker run --rm --privileged -v /lib/modules:/lib/modules:ro -v "$PWD:/workspace" -w /workspace chaos-gateway-dev
          bash -c 'cd web && npm ci && npx playwright install chromium && npm run build && cd ..
          && make test-privileged ARGS="-tags testbed,browser -run InTheBrowser -test-timeout 45m
          -expect-pass TestFirstStartInTheBrowserUntilADiscoveredDevice,TestAFaultCreatedInTheBrowserTakesEffectOnTheWire,TestAWireGuardClientCreatedInTheBrowserBringsUpItsTunnel
          ./internal/api"'

  # arm64: the image is built for both architectures, and the unit tests run as arm64 binaries
  # under qemu-user (functional only; ARM64 measurements need hardware, H1).
  arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      # issue #57, M28: on a fresh host the API container (user 65532) must be able to write every directory it mounts writable. The
      # persistent ones are bind mounts of directories the host setup makes (plan §3.6), the directory of Kea's events socket a named
      # volume that takes its owner from the image; the amd64 image comes from the cache of the build above
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: chaos-gateway:ci
          cache-from: type=gha,scope=image
      - name: the host setup makes the directories, and the API container writes them
        run: |
          sudo sh deploy/host-setup.sh --data-only
          for dir in /var/lib/chaosgw/state /var/lib/chaosgw/secrets /var/lib/chaosgw/api /var/lib/chaosgw/service /var/lib/chaosgw/captures /var/lib/chaosgw/tlsca /run/chaosgw-kea-events; do
            case "$dir" in
            /var/lib/chaosgw/*) mount="$dir:$dir" ;;
            *)
              vol="ci-$(basename "$dir")"
              docker volume rm -f "$vol" >/dev/null
              docker volume create "$vol" >/dev/null
              mount="$vol:$dir"
              ;;
            esac
            docker run --rm --user 65532:65532 -v "$mount" --entrypoint sh chaos-gateway:ci \
              -c "mkdir $dir/probe && touch $dir/probe/file" || { echo "user 65532 cannot write $dir on a fresh host"; exit 1; }
            case "$dir" in /var/lib/chaosgw/*) sudo rm -rf "$dir/probe" ;; *) docker volume rm "$vol" >/dev/null ;; esac
          done
          mode=$(stat -c '%u:%g %a' /var/lib/chaosgw/secrets)
          test "$mode" = "65532:65532 700" || { echo "the secrets directory is $mode, want 65532:65532 700"; exit 1; }
      # issue #57 F3: the API (user 65532) creates the Kea events socket in its own fresh volume, and the
      # Kea container's user (0:65532, here without any capability) sends to it through a read-only mount
      - name: the Kea hook sends to the API's events socket through a read-only mount
        run: |
          sock=/run/chaosgw-kea-events/events.sock
          docker volume rm -f ci-kea-events >/dev/null
          docker volume create ci-kea-events >/dev/null
          docker run -d --name ci-kea-events-api --user 65532:65532 --read-only --cap-drop ALL -v ci-kea-events:/run/chaosgw-kea-events \
            --entrypoint perl chaos-gateway:ci -MSocket -e '
              socket(my $s, PF_UNIX, SOCK_DGRAM, 0) or die "socket: $!";
              bind($s, pack_sockaddr_un($ARGV[0])) or die "bind: $!";
              chmod(0660, $ARGV[0]) or die "chmod: $!";
              defined(recv($s, my $b, 512, 0)) or die "recv: $!";
              print $b' "$sock" >/dev/null
          sent=""
          for _ in $(seq 1 20); do
            if docker run --rm --user 0:65532 --read-only --cap-drop ALL -v ci-kea-events:/run/chaosgw-kea-events:ro \
                --entrypoint perl chaos-gateway:ci -MSocket -e '
                  -S $ARGV[0] or exit 3;
                  socket(my $s, PF_UNIX, SOCK_DGRAM, 0) or die "socket: $!";
                  send($s, "lease", 0, pack_sockaddr_un($ARGV[0])) or die "send: $!"' "$sock"; then
              sent=1; break
            fi
            sleep 1
          done
          timeout 20 docker wait ci-kea-events-api >/dev/null || true
          got=$(docker logs ci-kea-events-api 2>&1)
          docker rm -f ci-kea-events-api >/dev/null
          docker volume rm ci-kea-events >/dev/null
          test -n "$sent" && test "$got" = "lease" || { echo "the datagram did not arrive: sent=${sent:-no}, the API's side: $got"; exit 1; }
      # the image smoke tests run before the apt package qemu-user is installed: its binfmt handler has no fix-binary flag, replaces the
      # one docker/setup-qemu-action registered, and a container then cannot find the emulator ("exec /usr/local/bin/chaosgw: no such file")
      # M28 (plan §4.4): the arm64 image starts, holds the tools at the pinned versions and runs its binaries under qemu-user, the
      # amd64 image natively (deploy/smoke-image.sh). The functional smoke test of the arm64 image on a whole machine is the weekly
      # appliance VM; ARM64 hardware (H1) is not available.
      - name: the amd64 image passes the image smoke test
        run: deploy/smoke-image.sh linux/amd64 chaos-gateway:ci
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          load: true
          tags: chaos-gateway:ci-arm64
          cache-from: type=gha,scope=image
      - name: the arm64 image passes the image smoke test under qemu-user
        run: deploy/smoke-image.sh linux/arm64 chaos-gateway:ci-arm64
      - run: sudo apt-get update && sudo apt-get install -y qemu-user
      - run: make test-arm64

  # The interception proxy's container (plan §3.8, M22): the image builds with mitmproxy in its virtualenv (the jobs arm64 and mounts build it too, and
  # start nothing from it), and the container of deploy/compose.tlsproxy.yaml starts from it, loads the addon, passes its healthcheck and carries a
  # request (deploy/smoke-tlsproxy.sh). It needs no namespace and no capability, so a hosted runner is enough.
  tlsproxy-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: chaos-gateway:ci
          cache-from: type=gha,scope=image
      - name: the container of the interception proxy starts from its compose file
        run: deploy/smoke-tlsproxy.sh
        env:
          CHAOSGW_VERSION: ci

  # The deployment (plan §3.8, M28): deploy/compose.yaml starts every container of the gateway from the image on a real Docker host, in the
  # order of the plan, they become healthy, the setup token is in the log, the privileges are those of the table (read from the container
  # runtime), the containers stop and start again (deploy/smoke-compose.sh; what the stop removes from the kernel is the recovery test's of level 2). A hosted runner is a
  # machine with root and the kernel modules; the script assigns no interface and applies no configuration, so the runner's own
  # connection is not touched. The level 2 test (nightly) does the same on clean Ubuntu hosts with a test interface and a run.
  deployment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: chaos-gateway:ci
          cache-from: type=gha,scope=image
      - name: compose.yaml starts the gateway
        run: sudo env CHAOSGW_VERSION=ci deploy/smoke-compose.sh

  # issue #57 (F4): the executor container mounts nothing into the host. It shares /run/netns with the
  # host (rshared); a volume mounted inside another volume of the container then propagated into the
  # host's mount table, and `docker compose down -v` failed with "device or resource busy". The executor
  # is started from its real compose file (privileged, its volumes and binds), with `sleep` instead of the
  # executor, since the mounts are made before the process runs.
  mounts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: chaos-gateway:latest
          cache-from: type=gha,scope=image
      - name: the executor's volumes do not leak into the host's mounts
        working-directory: deploy
        run: |
          # the compose files bind-mount the directories the host setup makes (plan §3.6)
          sudo sh host-setup.sh --data-only
          compose="docker compose -p ci-mounts -f compose.executor.yaml"
          $compose run -d --name ci-mounts-exec --entrypoint sleep exec infinity
          sleep 2
          leaked=$(findmnt -rn -o TARGET | grep '/var/lib/docker/volumes/ci-mounts_' || true)
          # the host's systemd-networkd defaults (I64-02) are readable in the executor container
          docker exec ci-mounts-exec ls /host/usr/lib/systemd/network || { echo "/host/usr/lib/systemd/network is not readable in the executor container"; fail=1; }
          docker rm -f ci-mounts-exec >/dev/null
          if [ -n "$leaked" ]; then echo "mounts of the executor container in the host's mount table:"; echo "$leaked"; fail=1; fi
          $compose down -v || { echo "docker compose down -v failed"; fail=1; }
          exit ${fail:-0}
      - name: the teardown container is valid, and its volumes and the shared /run/netns do not leak into the host's mounts (M27)
        working-directory: deploy
        run: |
          compose="docker compose -p ci-mounts-td -f compose.teardown.yaml"
          $compose config -q || { echo "compose.teardown.yaml does not render"; exit 1; }
          # the container mounts every volume writable and /run/netns with rshared propagation, like issue #57's executor
          $compose run -d --name ci-mounts-td --entrypoint sleep teardown infinity
          sleep 2
          leaked=$(findmnt -rn -o TARGET | grep '/var/lib/docker/volumes/ci-mounts-td_' || true)
          for d in state secrets api service tlsca captures exec; do
            # a write, not test -w: the coreutils of Ubuntu 26.04 (uutils) read the mode bits and say no to root in a directory of user 65532
            docker exec ci-mounts-td sh -c "touch /var/lib/chaosgw/$d/.write-check && rm /var/lib/chaosgw/$d/.write-check" || { echo "/var/lib/chaosgw/$d is not writable in the teardown container"; fail=1; }
          done
          docker exec ci-mounts-td sh -c "touch /var/lib/kea/.write-check && rm /var/lib/kea/.write-check" || { echo "/var/lib/kea is not writable in the teardown container"; fail=1; }
          if [ "${fail:-0}" = 1 ]; then
            # what the container is: the user, its capabilities, the owners of the directories, and a real write
            docker exec --privileged ci-mounts-td sh -c 'id; grep -E "^(Cap|NoNewPrivs|Seccomp)" /proc/self/status; ls -ldn /var/lib/chaosgw/* /var/lib/kea; touch /var/lib/chaosgw/state/probe && echo "touch works" && rm /var/lib/chaosgw/state/probe; grep chaosgw /proc/self/mountinfo' || true
          fi
          docker rm -f ci-mounts-td >/dev/null
          if [ -n "$leaked" ]; then echo "mounts of the teardown container in the host's mount table:"; echo "$leaked"; fail=1; fi
          $compose down -v || { echo "docker compose down -v failed"; fail=1; }
          exit ${fail:-0}
