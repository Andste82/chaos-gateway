name: Image

# Builds the multi-arch image (linux/amd64, linux/arm64) and pushes it to ghcr.io (M28).
#
#   manual     Actions > Image > Run workflow: pushes ghcr.io/<owner>/chaos-gateway:<tag> and
#              :sha-<commit> from the selected branch; use it for test containers
#   release    a pushed tag v* pushes :<version> (v1.2.3 gives 1.2.3, 1.2 and 1) and, if it is the highest release version,
#              :latest, and attaches the files of the deployment to the release of the tag; a tag with a pre-release
#              part (v1.0.0-rc.1) pushes only :<version> and makes a pre-release of the GitHub release. The tag must be a
#              version on the history of main (deploy/release-check.sh) and the CI workflow must have passed on its commit;
#              nothing is built before that is checked
#
# The image is the whole gateway: chaosgw and chaosctl, the tools of the containers, Kea, BIRD, the
# interception proxy and tcpdump (deploy/Dockerfile). Each platform is built, loaded and started
# (deploy/smoke-image.sh: the arm64 image under qemu-user) before the multi-arch image is pushed,
# so a broken image never gets a tag; the builds come from the cache of the build that pushes.
# After the push the manifest is read back: both platforms must be in it. The workflow has not run on a release tag yet; the first
# real run is the first release, which docs/release.md says to make a release candidate (v1.0.0-rc.1) first.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag for a manual run
        default: test
        required: true
      push:
        description: "Push to ghcr.io (off = build only)"
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # The only job that can write to the repository (contents) and to the registry (packages) runs third-party actions, so each action is
  # pinned to the commit of a release (the version is in the comment) and a moved tag cannot change what runs here; tools/ciconfig checks
  # it. An update is a new commit hash taken from the release it names.
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
      actions: read # the CI run of the tagged commit is looked up
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # a tag is published only when it is a version on the history of main (deploy/release-check.sh)
      - name: Check the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: deploy/release-check.sh "$GITHUB_REF_NAME"

      # a release is a commit that passed CI: a tag on a commit with no successful run of ci.yml (a red one, one still running, or one that
      # was cancelled) publishes nothing. When the run of that commit was cancelled (a newer push to a pull request branch does that), open it
      # in Actions > CI and re-run all its jobs, then re-run this workflow.
      - name: Check that CI passed on the commit
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          passed=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "${passed:-0}" -eq 0 ]; then
            echo "::error::the CI workflow has no successful run for $GITHUB_SHA: wait for it, or re-run it if it was cancelled or failed by chance"
            exit 1
          fi

      # only the highest release version moves :latest: a hotfix tag on an older line (v1.0.1 after v1.1.0) must not move it back
      - name: Is this the newest release
        id: newest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if deploy/release-check.sh --is-newest "$GITHUB_REF_NAME"; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      # a manual run is for test containers: it must not take a name that a release has or will have (:latest, :1.2.3, :1.2, :1), or move
      # one from a branch that was never reviewed
      - name: Check the tag of a manual run
        if: github.event_name == 'workflow_dispatch' && inputs.push
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
          "" | *[!A-Za-z0-9_.-]*) echo "::error::'$TAG' is not an image tag"; exit 1 ;;
          latest | v[0-9]* | [0-9]*) echo "::error::'$TAG' is the name of a release (latest or a version): use another name for a test container"; exit 1 ;;
          esac

      # registry paths must be lowercase; the owner name may not be
      - name: Image name
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/chaos-gateway" >> "$GITHUB_OUTPUT"

      - name: Build metadata
        id: build
        run: |
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # the image smoke test of each platform before anything is pushed (deploy/smoke-image.sh)
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: chaos-gateway:smoke-amd64
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha,scope=image
      - run: deploy/smoke-image.sh linux/amd64 chaos-gateway:smoke-amd64
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          load: true
          tags: chaos-gateway:smoke-arm64
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha,scope=image
      - run: deploy/smoke-image.sh linux/arm64 chaos-gateway:smoke-arm64

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'workflow_dispatch' || inputs.push
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') && !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ steps.newest.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.title=Chaos Gateway
            org.opencontainers.image.description=Programmable network test gateway

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      # what was pushed is what was meant: one manifest with both platforms (a build that lost a platform would install fine on
      # the machine of whoever tested it and fail on the other architecture)
      - name: Check the manifest
        if: github.event_name != 'workflow_dispatch' || inputs.push
        env:
          IMAGE_NAME: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME@$DIGEST" | tee manifest.txt
          for platform in linux/amd64 linux/arm64; do
            grep -q "Platform: *$platform\$" manifest.txt || { echo "::error::the pushed image has no $platform"; exit 1; }
          done

      # the files of the deployment, for an installation that has no Docker yet to take them out of the image
      # (docs/install.md): compose.yaml, the host setup and the update script of this release
      - name: Attach the files of the deployment to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          NEWEST: ${{ steps.newest.outputs.latest }}
        run: |
          cd deploy
          sha256sum compose.yaml host-setup.sh install.sh update.sh uninstall.sh env.example > SHA256SUMS
          # a tag with a pre-release part (v1.0.0-rc.1) is a pre-release on GitHub and does not move :latest; only the newest release is the
          # "Latest" release of GitHub, as it is the only one with :latest (a hotfix tag of an older line is not)
          flags="--prerelease=false --latest=$NEWEST"
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease=true --latest=false" ;; esac
          # the notes of the release are docs/release-notes/<tag>.md when the tag has one (M30), else generated from the commits
          notes="--generate-notes"
          if [ -f "../docs/release-notes/$GITHUB_REF_NAME.md" ]; then notes="--notes-file ../docs/release-notes/$GITHUB_REF_NAME.md"; fi
          # a re-run finds the release of the first run: `gh release create` is not called then, so its flags are set on the release itself
          # (a release made by hand, or by a run before the flags were right, would stay what it was)
          # shellcheck disable=SC2086
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" $flags
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" $notes $flags
          fi
          gh release upload "$GITHUB_REF_NAME" compose.yaml host-setup.sh install.sh update.sh uninstall.sh env.example SHA256SUMS --clobber

      - name: Summary
        run: |
          {
            echo "### Image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "digest: \`${{ steps.push.outputs.digest }}\`"
            if [ "${{ github.event_name }}" != workflow_dispatch ]; then
              echo
              echo "install: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh | sudo sh -s -- --version ${GITHUB_REF_NAME#v} --test-interface lan0\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
