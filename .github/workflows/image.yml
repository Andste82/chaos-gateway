name: Image

# Builds the multi-arch image (linux/amd64, linux/arm64) and pushes it to ghcr.io (M28).
#
#   manual     Actions > Image > Run workflow: pushes ghcr.io/<owner>/chaos-gateway:<tag> and
#              :sha-<commit> from the selected branch; use it for test containers
#   release    a pushed tag v* pushes :<version> (v1.2.3 gives 1.2.3, 1.2 and 1) and :latest, and
#              attaches the files of the deployment to the release of the tag; a tag with a pre-release
#              part (v1.0.0-rc.1) pushes only :<version> and makes a pre-release of the GitHub release. The tag must be a
#              version on the history of main (deploy/release-check.sh); nothing is built before that is checked
#
# The image is the whole gateway: chaosgw and chaosctl, the tools of the containers, Kea, BIRD, the
# interception proxy and tcpdump (deploy/Dockerfile). Each platform is built, loaded and started
# (deploy/smoke-image.sh: the arm64 image under qemu-user) before the multi-arch image is pushed,
# so a broken image never gets a tag; the builds come from the cache of the build that pushes.
# After the push the manifest is read back: both platforms must be in it. The workflow has not run on a release tag yet; the first
# real run is the first release, which docs/release.md says to make a release candidate (v1.0.0-rc.1) first.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag for a manual run
        default: test
        required: true
      push:
        description: "Push to ghcr.io (off = build only)"
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      # a tag is published only when it is a version on the history of main (deploy/release-check.sh)
      - name: Check the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: deploy/release-check.sh "$GITHUB_REF_NAME"

      # a manual run is for test containers: it must not take a name that a release has or will have (:latest, :1.2.3, :1.2, :1), or move
      # one from a branch that was never reviewed
      - name: Check the tag of a manual run
        if: github.event_name == 'workflow_dispatch' && inputs.push
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
          "" | *[!A-Za-z0-9_.-]*) echo "::error::'$TAG' is not an image tag"; exit 1 ;;
          latest | v[0-9]* | [0-9]*) echo "::error::'$TAG' is the name of a release (latest or a version): use another name for a test container"; exit 1 ;;
          esac

      # registry paths must be lowercase; the owner name may not be
      - name: Image name
        id: name
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/chaos-gateway" >> "$GITHUB_OUTPUT"

      - name: Build metadata
        id: build
        run: |
          echo "version=$(git describe --tags --always --dirty)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # the image smoke test of each platform before anything is pushed (deploy/smoke-image.sh)
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: chaos-gateway:smoke-amd64
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha,scope=image
      - run: deploy/smoke-image.sh linux/amd64 chaos-gateway:smoke-amd64
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/arm64
          load: true
          tags: chaos-gateway:smoke-arm64
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha,scope=image
      - run: deploy/smoke-image.sh linux/arm64 chaos-gateway:smoke-arm64

      - uses: docker/login-action@v4
        if: github.event_name != 'workflow_dispatch' || inputs.push
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Chaos Gateway
            org.opencontainers.image.description=Programmable network test gateway

      - uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      # what was pushed is what was meant: one manifest with both platforms (a build that lost a platform would install fine on
      # the machine of whoever tested it and fail on the other architecture)
      - name: Check the manifest
        if: github.event_name != 'workflow_dispatch' || inputs.push
        env:
          IMAGE_NAME: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME@$DIGEST" | tee manifest.txt
          for platform in linux/amd64 linux/arm64; do
            grep -q "Platform: *$platform\$" manifest.txt || { echo "::error::the pushed image has no $platform"; exit 1; }
          done

      # the files of the deployment, for an installation that has no Docker yet to take them out of the image
      # (docs/install.md): compose.yaml, the host setup and the update script of this release
      - name: Attach the files of the deployment to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd deploy
          sha256sum compose.yaml host-setup.sh install.sh update.sh uninstall.sh env.example > SHA256SUMS
          # a tag with a pre-release part (v1.0.0-rc.1) is a pre-release on GitHub and does not move :latest
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          # the notes of the release are docs/release-notes/<tag>.md when the tag has one (M30), else generated from the commits
          notes="--generate-notes"
          if [ -f "../docs/release-notes/$GITHUB_REF_NAME.md" ]; then notes="--notes-file ../docs/release-notes/$GITHUB_REF_NAME.md"; fi
          # shellcheck disable=SC2086
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" $notes $flags
          gh release upload "$GITHUB_REF_NAME" compose.yaml host-setup.sh install.sh update.sh uninstall.sh env.example SHA256SUMS --clobber

      - name: Summary
        run: |
          {
            echo "### Image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "digest: \`${{ steps.push.outputs.digest }}\`"
            if [ "${{ github.event_name }}" != workflow_dispatch ]; then
              echo
              echo "install: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.sh | sudo sh -s -- --version ${GITHUB_REF_NAME#v} --test-interface lan0\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
