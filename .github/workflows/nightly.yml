name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      fuzz:
        description: 'run the fuzz job too (six targets, 45 minutes each)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Long fuzz runs on the executor's interface (plan M3, M29): the CI run fuzzes for 6 minutes, this one for 45 minutes per target
  # (the six targets of `make fuzz`: the operation decoder, the request handling, the connection, the capture request, its files and the
  # capture filter). A crashing input is uploaded: it is the reproducer, and belongs in the testdata/fuzz of its package.
  # FuzzCaptureOpenFiles runs as root (FUZZ_ROOT_TARGETS of the Makefile): an unprivileged capture fails at the raw socket before it makes
  # a file, which is what the target is about. The corpus that Go finds (GOCACHE/fuzz) is kept from night to night, so that a night goes on
  # where the last one stopped and does not start from the seeds again; it is saved after a failed run too, and a change of a fuzz test
  # (its arguments are what a corpus entry holds) starts a new one. The 330 minutes are the six targets of 45 minutes (observed: 271).
  fuzz:
    if: github.event_name == 'schedule' || inputs.fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ hashFiles('internal/executor/fuzz*_test.go', 'internal/capture/fuzz_test.go') }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ hashFiles('internal/executor/fuzz*_test.go', 'internal/capture/fuzz_test.go') }}-
      - run: make fuzz FUZZTIME=45m FUZZ_ROOT_CMD="sudo -E env PATH=$PATH HOME=$HOME"
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ hashFiles('internal/executor/fuzz*_test.go', 'internal/capture/fuzz_test.go') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashers
          path: |
            internal/executor/testdata/fuzz
            internal/capture/testdata/fuzz
          if-no-files-found: ignore

  # Level 2 (plan §4.5, M5b): the gateway in a QEMU VM from the Ubuntu cloud image, host setup, Docker
  # and the executor container inside, traffic from a client namespace through the VM, and a port forward
  # (M35a) to the client namespace next to a port a container publishes (the go toolchain above builds the
  # test's listener); the recovery and the stop (M27); and the container deployment of M28: the host setup
  # with the image, compose.yaml, the setup wizard, a device that gets its lease from Kea, S7 (netplan,
  # systemd-networkd, NetworkManager), a reboot and the update script during an idle gateway and during a
  # run (TestContainerDeploymentOnCleanUbuntuHosts; the device's DHCP client is udhcpc). Hosted
  # runners offer /dev/kvm (plan Q1). Run it by hand on a branch with
  # `gh workflow run nightly.yml --ref <branch>`.
  appliance:
    name: appliance (level 2, Ubuntu ${{ matrix.release }})
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        release: ['24.04', '26.04']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install QEMU and the tools of the harness
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils python3 curl iproute2 iptables udhcpc
      - name: Allow access to /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -w /dev/kvm || { echo "::error title=No KVM::level 2 needs /dev/kvm, the runner did not offer it"; exit 1; }
      - name: Build the container image
        run: |
          docker build -f deploy/Dockerfile -t chaos-gateway:appliance .
          docker save chaos-gateway:appliance | gzip > "$RUNNER_TEMP/image.tar.gz"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/chaosgw-appliance
          key: appliance-images-${{ matrix.release }}-${{ github.run_id }}
          restore-keys: appliance-images-${{ matrix.release }}-
      - name: Run the smoke tests
        env:
          CHAOSGW_APPLIANCE_IMAGE_TAR: ${{ runner.temp }}/image.tar.gz
          CHAOSGW_APPLIANCE_RELEASES: ${{ matrix.release }}
          CHAOSGW_APPLIANCE_CACHE: ~/.cache/chaosgw-appliance
          CHAOSGW_APPLIANCE_ARTIFACTS: ${{ runner.temp }}/appliance-logs
        # A level 2 test that finds no image tar or no /dev/kvm skips and leaves `go test` green, and so does a name that is missing in the
        # -run pattern or was renamed. Like -expect-pass of the level 1 jobs, the step fails unless each test of the list ended with PASS
        # in the verbose output (the -run pattern is made from the same list).
        run: |
          set -o pipefail
          export CHAOSGW_APPLIANCE_CACHE="$HOME/.cache/chaosgw-appliance"
          tests="TestSmokeOnCleanUbuntuHosts TestRecoveryAndStopOnCleanUbuntuHosts TestContainerDeploymentOnCleanUbuntuHosts"
          pattern="^($(echo $tests | tr ' ' '|'))\$"
          go test -tags appliance -count=1 -timeout 200m -v -run "$pattern" ./internal/appliance 2>&1 | tee "$RUNNER_TEMP/appliance-test.log"
          missing=0
          for name in $tests; do
            if ! grep -q -- "--- PASS: $name " "$RUNNER_TEMP/appliance-test.log"; then
              echo "::error title=Level 2 test did not pass::$name did not end with PASS (it skipped, did not run or was renamed)"
              missing=1
            fi
          done
          exit $missing
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: appliance-logs-${{ matrix.release }}
          path: ${{ runner.temp }}/appliance-logs
          if-no-files-found: ignore

  # Nightly kernel matrix (plan §4.4, M1-02): the same level 1b tests ci.yml's testbed-vm job
  # runs on every commit, once per kernel the devcontainer carries, with the same `-expect-pass` lists
  # (.github/level1-tests.env): a level 1 test that skips on one kernel fails the night. The kernel list must
  # match .devcontainer/Dockerfile's ARG KERNELS. 26.04 has no HWE kernel of its own yet (plan §4.4); as
  # of this writing 24.04's HWE kernel is version-identical to 26.04's GA kernel (both
  # 7.0.0-38-generic), so there is no third, distinct kernel to add here today — once they
  # diverge, add its version both here and to ARG KERNELS.
  testbed-matrix:
    name: testbed matrix (level 1b, ${{ matrix.kernel }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        kernel: ['6.8.0-142-generic', '7.0.0-38-generic']
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          load: true
          tags: chaos-gateway-dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max
      - name: Enable KVM if the runner offers it
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          if [ -w /dev/kvm ]; then echo kvm=yes; else echo "::warning title=No KVM::level 1b runs emulated"; fi
      - name: Load the lists of level 1 tests that must pass
        run: grep -E '^[A-Z0-9_]+=' .github/level1-tests.env >> "$GITHUB_ENV"
      - name: Run the testbed tests in a VM with this kernel
        # The same budget as ci.yml's testbed-vm job: the engine package alone needs about 50 minutes under KVM, and
        # the slower kernel of the matrix has less headroom than the default one.
        run: |
          kvm=()
          if [ -e /dev/kvm ]; then kvm=(--device /dev/kvm); fi
          docker run --rm "${kvm[@]}" -v "$PWD:/workspace" -w /workspace chaos-gateway-dev \
            make test-vm ARGS="-kernel ${{ matrix.kernel }} -test-timeout 100m -vm-timeout 4h -measurements measurements.jsonl -expect-pass $M35A_LEVEL1,$M15_LEVEL1,$M16_LEVEL1,$M17_LEVEL1,$M18_LEVEL1,$M20_LEVEL1,$M21_LEVEL1,$M22_LEVEL1,$M23_LEVEL1,$M24_LEVEL1,$M25_LEVEL1,$M26_LEVEL1,$M27_LEVEL1,$M29_LEVEL1,$I64_LEVEL1,$KEA_LEVEL1,$I79_LEVEL1"
      # The measurement record (plan §4.3, P2-AUDIT-07): one JSON line per check of every accuracy assertion. It is
      # kept for 90 days; `go run ./tools/measurements <dirs of downloaded artifacts>` compares the nights.
      - name: Summarize the measurement record
        if: always()
        run: |
          f=measurements.jsonl
          if [ -f "$f" ]; then
            echo "measurement record ($ARTIFACT): $(wc -l < "$f") lines, $(grep -c '"pass":false' "$f" || true) failed checks" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=No measurement record::$f is missing"
          fi
        env:
          ARTIFACT: measurements-${{ matrix.kernel }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: measurements-${{ matrix.kernel }}
          path: measurements.jsonl
          retention-days: 90
          if-no-files-found: warn
