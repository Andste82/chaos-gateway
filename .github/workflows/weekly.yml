name: Weekly

on:
  schedule:
    # M1-03: the emulated branches (!testbed.Accurate()) only ever run automatically on the
    # development VPS, which has no KVM; this exercises the same software-emulation path on
    # hosted CI, where every other job normally has KVM available. Weekly, not nightly: it is a
    # sanity check on a code path that otherwise only changes with the compiler or the testbed
    # library, not with every commit.
    - cron: '23 3 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  testbed-no-kvm:
    name: testbed (level 1b, emulated)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          load: true
          tags: chaos-gateway-dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max
      # Every testbed package but internal/engine, which has a job of its own below (its run alone takes longer than
      # the 100 minutes of this one). The default test timeout of 20 minutes is far too short for the emulated run (the
      # first scheduled run hit it), hence the limits of nightly.yml.
      # The container runs as root on a checkout owned by the runner's user, so git refuses the repository and `go list`
      # fails on the VCS stamping; its empty output once made testvm fall back to ./..., engine included. Hence
      # -buildvcs=false, and the list is checked before the run: never empty, never with the engine package.
      - name: Run the testbed tests in a VM, software emulation forced
        run: |
          docker run --rm -e GOFLAGS=-buildvcs=false -v "$PWD:/workspace" -w /workspace chaos-gateway-dev sh -ec '
            all=$(go list ./...)
            pkgs=$(printf "%s\n" "$all" | grep -v "/internal/engine$" | tr "\n" " ")
            if [ -z "$pkgs" ] || printf "%s\n" $pkgs | grep -q "/internal/engine$"; then
              echo "the package list is empty or holds internal/engine: $pkgs" >&2; exit 1
            fi
            make test-vm ARGS="-no-kvm -test-timeout 100m -vm-timeout 3h $pkgs"'

  testbed-engine-no-kvm:
    name: testbed (level 1b, emulated, engine)
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          load: true
          tags: chaos-gateway-dev
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max
      # The emulated branches (!testbed.Accurate()) of the engine package: the functional assertions of its measurement
      # tests (M8b to M11), whose accuracy assertions run with real timing in ci.yml and nightly.yml (KVM). The package
      # needs about 60 minutes under KVM and about 1.7 times that emulated on a hosted runner (run 38158196621 timed out
      # at 100 minutes with the last slow test running, P2-AUDIT-14), hence a job of its own with room to spare.
      # Some tests of the package fail under emulation now and then for reasons documented in docs/development.md ("Tests
      # that fail under emulation on main as well", KNOWN below). They still run, so that a fix shows, but a run whose
      # only failures are on that list passes with a warning; any other failure fails the job, and so does a run that
      # did not finish as a test run: testvm prints the package summary also after a timeout or a panic, so the job
      # also requires the package's verdict FAIL with the test binary's exit code 1 (a timeout and a panic exit with
      # 2, and a timeout names no failed test), no other problem line, no panic and no timeout in the log.
      - name: Run the engine's testbed tests in a VM, software emulation forced
        shell: bash
        env:
          KNOWN: >-
            TestAReservationIsHonored
            TestAnAddressChangeIsAnEventWithinASecond
            TestABurstOfNeighborChangesIsOneIdentityUpdate
            TestTheIdentityMapEntryFollowsAForcedAddressChangeWithinASecond
            TestPrivateKeysStayOutOfStoreSnapshotAndLogsAndAReapplyKeepsTheTunnel
            TestAHundredWritesWithoutAHeldExecutorAreQuick
            TestSwitchingADeviceToANewFaultIdThroughTheEngineLosesNoPacketAndTheOldClassesGoLater
        run: |
          set +e
          docker run --rm -e GOFLAGS=-buildvcs=false -v "$PWD:/workspace" -w /workspace chaos-gateway-dev \
            make test-vm ARGS="-no-kvm -test-timeout 200m -vm-timeout 4h30m ./internal/engine" 2>&1 | tee engine.log
          code=${PIPESTATUS[0]}
          set -e
          [ "$code" -eq 0 ] && exit 0
          tr -d '\r' < engine.log > engine.txt
          summary=$(grep -oE '^FAIL +[^ ]*/internal/engine +[0-9]+ passed, [0-9]+ failed, [0-9]+ skipped' engine.txt | tail -n 1 || true)
          failed=$(grep -oE -- '--- FAIL: Test[A-Za-z0-9_]+' engine.txt | awk '{print $3}' | sort -u)
          count=$(printf '%s\n' "$summary" | sed -nE 's/.* ([0-9]+) failed, ([0-9]+) skipped/\1/p')
          skipped=$(printf '%s\n' "$summary" | sed -nE 's/.* ([0-9]+) skipped/\1/p')
          names=$(printf '%s\n' "$failed" | grep -c . || true)
          list=$(tr '\n' ' ' <<<"$failed")
          # the only problem testvm may report is the failed tests' exit code 1: a timeout or a panic of the test
          # binary is exit code 2, a VM that ended early leaves no completion marker
          problems=$(grep -E '^problem: ' engine.txt || true)
          others=$(grep -vE '^problem: [^ ]*/internal/engine: exit code 1$' <<<"$problems" | grep . || true)
          if [ -z "$summary" ] || [ "$skipped" != 0 ] || [ "$count" != "$names" ] || [ "$names" -eq 0 ] ||
            [ -z "$problems" ] || [ -n "$others" ] || grep -qE '^panic: |test timed out after' engine.txt; then
            echo "the run did not finish as a test run (exit $code, summary '$summary', $names failed tests named," \
              "problems: $(tr '\n' ';' <<<"$problems"))" >&2
            exit 1
          fi
          unknown=$(for f in $failed; do case " $KNOWN " in *" $f "*) ;; *) echo "$f" ;; esac; done)
          if [ -n "$unknown" ]; then
            echo "failures that are not known emulated failures: $(tr '\n' ' ' <<<"$unknown")" >&2
            exit 1
          fi
          echo "::warning title=Known emulated failures::$list"
          echo "known emulated failures only (docs/development.md): $list" >> "$GITHUB_STEP_SUMMARY"

  # The arm64 image on an emulated ARM64 machine (M28, plan §4.4, M1-02): the functional smoke test of level 2, in a QEMU virt machine
  # from the Ubuntu arm64 cloud image under software emulation: the host setup, Docker, the arm64 image, the executor and BIRD
  # containers, the configuration applied and traffic through the gateway, the three-port topology on Ubuntu 24.04 (a second release and
  # the two-port topology run on x86-64 every night). It takes hours, hence weekly. Performance and the accuracy of the faults need
  # hardware (H1); this is the proof that the image and the deployment work on the architecture, not of its speed.
  appliance-arm64:
    name: appliance (level 2, arm64 emulated, Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Install QEMU and the tools of the harness
        run: |
          sudo apt-get update
          # ipxe-qemu holds efi-virtio.rom, the option ROM of the virtio NIC: qemu-system-x86 depends on it, qemu-system-arm only recommends
          # it, and without it qemu-system-aarch64 stops at once with 'failed to find romfile "efi-virtio.rom"' (weekly run 41222994170)
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-efi-aarch64 ipxe-qemu qemu-utils cloud-image-utils python3 curl iproute2 iptables
      - name: Build the arm64 image
        run: |
          docker buildx build --platform linux/arm64 -f deploy/Dockerfile -t chaos-gateway:appliance \
            --output type=docker,dest="$RUNNER_TEMP/image.tar" .
          gzip -f "$RUNNER_TEMP/image.tar"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/chaosgw-appliance
          key: appliance-images-arm64-${{ github.run_id }}
          restore-keys: appliance-images-arm64-
      - name: Run the smoke test on the emulated ARM64 machine
        env:
          CHAOSGW_APPLIANCE_IMAGE_TAR: ${{ runner.temp }}/image.tar.gz
          CHAOSGW_APPLIANCE_ARCH: arm64
          CHAOSGW_APPLIANCE_ALLOW_TCG: '1'
          CHAOSGW_APPLIANCE_RELEASES: '24.04'
          CHAOSGW_APPLIANCE_TOPOLOGIES: three
          CHAOSGW_APPLIANCE_ARTIFACTS: ${{ runner.temp }}/appliance-logs
        run: |
          export CHAOSGW_APPLIANCE_CACHE="$HOME/.cache/chaosgw-appliance"
          go test -tags appliance -count=1 -timeout 320m -v -run 'TestSmokeOnCleanUbuntuHosts' ./internal/appliance
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: appliance-logs-arm64
          path: ${{ runner.temp }}/appliance-logs
          if-no-files-found: ignore
