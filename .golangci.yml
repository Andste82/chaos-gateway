version: "2"

run:
  timeout: 5m
  # lint the namespace testbed tests and the appliance VM harness too
  build-tags:
    - testbed
    - appliance

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - nolintlint
    - unconvert
    - usestdlibvars
    - copyloopvar
  settings:
    errcheck:
      # writing to a terminal or a buffer: nothing useful to do on failure
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    generated: lax
    paths:
      - internal/apiserver
      - internal/model
      - web
      - clients

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Andste82/chaos-gateway
