# Example request bodies (schema `OverlayRequest`), one per overlay kind (plan §2.1.1).
- # plan §2.15: profile activation with TTL
  target: {device: esp32-42}
  profile: bad-lte
  ttl: 5m
- # fault: asymmetric, with a lease the test job must renew
  target: {device: esp32-42}
  fault:
    destination: {hostname: broker.example.com}
    protocol: tcp
    ports: [8883]
    upload: {latency: 200ms, jitter: 20ms, distribution: normal}
    download: {burst_loss: {p: 1%, r: 30%}}
  lease: 30s
- # E1: network offline as overlay
  target: {network: IoT}
  fault: {blackout: true}
- # E9: per-device rate on a network
  target: {network: IoT}
  fault: {latency: 150ms, jitter: 50ms, loss: 3%, rate: 2Mbit}
- # E10: tunnel fault, no target
  fault: {family: tunnel, tunnel: {client: lab-rA}, latency: 50ms}
- # rule: drop MQTT and cut existing connections
  target: {device: esp32-42}
  rule: {action: drop, protocol: tcp, ports: [8883], cut_existing: true}
- # DNS fault
  target: {group: sensors}
  dns: {names: [broker.example.com, '*.iot.example.com'], action: servfail}
  ttl: 2m
- # TLS case
  target: {device: esp32-42}
  tls: {case: expired, ports: [8883], cut_existing: true}
- # TLS interception (M22): the HTTP(S) traffic of a device that trusts the test CA, a server that answers 503, a slow one, a changed header
  target: {device: esp32-42}
  tls:
    case: intercept
    ports: [443]
    intercept:
      http_rules:
        - {match: {host: api.example.com, path_prefix: /v1/telemetry}, action: status, status: 503}
        - {match: {host: ota.example.com}, action: delay, delay: 2s}
        - {match: {host: ota.example.com}, action: modify, modify: {response_headers: {Cache-Control: no-store}}}
  ttl: 10m
- # DHCP action
  target: {device: esp32-42}
  dhcp: {action: force_new_ip}
- # flapping
  target: {device: esp32-42}
  fault: {flapping: {up: 20s, down: 10s}}
- # WireGuard action: link down for a convergence test, no target
  wireguard: {link: site-b, action: disable}
  ttl: 20s
- # time fault (M34): a certificate that is not yet valid, whatever server the device asks
  target: {device: esp32-42}
  time: {offset: +400d}
  ttl: 10m
- # time fault: the time of 1970 and a drift on top, only for the queries to one server
  target: {group: sensors}
  time: {destination: {hostname: time.google.com}, absolute: '1970-01-01T00:00:00Z', skew_ppm: 500}
- # time fault: the server asks the clients to poll less often (kiss-of-death RATE)
  target: {network: IoT}
  time: {answer: kiss_of_death, kiss_code: RATE}
- # time fault: the minutes before a leap second
  target: {device: esp32-42}
  time: {absolute: '2016-12-31T23:55:00Z', leap: insert}
- # time fault: no answer, the query is counted (a drop rule would not count it, and would drop other UDP 123 traffic too)
  target: {device: esp32-42}
  time: {answer: silence}
- # time fault: the 32-bit time_t of a device runs out five minutes later (2038-01-19T03:14:07Z)
  target: {device: esp32-42}
  time: {absolute: '2038-01-19T03:09:07Z'}
- # time fault: the second era of the NTP timestamp starts five minutes later (2036-02-07T06:28:16Z), where the 32-bit seconds wrap to zero
  target: {device: esp32-42}
  time: {absolute: '2036-02-07T06:23:16Z'}
- # time fault: a year ahead and a day behind, the two presets of a certificate that is not yet valid or has just expired
  target: {group: sensors}
  time: {offset: +1y}
- target: {group: sensors}
  time: {destination: {cidr: 192.0.2.123/32}, offset: -1d}
- # time fault: a server that says it is not synchronized (leap indicator 3, stratum 16)
  target: {device: esp32-42}
  time: {answer: unsynchronized}
- # time fault: an answer a client must refuse, whose origin timestamp is not the one it sent
  target: {device: esp32-42}
  time: {answer: origin_mismatch}
