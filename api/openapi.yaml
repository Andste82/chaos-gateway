openapi: 3.0.3
info:
  title: Chaos Gateway API
  version: 1.0.0-draft.1
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    REST API of Chaos Gateway (plan `docs/plan.md` §2.15). This file is the
    **source of truth** for the domain model and the API (spec-first, plan §3.7):
    Go server types are generated with `oapi-codegen`, the TypeScript client with
    Orval, the Python client with `openapi-python-client`.

    OpenAPI 3.0.3 is used on purpose (not 3.1): `oapi-codegen` and `kin-openapi`
    (request validation) fully support 3.0 only.

    ## Conventions (normative)

    | Topic | Rule |
    |---|---|
    | Base path | `/api/v1`; additive changes stay in v1, breaking changes get `/api/v2` |
    | Identity | every configuration object has a UUID and a unique, renameable `name`; paths accept either. Names match `Name` and are unique per object type, compared case-insensitively |
    | References | inside a configuration, references are stored as UUIDs. Requests may use names; the server resolves them to UUIDs when it creates the candidate revision or the overlay |
    | Collections in the configuration | maps keyed by the object's UUID (not arrays), so a JSON Merge Patch can add, change (`{"<uuid>": {...}}`) and delete (`{"<uuid>": null}`) single objects. New objects get a client-generated UUID (v4 or v7). Ordered lists (access rules) keep their order in a separate id array |
    | Editing | the configuration is changed only through candidate revisions (`POST /revisions` with a full `Configuration` or an `application/merge-patch+json` patch, base revision in `If-Match`). The resource endpoints (`/networks`, `/devices`, …) are read-only views of the active revision (or of a candidate with `?revision=`) joined with observed state |
    | Base revision | only in `If-Match`; the active revision id is the `ETag` of configuration reads. A missing `If-Match` on `POST /revisions` gives `428 precondition_required` |
    | Partial updates | JSON Merge Patch (RFC 7396) on candidate revisions |
    | Durations | Go duration strings (`90s`, `5m`, `1h30m`), schema `Duration` |
    | Percentages | strings with a `%` suffix (`0.1%`, `10%`), schema `Percentage` |
    | Bit rates | strings with a unit (`500kbit`, `2Mbit`, `1Gbit`; decimal, bits per second), schema `Bitrate` |
    | Sizes | strings with a binary unit (`512MiB`, `5GiB`), schema `ByteSize` |
    | Time stamps | RFC 3339 with time zone, UTC in responses. TTLs, leases and schedules run on the monotonic clock; time stamps are for display |
    | Lists | cursor pagination (`cursor`, `limit`), response `{items, next_cursor}`; `next_cursor` is absent on the last page |
    | Errors | RFC 9457 `application/problem+json`, schema `Problem`, with a stable `code` (table below) |
    | Generation | every apply, overlay change and identity update produces a new generation (monotonic integer, never reused, persisted across restarts). Writes return it in the `Chaos-Generation` header and return only after verification; `GET /state` shows the current one; the SSE event `applied` announces it |
    | Idempotency | `Idempotency-Key` on `POST /overlays`, `/runs`, `/scenarios/{id}/runs`, `/captures`, `/revisions`, kept for 24 h. The same key with a different body gives `422 idempotency_conflict` |
    | Busy target | runs are queued by default; `?queue=false` returns `409 target_busy` |
    | Capabilities | features whose milestone is not in this build are rejected with `422 unsupported_feature`; `GET /capabilities` lists what is available. Each operation names its milestone in `x-milestone` |
    | Events | `GET /events` is a Server-Sent Events stream; each event has an `id`, the `event` field carries `Event.type`, `data` is an `Event` as JSON. Reconnecting with `Last-Event-ID` replays missed events from a buffer of at least 10 min |
    | Strict decoding | request bodies are decoded strictly: unknown fields are rejected with `422 validation_failed` (error code `unknown_field`). OpenAPI 3.0 cannot say `additionalProperties: false` together with `allOf`, so this is a server rule, not visible in the schemas. Members of `oneOf` unions (e.g. `Network`) must be decoded strictly as well |
    | Exactly one of | objects documented as "exactly one of …" (overlay and step types, scopes, destinations, check types) are validated by the server; schemas use `minProperties`/`maxProperties` where possible |
    | Device namespace | devices, WireGuard clients and probes share one UUID and one name namespace (a client or probe *is* a device; `Scope.device` can name all three) |
    | Secrets | private keys, password hashes and token values never appear in responses, events, logs or exports, except the one-time token value at creation, WireGuard exports and revision exports with `include_secrets=true`, which are explicitly secret downloads (scope `full`, audit-logged) |
    | Internal API | paths under `/internal` (`x-internal: true`) are used only by Chaos Gateway's own service containers (DNS proxy, TLS responder, Kea hook) with a service token from the shared secrets volume (scope `service`); they are not part of the public client and may change between releases |

    ## Authentication and scopes

    The UI uses an HTTP-only session cookie (`cookieAuth`); unsafe methods with a
    session cookie also need the `X-CSRF-Token` header from `GET /auth/session`.
    Automation uses bearer tokens (`bearerAuth`). Each operation names the minimum
    token scope in `x-required-scope`:

    | Scope | Allows |
    |---|---|
    | `read` | all `GET` operations except secret downloads |
    | `overlays` | `read` plus overlays, runs, captures, diagnostics, probe calibration, own `reset` |
    | `full` | everything: revisions, `reset?owner=all`, tokens, secret downloads (WireGuard exports, revision exports with secrets, capture key logs), test CA regeneration, HTTPS certificate |
    | `service` | only `/internal` paths; tokens are generated at start for the service containers, never by users |

    The admin session has `full`. Overlay owner is the token, the run, or — for UI
    actions — the admin user (not the browser session).

    ## Error codes

    | `code` | HTTP | Meaning |
    |---|---|---|
    | `bad_request` | 400 | malformed JSON, wrong content type |
    | `unauthorized` | 401 | no or invalid session/token |
    | `forbidden` | 403 | authenticated, but scope too small |
    | `csrf_failed` | 403 | session request without valid `X-CSRF-Token` |
    | `not_found` | 404 | unknown id or name |
    | `revision_conflict` | 409 | `If-Match` is not the active revision any more; reload and reapply |
    | `confirm_pending` | 409 | another revision is waiting for commit-confirm |
    | `target_busy` | 409 | a run is active on the target and `?queue=false` was given |
    | `name_taken` | 409 | a name is already used by another object of the same type |
    | `not_a_candidate` | 409 | the revision is not in the state the operation needs (apply/preview/discard on a non-candidate, confirm on a revision that is not `pending_confirm`) |
    | `setup_completed` | 409 | `POST /setup` after setup was finished |
    | `validation_failed` | 422 | schema or semantic validation failed; `errors[]` lists each problem with a JSON pointer; `references[]` lists active overlays and runs that block a deletion (`?force=true` removes them) |
    | `capacity_exceeded` | 422 | the configuration needs more tc classes or fault ids than allowed (`errors[]` names the scope and interface) |
    | `lockout_protected` | 422 | the change would remove control-plane access from the management network |
    | `unsupported_feature` | 422 | the feature's milestone is not in this build (`GET /capabilities`) |
    | `idempotency_conflict` | 422 | the `Idempotency-Key` was used with a different request |
    | `precondition_required` | 428 | `If-Match` missing |
    | `rate_limited` | 429 | too many login attempts; `Retry-After` is set |
    | `apply_failed` | 500 | the executor failed; the previous state was restored |
    | `verify_failed` | 500 | the kernel state did not match the target after apply; the previous state was restored |
    | `internal` | 500 | unexpected error |
    | `unavailable` | 503 | executor not connected, safe mode, or setup not finished |
servers:
  - url: /api/v1
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: system
    description: setup, state, capabilities, preflight, health
  - name: auth
    description: login, session, API tokens
  - name: revisions
    description: candidate revisions, preview, apply, commit-confirm, export
  - name: config
    description: read-only views of the configuration joined with observed state
  - name: wireguard
    description: WireGuard networks, clients, exports
  - name: routing
    description: static routes and BIRD
  - name: devices
    description: configured and discovered devices, flows, leases
  - name: overlays
    description: runtime faults, profile activations, rules, DNS/TLS/DHCP overlays
  - name: runs
    description: scenario runs, reports
  - name: captures
    description: packet captures
  - name: diagnostics
    description: diagnostics, probes, calibration
  - name: observability
    description: explain, events, metrics, audit log
  - name: internal
    description: used only by Chaos Gateway's own service containers (`x-internal`)
paths:
  # ------------------------------------------------------------------ system
  /setup:
    get:
      tags: [system]
      operationId: getSetup
      summary: First-start status and the data the setup wizard needs
      description: Available without authentication. After setup, only `completed` is returned.
      security: []
      x-milestone: M5
      x-required-scope: none
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SetupStatus'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [system]
      operationId: completeSetup
      summary: Finish first-start setup
      description: |
        Requires the one-time setup token from the container log. Creates revision 1
        from the request, applies it with commit-confirm, sets the admin password and
        restricts the UI/API to the management network. Fails with `409` once setup is done.
      security:
        - setupToken: []
      x-milestone: M5
      x-required-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SetupRequest'}
      responses:
        '200':
          description: Setup applied; the revision waits for confirmation
          headers:
            Chaos-Generation: {$ref: '#/components/headers/Chaos-Generation'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplyResult'}
        default: {$ref: '#/components/responses/Problem'}
  /state:
    get:
      tags: [system]
      operationId: getState
      summary: Current generation, active revision, pending confirmation, last apply
      x-milestone: M5
      x-required-scope: read
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GatewayState'}
        default: {$ref: '#/components/responses/Problem'}
  /capabilities:
    get:
      tags: [system]
      operationId: getCapabilities
      summary: Features available in this build
      x-milestone: M5
      x-required-scope: read
      responses:
        '200':
          description: Capabilities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capabilities'}
        default: {$ref: '#/components/responses/Problem'}
  /system/info:
    get:
      tags: [system]
      operationId: getSystemInfo
      summary: Version, host, kernel, architecture, boot id
      x-milestone: M5
      x-required-scope: read
      responses:
        '200':
          description: System information
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemInfo'}
        default: {$ref: '#/components/responses/Problem'}
  /system/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Health of the managed components
      description: Without authentication only the overall `status` is returned (container health check).
      security: []
      x-milestone: M5
      x-required-scope: none
      responses:
        '200':
          description: Healthy or degraded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503':
          description: Unhealthy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /system/preflight:
    get:
      tags: [system]
      operationId: getPreflight
      summary: Result of the last preflight check (plan §3.4)
      x-milestone: M5
      x-required-scope: read
      responses:
        '200':
          description: Preflight report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreflightReport'}
        default: {$ref: '#/components/responses/Problem'}
  /system/interfaces:
    get:
      tags: [system]
      operationId: listHostInterfaces
      summary: Physical host interfaces and their assignment
      x-milestone: M5
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Host interfaces
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HostInterfacePage'}
        default: {$ref: '#/components/responses/Problem'}
  /system/busy:
    get:
      tags: [system]
      operationId: getBusy
      summary: Whether runs are active or queued (for update scripts)
      x-milestone: M15
      x-required-scope: read
      responses:
        '200':
          description: Busy state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Busy'}
        default: {$ref: '#/components/responses/Problem'}
  /reset:
    post:
      tags: [overlays]
      operationId: reset
      summary: Remove overlays and stop runs
      description: By default only the caller's overlays and runs. `owner=all` needs scope `full`.
      x-milestone: M8a
      x-required-scope: overlays
      parameters:
        - name: owner
          in: query
          schema:
            type: string
            enum: [self, all]
            default: self
      responses:
        '200':
          description: What was removed
          headers:
            Chaos-Generation: {$ref: '#/components/headers/Chaos-Generation'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ResetResult'}
        default: {$ref: '#/components/responses/Problem'}

  # ------------------------------------------------------------------ auth
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in as admin; sets the session cookie
      security: []
      x-milestone: M5
      x-required-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Logged in
          headers:
            Set-Cookie:
              description: '`chaosgw_session`, HttpOnly, Secure, SameSite=Strict'
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      x-milestone: M5
      x-required-scope: read
      responses:
        '204': {description: Logged out}
        default: {$ref: '#/components/responses/Problem'}
  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Current session or token, its scope and the CSRF token
      x-milestone: M5
      x-required-scope: read
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/password:
    post:
      tags: [auth]
      operationId: changePassword
      summary: Change the admin password; ends all other sessions
      x-milestone: M5
      x-required-scope: full
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChange'}
      responses:
        '204': {description: Changed}
        default: {$ref: '#/components/responses/Problem'}
  /auth/tokens:
    get:
      tags: [auth]
      operationId: listTokens
      summary: API tokens (never their values)
      x-milestone: M5
      x-required-scope: full
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Tokens
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiTokenPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [auth]
      operationId: createToken
      summary: Create an API token; the value is returned once
      x-milestone: M5
      x-required-scope: full
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApiTokenCreate'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiTokenCreated'}
        default: {$ref: '#/components/responses/Problem'}
  /auth/tokens/{tokenId}:
    delete:
      tags: [auth]
      operationId: deleteToken
      summary: Revoke a token
      x-milestone: M5
      x-required-scope: full
      parameters:
        - name: tokenId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '204': {description: Revoked}
        default: {$ref: '#/components/responses/Problem'}

  # ------------------------------------------------------------------ revisions
  /revisions:
    get:
      tags: [revisions]
      operationId: listRevisions
      summary: Revisions, newest first
      x-milestone: M5
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/RevisionStatus'}
      responses:
        '200':
          description: Revisions (without configuration bodies)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RevisionPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [revisions]
      operationId: createRevision
      summary: Create a candidate revision
      description: |
        Body: a complete `Configuration` (`application/json`, also used for import)
        or a JSON Merge Patch against the base revision (`application/merge-patch+json`).
        The server merges, resolves names to UUIDs, generates WireGuard keys for new
        clients and links (and for a raised `key.generation`), assigns `created_at` to new
        faults, and validates. A candidate that fails validation is **not** stored; the
        response is `422 validation_failed`.
      x-milestone: M5
      x-required-scope: full
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: message
          in: query
          description: Short description stored with the revision
          schema: {type: string, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Configuration'}
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/ConfigurationPatch'}
      responses:
        '201':
          description: Candidate created
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Revision'}
        default: {$ref: '#/components/responses/Problem'}
  /revisions/active:
    get:
      tags: [revisions]
      operationId: getActiveRevision
      summary: The active revision with its configuration
      x-milestone: M5
      x-required-scope: read
      responses:
        '200':
          description: Active revision
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RevisionWithConfiguration'}
        default: {$ref: '#/components/responses/Problem'}
  /revisions/{revisionId}:
    parameters:
      - $ref: '#/components/parameters/RevisionId'
    get:
      tags: [revisions]
      operationId: getRevision
      summary: One revision with its configuration
      x-milestone: M5
      x-required-scope: read
      responses:
        '200':
          description: Revision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RevisionWithConfiguration'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [revisions]
      operationId: discardRevision
      summary: Discard a candidate
      x-milestone: M5
      x-required-scope: full
      responses:
        '204': {description: Discarded}
        default: {$ref: '#/components/responses/Problem'}
  /revisions/{revisionId}/preview:
    post:
      tags: [revisions]
      operationId: previewRevision
      summary: Dry run against the active revision, overlays and observed state
      x-milestone: M5
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preview'}
        default: {$ref: '#/components/responses/Problem'}
  /revisions/{revisionId}/apply:
    post:
      tags: [revisions]
      operationId: applyRevision
      summary: Apply a candidate (returns after verify)
      description: |
        Fails with `409 revision_conflict` if the candidate's base is not the active
        revision, `409 confirm_pending` if another revision waits for confirmation, and
        `422 validation_failed` with `references[]` if it deletes objects used by active
        overlays or runs (`force=true` removes those overlays and aborts those runs).
        Lockout-relevant changes (plan §2.14) become `pending_confirm` and are rolled back
        unless confirmed before `confirm_deadline`.
      x-milestone: M5
      x-required-scope: full
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - name: force
          in: query
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Applied (active or pending confirmation)
          headers:
            Chaos-Generation: {$ref: '#/components/headers/Chaos-Generation'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApplyResult'}
        default: {$ref: '#/components/responses/Problem'}
  /revisions/{revisionId}/confirm:
    post:
      tags: [revisions]
      operationId: confirmRevision
      summary: Confirm a revision waiting for commit-confirm
      x-milestone: M5
      x-required-scope: full
      parameters:
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: Confirmed; it is now last-known-good
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Revision'}
        default: {$ref: '#/components/responses/Problem'}
  /revisions/{revisionId}/clone:
    post:
      tags: [revisions]
      operationId: cloneRevision
      summary: New candidate with this revision's configuration, based on the active one (used for rollback)
      x-milestone: M5
      x-required-scope: full
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '201':
          description: Candidate created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Revision'}
        default: {$ref: '#/components/responses/Problem'}
  /revisions/{revisionId}/diff:
    get:
      tags: [revisions]
      operationId: diffRevision
      summary: Domain diff between this revision and `base` (default the active revision)
      x-milestone: M5
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - name: base
          in: query
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: Domain diff
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DomainChange'}
        default: {$ref: '#/components/responses/Problem'}
  /revisions/{revisionId}/export:
    get:
      tags: [revisions]
      operationId: exportRevision
      summary: Export a revision's configuration (without secrets by default)
      description: |
        With `include_secrets=true` (scope `full`) the export contains `secrets` (WireGuard
        private and preshared keys), so it can be used as a complete backup. Importing a
        configuration without `secrets`: peers in `generated` mode and WireGuard interfaces
        whose keys are not in the secrets store get new keys when the candidate is created;
        the candidate lists them as warnings in its preview.
      x-milestone: M5
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/RevisionId'
        - name: include_secrets
          in: query
          schema: {type: boolean, default: false}
        - name: format
          in: query
          schema:
            type: string
            enum: [json, yaml]
            default: yaml
      responses:
        '200':
          description: Configuration document
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Configuration'}
            application/yaml:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}

  # ------------------------------------------------------------------ explain
  /explain:
    get:
      tags: [observability]
      operationId: explain
      summary: Effective access verdict and winning fault per family for one traffic tuple
      description: Give `device` or `src`; `dst` is an IPv4 address or a hostname.
      x-milestone: M8a
      x-required-scope: read
      parameters:
        - name: device
          in: query
          schema: {$ref: '#/components/schemas/Ref'}
        - name: src
          in: query
          schema: {type: string, format: ipv4}
        - name: dst
          in: query
          required: true
          schema: {type: string}
        - name: protocol
          in: query
          schema: {$ref: '#/components/schemas/Protocol'}
        - name: port
          in: query
          schema: {type: integer, minimum: 1, maximum: 65535}
      responses:
        '200':
          description: Explanation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Explanation'}
        default: {$ref: '#/components/responses/Problem'}

  # ------------------------------------------------------------------ config views
  /uplink:
    get:
      tags: [config]
      operationId: getUplink
      summary: Uplink selection and its observed address, gateway and resolvers
      x-milestone: M5
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/RevisionQuery'
