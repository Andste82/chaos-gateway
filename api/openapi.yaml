        MAC and the address they got by DHCP, whether they are online, and the lease. A probe is also a device (`GET /devices`
        lists it with `origin: probe`). Probes are created and changed like every other object, through a revision (`probes` of
        the configuration).
      x-milestone: M25
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/RevisionQuery'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Probes
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProbeViewPage'}
        default: {$ref: '#/components/responses/Problem'}
  /probes/{probeId}/calibrate:
    post:
      tags: [diagnostics]
      operationId: calibrateProbe
      summary: Measure what a profile or the probe's current faults really produce
      description: |
        The self-test "measure this profile" (plan §2.12). Runs synchronously for `duration` (5 s to 5 min) and compares the
        measurement with the expected values within the tolerances of plan §4.3: the median of the added delay ±2 ms + 5 %, the
        loss within the 99.9 % binomial interval of the configured rate, a throughput within ±10 % of the limit. With a `profile`
        or a `fault` the call activates it on the probe for the measurement (an overlay owned by the caller, removed afterwards,
        also when the measurement fails); without, it measures what the probe's faults produce now. The caller must not have
        an overlay of the same key on the probe already (a profile activation, or a fault without a traffic match): the
        measurement would replace it and remove it afterwards, so the call is refused with `409 target_busy` and leaves it
        alone.

        The probe sends numbered UDP datagrams to an echo server (RFC 862: it returns each datagram unchanged) at `host:port` and
        times the answers; the unimpaired round trip is measured from the gateway itself to the same server, which the faults of a
        device do not touch. When the impairment has a rate limit, a TCP echo at the same port is loaded for a third of the
        duration to measure the throughput. `host` is an IPv4 address, and like the target of a diagnostic it may be any address
        the gateway reaches (decision P6-M24-01); the audit entry `probe.calibrate` names the probe, what was measured and
        the echo server `host:port`.

        `404 not_found` for a probe or a profile that does not exist, `422 validation_failed` for a request that cannot be
        measured (both a profile and a fault, a profile without an impairment part, a host that is no IPv4 address), `409
        target_busy` while a calibration of the probe runs or the caller has such an overlay on the probe, `503 unavailable`
        for a probe that is not built yet or has no address.
      x-milestone: M25
      x-required-scope: overlays
      parameters:
        - name: probeId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Ref'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CalibrationRequest'}
      responses:
        '200':
          description: Calibration result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CalibrationResult'}
        default: {$ref: '#/components/responses/Problem'}

  # ------------------------------------------------------------------ overlays
  /overlays:
    get:
      tags: [overlays]
      operationId: listOverlays
      summary: Active overlays
      x-milestone: M8a
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: kind
          in: query
          schema: {$ref: '#/components/schemas/OverlayKind'}
        - name: owner
          in: query
