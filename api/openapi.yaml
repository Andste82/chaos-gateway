  /uplink/traffic:
    get:
      tags: [config]
      operationId: getUplinkTraffic
      summary: The uplink's download and upload rates of the last minutes, as the gateway sampled them
      description: |
        The API reads the uplink interface's byte counters every `interval_seconds` and keeps the rates
        between two readings for `period_seconds` (default 10 minutes, the overview's chart, plan §2.17) in
        memory: after a restart of the API the history starts empty. A reading that finds a counter lower
        than the one before (the interface was re-created) or another uplink interface gives no rate for
        that interval. A client loads the whole history once and then asks with `since` for the samples
        taken after the newest one it has.
      x-milestone: M12
      x-required-scope: read
      parameters:
        - name: since
          in: query
          description: Only the samples taken after this time (exclusive). Default - all samples kept.
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: Uplink traffic history
