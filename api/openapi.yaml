    post:
      tags: [overlays]
      operationId: createOverlay
      summary: Create or replace an overlay (returns after verify)
      description: |
        Exactly one of `profile`, `fault`, `rule`, `dns`, `tls`, `dhcp` must be set; it
        decides the overlay kind. An overlay with the same key *(owner, kind, target,
        selector)* is replaced and keeps its id (`200`); otherwise `201`.
      x-milestone: M8a
      x-required-scope: overlays
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
