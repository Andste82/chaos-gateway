        default: {$ref: '#/components/responses/Problem'}
  /overlays/{overlayId}:
    parameters:
      - name: overlayId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [overlays]
      operationId: getOverlay
      summary: One overlay with counters
      x-milestone: M8a
      x-required-scope: read
      responses:
        '200':
          description: Overlay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Overlay'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [overlays]
      operationId: deleteOverlay
      summary: Remove an overlay (returns after verify)
      description: Tokens with scope `overlays` may only remove their own overlays.
      x-milestone: M8a
      x-required-scope: overlays
      responses:
        '204':
          description: Removed
          headers:
            Chaos-Generation: {$ref: '#/components/headers/Chaos-Generation'}
        default: {$ref: '#/components/responses/Problem'}
  /overlays/{overlayId}/renew:
    post:
      tags: [overlays]
      operationId: renewOverlay
      summary: Renew an overlay's lease (heartbeat)
      x-milestone: M8a
      x-required-scope: overlays
      parameters:
        - name: overlayId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Renewed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Overlay'}
        default: {$ref: '#/components/responses/Problem'}

  # ------------------------------------------------------------------ runs
  /runs:
    get:
      tags: [runs]
      operationId: listRuns
      summary: Runs, newest first
      x-milestone: M15
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/RunStatus'}
        - name: scenario
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Runs (without timeline details)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [runs]
      operationId: createRun
      summary: Start a run of a stored scenario (`scenario`) or an inline one (`inline`)
      description: |
        The run is `queued` when another queued or running run has a target that overlaps this one (the same device,
        a group or network that contains it, ...), else it starts at once (`running`; its baseline is checked first, so
        a failed precondition ends it as `error`). With `queue=false` a busy target is `409 target_busy` instead. The
        scenario is validated against the active revision (references by name or UUID, resolved in the stored
        snapshot); an inline scenario is stored with the run only and changes no revision. A step type or check type
        this build does not have (`GET /capabilities`: `step_types`, `check_types`) is `422 unsupported_feature`. With
        200 runs queued or running a new one is `422 capacity_exceeded`: abort some, or wait for them.
        The owner of the run is the token, or the admin user for the UI.
      x-milestone: M15
      x-required-scope: overlays
      parameters:
        - $ref: '#/components/parameters/Queue'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunRequest'}
      responses:
        '201':
          description: Run created (queued or running)
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        default: {$ref: '#/components/responses/Problem'}
  /runs/{runId}:
    get:
      tags: [runs]
      operationId: getRun
      summary: Run with timeline, checks and artifacts
      x-milestone: M15
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        default: {$ref: '#/components/responses/Problem'}
  /runs/{runId}/abort:
    post:
      tags: [runs]
      operationId: abortRun
      summary: Abort a queued or running run; its overlays are removed
      description: |
        Returns when the run has ended and its overlays are gone (`Chaos-Generation` is the generation that removed
        them). If the overlays cannot be removed (the executor does not answer) the answer is the problem
        `apply_failed`: the run is recorded as `aborted` and its `reason` says the overlays stayed, and the gateway
        keeps trying to remove them every 10 seconds. Aborting a run that has ended already changes nothing and
        returns it. A token with the scope
        `overlays` may only abort its own runs.
      x-milestone: M15
      x-required-scope: overlays
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Aborted
          headers:
            Chaos-Generation: {$ref: '#/components/headers/Chaos-Generation'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        default: {$ref: '#/components/responses/Problem'}
  /runs/{runId}/renew:
    post:
      tags: [runs]
      operationId: renewRun
      summary: Renew a run's lease (heartbeat)
      description: |
        Extends the lease of a run started with a `lease` (the run is aborted when the lease runs out unrenewed). A
        token with the scope `overlays` may renew only its own runs (`403 forbidden`). A run without a lease, and
        a run that has ended or is being aborted, is `422 validation_failed`.
      x-milestone: M15
      x-required-scope: overlays
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Renewed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        default: {$ref: '#/components/responses/Problem'}
  /runs/{runId}/report.json:
    get:
      tags: [runs]
      operationId: getRunReportJson
      summary: Final report as JSON
      description: A run that has not ended has no report yet; the answer is `404 not_found`.
      x-milestone: M15
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunReport'}
        default: {$ref: '#/components/responses/Problem'}
  /runs/{runId}/report.xml:
    get:
      tags: [runs]
      operationId: getRunReportJunit
      summary: Final report as JUnit XML (one testsuite per run, one testcase per check, step errors as errors, zero-hit warnings as system-out or failures)
      description: A run that has not ended has no report yet; the answer is `404 not_found`.
      x-milestone: M15
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: JUnit XML
          content:
            application/xml:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /runs/{runId}/events:
    get:
      tags: [runs]
      operationId: getRunEvents
      summary: All events of the run as JSON Lines
      description: While the run goes on, the events written so far.
      x-milestone: M15
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: One `Event` per line
          content:
            application/jsonl:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}

  # ------------------------------------------------------------------ captures
  /captures:
    get:
      tags: [captures]
      operationId: listCaptures
      summary: Captures
      description: 'Newest first. `run` lists the captures a run made (`capture: true` or its `capture` steps).'
      x-milestone: M17
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: run
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Captures
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapturePage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [captures]
      operationId: startCapture
      summary: Start a capture
      description: |
        Starts recording at once and answers `201` with the running capture. The files are written by the executor
        (AF_PACKET on the interface of the scope, a kernel filter for a device or a selector, plan §2.11) below the
        gateway's capture volume; `GET /captures/{id}/download` returns them also while the capture runs. A capture
        ends by `POST /captures/{id}/stop`, by its `duration`, by reaching its `max_size` (or, with a `ring_buffer`,
        never by size: the ring keeps the newest files), when the total of all captures reaches the quota
        (`settings.retention.captures_quota`, 5 GiB by default: the oldest stopped captures are deleted first, a
        running capture that still does not fit stops with `size`), when the volume has less than 10 % free space
        (`disk_low`), or when the executor or its interface is lost (`error`, status `failed`).

        `scope` names a network (its bridge, or the WireGuard interfaces of a WireGuard network: raw IP packets), a
        device (its network's interface, filtered by its Ethernet addresses, or by its addresses on a WireGuard
        network), a selector (the packets of a source, device, group, network or global, to the `destination`,
        `protocol` and `ports`, in both directions, on the interfaces of the source) or the uplink (every packet
        of the uplink interface after NAT, not attributable to devices). The WireGuard networks of the role
        `management` are the admin's tunnel and are never recorded: a scope that names one, a device on one, or a
        group or selector source that reaches one is `422 validation_failed` with the code `management_network`
        (`global` leaves them out). A `pcap` file holds one link type; a
        scope that spans Ethernet and raw IP interfaces needs `pcapng`. A hostname destination is the addresses the
        gateway's DNS proxy has answered for the name so far, as they are when the capture starts (a device must have
        asked for the name first: `422 validation_failed` with the code `unresolved_hostname` until one has).
        Without `max_size` the capture stops at 1 GiB, also when a `duration` is given; a ring buffer is bounded by its files.

        `422 validation_failed` names the field (a scope that selects no interface, a device that has no
        address yet, a ring buffer next to a `max_size`); `422 capacity_exceeded` is the disk below 10 % free space
        or eight captures running; `422 unsupported_feature` is a deployment without a capture volume;
        `503 unavailable` is an executor that does not answer.
      x-milestone: M17
      x-required-scope: overlays
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CaptureRequest'}
      responses:
        '201':
          description: Started
          headers:
            Location:
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capture'}
        default: {$ref: '#/components/responses/Problem'}
  /captures/storage:
    get:
      tags: [captures]
      operationId: getCaptureStorage
      summary: What the captures take of the quota and of the volume
      description: |
        The sum of the sizes of all captures (a running capture as of the last second) against the quota
        (`settings.retention.captures_quota`, 5 GiB by default), the free space of the capture volume against the limit
        below which captures stop and new ones are refused (10 %), and the number of running captures against the
        most that run at once. The screen of the captures shows it.
      x-milestone: M23a
      x-required-scope: read
      responses:
        '200':
          description: Storage
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CaptureStorage'}
        default: {$ref: '#/components/responses/Problem'}
  /captures/{captureId}:
    parameters:
      - $ref: '#/components/parameters/CaptureId'
    get:
      tags: [captures]
      operationId: getCapture
      summary: One capture
      description: A running capture reports its counters as of the last second.
      x-milestone: M17
      x-required-scope: read
      responses:
        '200':
          description: Capture
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capture'}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [captures]
      operationId: deleteCapture
      summary: Delete a stopped capture and its files
      description: A capture that still runs is `422 validation_failed`; stop it first.
      x-milestone: M17
      x-required-scope: overlays
      responses:
        '204': {description: Deleted}
        default: {$ref: '#/components/responses/Problem'}
  /captures/{captureId}/stop:
    post:
      tags: [captures]
      operationId: stopCapture
      summary: Stop a running capture
      description: 'Answers when the files are closed, with the capture as stopped (`stop_reason: user`). Stopping a capture that has ended returns it unchanged.'
      x-milestone: M17
      x-required-scope: overlays
      parameters:
        - $ref: '#/components/parameters/CaptureId'
      responses:
        '200':
          description: Stopped
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capture'}
        default: {$ref: '#/components/responses/Problem'}
  /captures/{captureId}/download:
    get:
      tags: [captures]
      operationId: downloadCapture
      summary: Download the capture (also while running); `keylog` returns the TLS key log
      description: |
        `part=keylog` and captures marked `sensitive` need scope `full`. A capture that has no key log (`keylog:
        false`: no intercepted connection of its scope ran while it recorded) is `404 not_found` for `part=keylog`.
        The key log holds the secrets of the connections the interception proxy handled while the capture ran (M22), in
        the NSS format that Wireshark reads (`Edit > Preferences > Protocols > TLS > (Pre)-Master-Secret log file`). A capture of a ring buffer is one file: the files
        of the ring joined, oldest first (pcapng files join into a file of several sections, pcap files into one
        file); of a running capture only the complete records are sent.
      x-milestone: M17
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/CaptureId'
        - name: part
          in: query
          schema:
            type: string
            enum: [capture, keylog]
            default: capture
      responses:
        '200':
          description: File
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/vnd.tcpdump.pcap:
              schema: {type: string, format: binary}
            application/x-pcapng:
              schema: {type: string, format: binary}
            text/plain:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}

  # ------------------------------------------------------------------ diagnostics
  /diagnostics:
    post:
      tags: [diagnostics]
      operationId: runDiagnostic
      summary: Run one diagnostic from the gateway or a probe (synchronous, max. 60 s)
      description: |
        Runs from the gateway's own network stack, so the traffic does not pass through the faults of a device
        (plan §2.12), or, with `from.probe`, from the network stack of a probe, whose traffic takes the same path as a
        device's and meets the faults, rules and profiles that target it (M25). From a probe, host names are resolved by the DNS
        servers its DHCP lease names, and a certificate that was signed by the test CA verifies only when the probe has
        `trusts_test_ca`. A diagnostic that fails because its target fails (no reply, refused, a certificate that does not verify)
        is a `200` with `ok: false`; a request that cannot be run is a `422`: `validation_failed`, `capacity_exceeded` when eight
        diagnostics run already; `404 not_found` for a probe that does not exist and `503 unavailable` for one that is not built
        yet or has no address. A principal may start five diagnostics a second, twenty at once; more is a `429 rate_limited`
        with `Retry-After`. A token with the scope `overlays` may aim a diagnostic at any address the gateway (or the probe)
        reaches: the loopback, the management network, the Docker networks and everything behind the uplink (decision
        P6-M24-01). Every run is recorded in the audit log (`diagnostic.run`) with the type, the target that was contacted
        (for `http` with a `url` that URL, without its query) and, when it ran from a probe, the probe.
        The request must fit the 60 s: for `ping`, `count` echoes 200 ms apart plus `timeout` must not exceed it.
        Host names are resolved IPv4 only, by the gateway's DNS proxy, and by the uplink's resolvers when the proxy is
        not reachable at all.
      x-milestone: M24
      x-required-scope: overlays
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DiagnosticRequest'}
      responses:
        '200':
          description: Result (also when the diagnosed target fails)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DiagnosticResult'}
        default: {$ref: '#/components/responses/Problem'}

  # ------------------------------------------------------------------ TLS
  /tls/ca:
    get:
      tags: [config]
      operationId: getTestCa
      summary: The test CA certificate (PEM) for installation on development firmware
      description: |
        The certificate that signs the expired, not-yet-valid and hostname-mismatch certificates of the TLS responder
        (plan §2.8): a development firmware that trusts it can tell these cases apart. It is a download
        (`Content-Disposition: attachment`). Never returns the unknown CA, which signs the `untrusted_ca` case and is
        never distributed, and never a key.
      x-milestone: M21
      x-required-scope: read
      responses:
        '200':
          description: PEM certificate
          headers:
            Content-Disposition:
              schema: {type: string, example: 'attachment; filename="chaos-gateway-test-ca.pem"'}
          content:
            application/x-pem-file:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /tls/ca/regenerate:
    post:
      tags: [config]
      operationId: regenerateTestCa
      summary: Generate a new test CA (devices must install the new certificate)
      description: |
        Replaces the test CA (certificate and key) with a new one and returns its certificate. The TLS responder and the
        interception proxy load it within seconds; every device that installed the old certificate trusts nothing the
        gateway shows it until it installs the new one. The unknown CA, which is never distributed, is not changed. The
        request is recorded in the audit log (`tls.ca_regenerate`).
      x-milestone: M22
      x-required-scope: full
      responses:
        '200':
          description: New CA certificate
          content:
            application/x-pem-file:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}

  # ------------------------------------------------------------------ DNS log, certificate
  /dns/queries:
    get:
      tags: [devices]
      operationId: listDnsQueries
      summary: DNS query log of the DNS proxy, newest first
      x-milestone: M6b
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: device
          in: query
          schema: {$ref: '#/components/schemas/Ref'}
        - name: name
          in: query
          description: Exact name or `*.suffix`
          schema: {type: string}
        - name: since
          in: query
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: Queries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DnsQueryPage'}
        default: {$ref: '#/components/responses/Problem'}
  /intercept/flows:
    get:
      tags: [devices]
      operationId: listInterceptFlows
      summary: HTTP, WebSocket and raw-stream exchanges of the interception proxy, newest first
      description: |
        What the proxy saw of the connections the case `intercept` selected (plan §2.8, M22): one entry per HTTP exchange, per
        WebSocket connection and per connection that is no HTTP, with the rules that acted on it. The gateway keeps the newest
        20000 in memory; the log is empty after a restart.
      x-milestone: M22
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: device
          in: query
          schema: {$ref: '#/components/schemas/Ref'}
        - name: host
          in: query
          description: Exact host name or `*.suffix`
          schema: {type: string}
        - name: since
          in: query
          schema: {type: string, format: date-time}
        - name: faulted
          in: query
          description: Only exchanges a rule acted on.
          schema: {type: boolean}
      responses:
        '200':
          description: Exchanges
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InterceptFlowPage'}
        default: {$ref: '#/components/responses/Problem'}
  /system/certificate:
    get:
      tags: [system]
      operationId: getCertificate
      summary: The UI/API HTTPS certificate
      x-milestone: M29
      x-required-scope: read
      responses:
        '200':
          description: Certificate
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CertificateInfo'}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [system]
      operationId: replaceCertificate
      summary: Replace the self-signed HTTPS certificate (takes effect for new connections)
      x-milestone: M29
      x-required-scope: full
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CertificateUpload'}
      responses:
        '200':
          description: Installed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CertificateInfo'}
        default: {$ref: '#/components/responses/Problem'}

  # ------------------------------------------------------------------ internal (service containers)
  /internal/dhcp/lease-events:
    post:
      tags: [internal]
      operationId: postLeaseEvent
      summary: Lease event from Kea's run_script hook
      x-internal: true
      x-milestone: M6a
      x-required-scope: service
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/KeaLeaseEvent'}
      responses:
        '204': {description: Accepted}
        default: {$ref: '#/components/responses/Problem'}
  /internal/dns/config:
    get:
      tags: [internal]
      operationId: getDnsServiceConfig
      summary: Everything the DNS proxy needs (long poll)
      description: |
        Returns the current configuration at once if its generation is newer than `after`,
        otherwise waits up to 30 s and returns `204` if nothing changed. The DNS proxy calls
        it at start (registration, plan §2.6) and then in a loop; it keeps no state of its own.
      x-internal: true
      x-milestone: M6b
      x-required-scope: service
      parameters:
        - name: after
          in: query
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DnsServiceConfig'}
        '204': {description: Unchanged}
        default: {$ref: '#/components/responses/Problem'}
  /internal/dns/resolutions:
    post:
      tags: [internal]
      operationId: postDnsResolutions
      summary: Addresses returned for hostname selectors; returns after the address sets are updated
      description: |
        The proxy calls this before it sends an answer whose name is in a hostname set, so the
        device's first packet already matches (plan §2.6). The API deduplicates and batches
        concurrent calls into one executor operation (persistent netlink connection).
      x-internal: true
      x-milestone: M20
      x-required-scope: service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 1000
              items: {$ref: '#/components/schemas/DnsResolution'}
      responses:
        '204': {description: Sets updated}
        default: {$ref: '#/components/responses/Problem'}
  /internal/dns/queries:
    post:
      tags: [internal]
      operationId: postDnsQueries
      summary: Batch of query-log entries (asynchronous)
      x-internal: true
      x-milestone: M6b
      x-required-scope: service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 10000
              items: {$ref: '#/components/schemas/DnsQueryLogEntry'}
      responses:
        '204': {description: Accepted}
        default: {$ref: '#/components/responses/Problem'}
  /internal/tls/config:
    get:
      tags: [internal]
      operationId: getTlsServiceConfig
      summary: Active TLS cases for the TLS responder and proxy (long poll, as `/internal/dns/config`)
      description: |
        The cases of the kind `intercept` carry their `intercept` settings (the HTTP rules the proxy applies). `consumer`
        says who asks, for the health check: the TLS responder (default) or the interception proxy (M22).
      x-internal: true
      x-milestone: M21
      x-required-scope: service
      parameters:
        - name: after
          in: query
          schema: {type: integer, format: int64}
        - name: consumer
          in: query
          schema: {type: string, enum: [responder, proxy], default: responder}
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TlsServiceConfig'}
        '204': {description: Unchanged}
        default: {$ref: '#/components/responses/Problem'}
  /internal/tls/resolve:
    post:
      tags: [internal]
      operationId: resolveTlsConnection
      summary: The case that decides a connection the TLS responder holds, and the name to certify
      description: |
        The kernel sends every connection that some case selects by its source, destination and ports to the responder
        (plan §2.8); which case decides depends on what only the connection knows, the server name (SNI) of its
        ClientHello, so the responder reads it and asks. The answer is the decision of the precedence rules of §2.4,
        the same one `explain` shows. `case` is absent when no case decides the connection (the kernel's selection was
        wider than the case, the case went since, or its `sni` does not match): the responder then passes the
        connection through to the destination it was meant for, unchanged, when `passthrough` says the gateway would have
        forwarded it, and resets it otherwise. The case `intercept` is judged the same way: the proxy's own connection to the
        destination leaves through the gateway's service path, so `passthrough` is also given with this case and the responder
        hands the connection over only when it is true. `name` is what to put into the
        certificate when the ClientHello has no SNI: a name the gateway's DNS answered the client for the address
        (the one it answered last), else absent (a certificate for the address).
      x-internal: true
      x-milestone: M21
      x-required-scope: service
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TlsResolveRequest'}
      responses:
        '200':
          description: The decision
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TlsResolveResponse'}
        default: {$ref: '#/components/responses/Problem'}
  /internal/tls/handshakes:
    post:
      tags: [internal]
      operationId: postTlsHandshakes
      summary: Handshake outcomes seen by the TLS responder or proxy
      x-internal: true
      x-milestone: M21
      x-required-scope: service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 1000
              items: {$ref: '#/components/schemas/TlsHandshakeReport'}
      responses:
        '204': {description: Accepted}
        default: {$ref: '#/components/responses/Problem'}
  /internal/intercept/flows:
    post:
      tags: [internal]
      operationId: postInterceptFlows
      summary: HTTP, WebSocket and raw-stream exchanges seen by the interception proxy (asynchronous batch)
      x-internal: true
      x-milestone: M22
      x-required-scope: service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 1000
              items: {$ref: '#/components/schemas/InterceptFlowReport'}
      responses:
        '204': {description: Accepted}
        default: {$ref: '#/components/responses/Problem'}
  /internal/intercept/keylog:
    post:
      tags: [internal]
      operationId: postInterceptKeylog
      summary: TLS secrets of intercepted connections, for the captures that run (asynchronous batch)
      description: |
        The lines are in the NSS key log format that Wireshark reads. The API adds them to the key log of every running
        capture whose scope covers the client (`GET /captures/{id}/download?part=keylog`), which marks the capture
        `sensitive`. Nothing is kept when no capture runs: secrets of a connection that no capture saw are of no use and are not
        stored. A batch whose `overlay` names no case `intercept` in force, or one with `keylog: false`, is dropped (the proxy
        does not send such lines; the API does not take them either).
      x-internal: true
      x-milestone: M22
      x-required-scope: service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 1000
              items: {$ref: '#/components/schemas/InterceptKeylogBatch'}
      responses:
        '204': {description: Accepted}
        default: {$ref: '#/components/responses/Problem'}

  # ------------------------------------------------------------------ observability
  /events:
    get:
      tags: [observability]
      operationId: streamEvents
      summary: Server-Sent Events stream
      description: |
        `text/event-stream`. Each message: `id: <Event.id>`, `event: <Event.type>`,
        `data: <Event as JSON>`. A comment line `: keepalive` is sent every 15 s.
      x-milestone: M5
      x-required-scope: read
      x-sse-event-schema: '#/components/schemas/Event'
      parameters:
        - name: Last-Event-ID
          in: header
          schema: {type: string}
        - name: types
          in: query
          description: Comma-separated `EventType` values to receive (default all)
          schema: {type: string}
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /metrics:
    get:
      tags: [observability]
      operationId: getMetrics
      summary: Prometheus metrics
      description: |
        The gateway's metrics in the Prometheus text format (version 0.0.4), read from the engine and the kernel at the
        moment of the request; nothing is kept between two scrapes. A scraper authenticates with an API token of the
        scope `read`. All names start with `chaosgw_`.

        - Counters (the values the REST API shows as `counters`, so the two agree): `chaosgw_fault_packets_total` and
          `chaosgw_fault_bytes_total` per fault and overlay (`layer` `config` or `overlay`, `id`, `kind`, `name`),
          `chaosgw_rule_packets_total` and `chaosgw_rule_bytes_total` per access rule, overlay rule and the
          anti-lockout rule (`layer` `config`, `overlay` or `system`, `id`, `name`, `action`: the new connections each
          decided), `chaosgw_forward_connections_total` and `chaosgw_forward_bytes_total` per port forward.
          `chaosgw_counter_epoch` is the epoch of the counters as a whole (`GET /state`); a counter that starts over
          is a counter reset for Prometheus.
        - Netem queues, per fault id, direction and interface of the tc tree (`fault_id`, `layer`, `source`,
          `interface`, `direction`): `chaosgw_queue_sent_packets_total`, `chaosgw_queue_sent_bytes_total`,
          `chaosgw_queue_dropped_packets_total`, `chaosgw_queue_overlimits_total`, the gauges
          `chaosgw_queue_backlog_packets`, `chaosgw_queue_backlog_bytes` and `chaosgw_queue_epoch` (the epoch of the
          queue, which changes when it is created again).
        - Interfaces the gateway applied (the uplink, the management interface, the bridges of the test networks and
          the WireGuard interfaces; `interface`, `role`): `chaosgw_interface_up` and the counters
          `chaosgw_interface_{receive,transmit}_{bytes,packets,errors,dropped}_total`.
        - Devices (`device`, `name`, `network`, `origin`): `chaosgw_device_online`,
          `chaosgw_device_upload_bytes_per_second`, `chaosgw_device_download_bytes_per_second` and
          `chaosgw_device_flows_active` (the last three while the traffic is known; a connection between two
          devices is a flow of each), and the totals `chaosgw_devices`, `chaosgw_devices_online`,
          `chaosgw_flows_active` (the tracked connections that have a device as a party, each counted once; left out
          while unknown), `chaosgw_overlays_active`, `chaosgw_leases`, `chaosgw_runs_active` and
          `chaosgw_runs_queued`.
        - System: `chaosgw_health_ok`, `chaosgw_component_status{component,status}` (1 for the status a component has),
          `chaosgw_system_cpus`, `chaosgw_system_load{1,5,15}`, `chaosgw_system_memory_{total,available}_bytes`,
          `chaosgw_disk_{free,total}_bytes{volume}` (`state`, `captures`), `chaosgw_build_info`,
          `chaosgw_start_time_seconds`, `chaosgw_uptime_seconds`, `chaosgw_revision` and `chaosgw_apply_ok`.
        - `chaosgw_collector_up{source}` is 0 for a source that could not be read at this scrape (`counters`,
          `queues`, `interfaces`); the series that come from it are left out then, they are not reported as 0. Each
          source is read within 3 seconds: a read that hangs leaves its source out like one that fails, and the
          answer is still a 200.
      x-milestone: M26
      x-required-scope: read
      responses:
        '200':
          description: Prometheus text format
          content:
            text/plain:
              schema: {type: string}
        default: {$ref: '#/components/responses/Problem'}
  /audit:
    get:
      tags: [observability]
      operationId: listAudit
      summary: Audit log, newest first
      x-milestone: M5
      x-required-scope: read
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: since
          in: query
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPage'}
        default: {$ref: '#/components/responses/Problem'}

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: chaosgw_session
      description: Admin UI session. Unsafe methods also need the `X-CSRF-Token` header.
    bearerAuth:
      type: http
      scheme: bearer
      description: API token (`cgw_…`), scope `read`, `overlays` or `full`.
    setupToken:
      type: apiKey
      in: header
      name: X-Setup-Token
      description: One-time token printed to the container log at first start.

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 500, default: 100}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Base revision id as a quoted ETag, e.g. `"42"`.
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema: {type: string, maxLength: 128}
    RevisionQuery:
      name: revision
      in: query
      description: Read a candidate or older revision instead of the active one.
      schema: {type: integer, format: int64, minimum: 1}
    Queue:
      name: queue
      in: query
      description: '`false`: fail with `409 target_busy` instead of queueing.'
      schema: {type: boolean, default: true}
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    NetworkId:
      name: networkId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ref'}
    ClientId:
      name: clientId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ref'}
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Ref'}
    RunId:
      name: runId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CaptureId:
      name: captureId
      in: path
      required: true
      schema: {type: string, format: uuid}

  headers:
    Chaos-Generation:
      description: Generation after this write (see `GET /state`).
      schema: {type: integer, format: int64}
    ETag:
      description: Id of the active revision, quoted (`"42"`).
      schema: {type: string}

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

  schemas:
    # ============================================================ primitives
    Uuid:
      type: string
      format: uuid
    Ref:
      type: string
      minLength: 1
      maxLength: 64
      description: UUID or name of an object. Stored configurations contain UUIDs only.
    Name:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$'
      description: Unique per object type (case-insensitive); must not have the form of a UUID.
    Description:
      type: string
      maxLength: 500
    Duration:
      type: string
      pattern: '^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$'
      example: 90s
    Percentage:
      type: string
      pattern: '^(100(\.0+)?|[0-9]{1,2}(\.[0-9]+)?)%$'
      example: 0.5%
    Bitrate:
      type: string
      pattern: '^[0-9]+(\.[0-9]+)?(bit|kbit|Mbit|Gbit)$'
      example: 2Mbit
    ByteSize:
      type: string
      pattern: '^[0-9]+(B|KiB|MiB|GiB|TiB)$'
      example: 5GiB
    Ipv4:
      type: string
      format: ipv4
    Ipv4Cidr:
      type: string
      pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])/([0-9]|[12][0-9]|3[0-2])$'
      description: Network prefix; host bits must be zero.
      example: 10.20.0.0/24
    Ipv4Interface:
      type: string
      pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])/([0-9]|[12][0-9]|3[0-2])$'
      description: Address of the gateway in a network, with prefix length.
      example: 10.10.0.1/24
    Ipv4OrCidr:
      type: string
      pattern: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])(/([0-9]|[12][0-9]|3[0-2]))?$'
    MacAddress:
      type: string
      pattern: '^([0-9a-f]{2}:){5}[0-9a-f]{2}$'
      description: Lower case, colon-separated.
    Hostname:
      type: string
      maxLength: 253
      pattern: '^(\*\.)?([A-Za-z0-9_]([A-Za-z0-9_-]{0,61}[A-Za-z0-9_])?\.)*[A-Za-z0-9_]([A-Za-z0-9_-]{0,61}[A-Za-z0-9_])?$'
      description: Exact name or `*.suffix` (matches the suffix's subdomains, not the suffix itself).
    Endpoint:
      type: string
      maxLength: 260
      pattern: '^[^\s:]+:[0-9]{1,5}$'
      description: '`host:port`, host a DNS name or IPv4 address.'
      example: gw.example.com:51820
    WireGuardKey:
      type: string
      pattern: '^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw480]=$'
      description: Base64 Curve25519 public key.
    Protocol:
      type: string
      enum: [any, tcp, udp, icmp]
      default: any
    PortRange:
      type: object
      required: [from, to]
      properties:
        from: {type: integer, minimum: 1, maximum: 65535}
        to: {type: integer, minimum: 1, maximum: 65535}
    StepId:
      type: string
      pattern: '^[a-z][a-z0-9_-]{0,31}$'
      description: Unique within a scenario. `start` is reserved (check windows).

    # ============================================================ errors
    ErrorCode:
      type: string
      enum:
        - bad_request
        - unauthorized
        - forbidden
        - csrf_failed
        - not_found
        - method_not_allowed
        - payload_too_large
        - revision_conflict
        - confirm_pending
        - target_busy
        - name_taken
        - not_a_candidate
        - setup_completed
        - validation_failed
        - capacity_exceeded
        - lockout_protected
        - unsupported_feature
        - idempotency_conflict
        - precondition_required
        - rate_limited
        - apply_failed
        - verify_failed
        - internal
        - unavailable
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: '`https://chaos-gateway.dev/problems/<code>`'
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {$ref: '#/components/schemas/ErrorCode'}
        errors:
          type: array
          items: {$ref: '#/components/schemas/ValidationError'}
        references:
          type: array
          description: Active overlays and runs that block a deletion (`validation_failed`).
          items: {$ref: '#/components/schemas/BlockingReference'}
        pending_revision:
          type: integer
          format: int64
          description: With `confirm_pending` - the revision waiting for confirmation.
        active_revision:
          type: integer
          format: int64
          description: With `revision_conflict` - the currently active revision.
    ValidationError:
      type: object
      required: [path, code, message]
      properties:
        path:
          type: string
          description: JSON pointer into the request (or the merged configuration).
          example: /networks/7b0c…/dhcp/pools/0/end
        code:
          type: string
          description: Machine-readable reason, e.g. `required`, `pattern`, `jitter_exceeds_latency`, `overlapping_subnet`, `unknown_reference`, `class_limit`.
        message: {type: string}
    BlockingReference:
      type: object
      required: [kind, id, object]
      properties:
        kind:
          type: string
          enum: [overlay, run]
        id: {$ref: '#/components/schemas/Uuid'}
        owner: {$ref: '#/components/schemas/Owner'}
        object:
          type: string
          description: JSON pointer of the deleted object in the configuration.

    # ============================================================ configuration
    Configuration:
      type: object
      description: |
        The persistent configuration (plan §2.1.1). Collections are maps keyed by the
        object's UUID; see the conventions in the API description. Built-in profiles are
        not part of it.
      required: [schema_version, uplink, management]
      properties:
        schema_version:
          type: integer
          enum: [1]
        uplink: {$ref: '#/components/schemas/Uplink'}
        management: {$ref: '#/components/schemas/Management'}
        networks:
          type: object
          additionalProperties: {$ref: '#/components/schemas/Network'}
        access_matrix: {$ref: '#/components/schemas/AccessMatrix'}
        routing: {$ref: '#/components/schemas/Routing'}
        devices:
          type: object
          additionalProperties: {$ref: '#/components/schemas/Device'}
        groups:
          type: object
          additionalProperties: {$ref: '#/components/schemas/Group'}
        probes:
          type: object
          additionalProperties: {$ref: '#/components/schemas/Probe'}
        access_rules:
          type: object
          additionalProperties: {$ref: '#/components/schemas/AccessRule'}
        access_rule_order:
          type: array
          description: Evaluation order of `access_rules` (first match wins). Must contain each key of `access_rules` exactly once.
          items: {$ref: '#/components/schemas/Uuid'}
        port_forwards:
          type: object
          description: Port forwards (DNAT from the uplink or the management network, M35a), keyed by UUID; unordered.
          additionalProperties: {$ref: '#/components/schemas/PortForward'}
        faults:
          type: object
          additionalProperties: {$ref: '#/components/schemas/ConfigFault'}
        profiles:
          type: object
          additionalProperties: {$ref: '#/components/schemas/Profile'}
        scenarios:
          type: object
          additionalProperties: {$ref: '#/components/schemas/Scenario'}
        settings: {$ref: '#/components/schemas/Settings'}
        secrets: {$ref: '#/components/schemas/ConfigurationSecrets'}
    ConfigurationSecrets:
      type: object
      description: |
        Only in exports with `include_secrets=true` and accepted on import. Never returned by
        `GET /revisions/…`. Keys are moved into the secrets store when the candidate is
        created and are not stored in the revision file.
      properties:
        wireguard:
          type: object
          description: Map keyed by the UUID of a WireGuard network (its interface key), client or link (peer key).
          additionalProperties:
            type: object
            properties:
              private_key: {type: string}
              preshared_key: {type: string}
    ConfigurationPatch:
      type: object
      description: |
        JSON Merge Patch (RFC 7396) against the base revision's `Configuration`.
        Not validated on its own; the merged result is validated as a `Configuration`.
      additionalProperties: true

    InterfaceRef:
      type: object
      description: A host interface, identified by MAC address and/or name (plan §3.4). If both are given, the MAC wins and the name is updated when it changes.
      minProperties: 1
      properties:
        name: {type: string, maxLength: 15}
        mac: {$ref: '#/components/schemas/MacAddress'}
    Uplink:
      type: object
      description: The OS configures the uplink (D3); Chaos Gateway only selects it.
      required: [interface]
      properties:
        interface: {$ref: '#/components/schemas/InterfaceRef'}
        gateway:
          allOf: [{$ref: '#/components/schemas/Ipv4'}]
          description: Explicit upstream gateway. Default - the OS default route on the uplink interface.
        dns_upstream:
          type: array
          description: Upstream resolvers of the DNS proxy. Default - the host's resolvers for the uplink.
          maxItems: 4
          items: {$ref: '#/components/schemas/Ipv4'}
    Management:
      type: object
      required: [interface]
      properties:
        interface:
          allOf: [{$ref: '#/components/schemas/InterfaceRef'}]
          description: OS-owned management interface; may be the uplink interface (two-port topology).
        allowed_sources:
          type: array
          description: Sources that always reach UI, API and SSH (anti-lockout). Default - the management interface's connected subnet.
          items: {$ref: '#/components/schemas/Ipv4Cidr'}
        ui_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Default - the port the API listens on (8443 in the shipped compose files).

    NetworkType:
      type: string
      enum: [lan, wireguard]
    Network:
      oneOf:
        - $ref: '#/components/schemas/LanNetwork'
        - $ref: '#/components/schemas/WireGuardNetwork'
      discriminator:
        propertyName: type
        mapping:
          lan: '#/components/schemas/LanNetwork'
          wireguard: '#/components/schemas/WireGuardNetwork'
    LanNetwork:
      type: object
      description: A local IPv4 test network - a bridge owned by Chaos Gateway with physical ports (plan §2.2).
      required: [type, name, address, interfaces]
      properties:
        type:
          type: string
          enum: [lan]
        name: {$ref: '#/components/schemas/Name'}
        description: {$ref: '#/components/schemas/Description'}
        interfaces:
          type: array
          description: Physical ports of the network's bridge. Must not be configured by netplan/NetworkManager/systemd-networkd.
          minItems: 1
          items: {$ref: '#/components/schemas/InterfaceRef'}
        address: {$ref: '#/components/schemas/Ipv4Interface'}
        nat:
          type: boolean
          default: true
          description: Masquerade towards the uplink.
        dhcp: {$ref: '#/components/schemas/DhcpScope'}
        dns: {$ref: '#/components/schemas/NetworkDns'}
        routes:
          type: array
          description: Downstream routes for devices behind another router in this network.
          items: {$ref: '#/components/schemas/DownstreamRoute'}
    DownstreamRoute:
      type: object
      required: [destination, via]
      properties:
        destination: {$ref: '#/components/schemas/Ipv4Cidr'}
        via:
          allOf: [{$ref: '#/components/schemas/Ipv4'}]
          description: Router inside the network's subnet.
    DhcpScope:
      type: object
      description: One Kea subnet per network (plan §2.7). Reservations come from devices with `fixed_ip`. The block switches DHCP on, an empty block with the defaults; a network without it has no DHCP (the gateway gives Kea no subnet for it).
      properties:
        enabled:
          type: boolean
          default: true
          description: Inside the block DHCP is on unless this is false. It does not apply to a network without the block, which has no DHCP.
        pools:
          type: array
          description: Default - the second half of the subnet up to the last usable address, without the gateway's address (a gateway inside it splits it into the range before and the range after it).
          items: {$ref: '#/components/schemas/DhcpPool'}
        lease_time:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          default: 1h
          description: Must be at least 1s.
        options: {$ref: '#/components/schemas/DhcpOptions'}
    DhcpOptions:
      type: object
      properties:
        router:
          allOf: [{$ref: '#/components/schemas/Ipv4'}]
          description: Option 3. Default - the network's gateway address.
        dns_servers:
          type: array
          description: Option 6. Default - the network's gateway address (DNS proxy).
          items: {$ref: '#/components/schemas/Ipv4'}
        domain:
          type: string
          maxLength: 253
          description: Option 15.
        ntp_servers:
          type: array
          description: Option 42.
          items: {$ref: '#/components/schemas/Ipv4'}
        custom:
          type: array
          items: {$ref: '#/components/schemas/DhcpCustomOption'}
    DhcpPool:
      type: object
      required: [start, end]
      properties:
        start: {$ref: '#/components/schemas/Ipv4'}
        end: {$ref: '#/components/schemas/Ipv4'}
    DhcpCustomOption:
      type: object
      required: [code, value]
      properties:
        code: {type: integer, minimum: 1, maximum: 254}
        value:
          type: string
          description: Value in Kea's `option-data` syntax.
    NetworkDns:
      type: object
      properties:
        static_entries:
          type: array
          items: {$ref: '#/components/schemas/DnsStaticEntry'}
        redirect_hardcoded:
          type: boolean
          default: false
          description: |
            Redirect DNS (UDP/TCP 53) to other resolvers than the gateway to the DNS proxy (M20): the queries of the
            network's devices are answered by the proxy, its faults apply to them, and an access rule judges them by the
            resolver the device meant. What stays inside the network and the networks behind its routers is not
            redirected. A network without the DNS proxy (no service namespace) cannot redirect: the preview warns.
        block_dot:
          type: boolean
          default: false
          description: |
            Block DNS over TLS (TCP 853) of the network's devices (M20): dropped after the access rules (an `allow` rule is
            an exception) and before the access matrix. DNS over HTTPS cannot be told from other HTTPS traffic and is not
            blocked (plan §6).
    DnsStaticEntry:
      type: object
      required: [name, addresses]
      properties:
        name: {$ref: '#/components/schemas/Hostname'}
        addresses:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Ipv4'}

    WireGuardNetwork:
      type: object
      description: |
        A WireGuard network (plan §2.2.1). `hub` - one interface, many `clients`.
        `link` - one interface per remote site with exactly one `peer` and a /31 `address`.
      required: [type, kind, name, address, listen_port]
      properties:
        type:
          type: string
          enum: [wireguard]
        kind:
          type: string
          enum: [hub, link]
        name: {$ref: '#/components/schemas/Name'}
        description: {$ref: '#/components/schemas/Description'}
        role:
          type: string
          enum: [test, management]
          default: test
          description: '`test` - untrusted like a test network; `management` - may reach UI/API (commit-confirm applies).'
        address: {$ref: '#/components/schemas/Ipv4Interface'}
        listen_port: {type: integer, minimum: 1, maximum: 65535}
        mtu:
          type: integer
          minimum: 1280
          maximum: 1500
          default: 1420
        endpoint:
          allOf: [{$ref: '#/components/schemas/Endpoint'}]
          description: Address clients use to reach the gateway. Default - uplink address and `listen_port`.
        nat:
          type: boolean
          default: true
          description: Masquerade towards the uplink (never towards test networks).
        clients:
          type: object
          description: Hub only. Map keyed by client UUID.
          additionalProperties: {$ref: '#/components/schemas/WireGuardClient'}
        peer:
          allOf: [{$ref: '#/components/schemas/WireGuardLinkPeer'}]
          description: Link only.
        routes:
          type: array
          description: Link only - static routes via the link (alternative or addition to dynamic routing).
          items: {$ref: '#/components/schemas/Ipv4Cidr'}
    WireGuardKeySettings:
      type: object
      properties:
        mode:
          type: string
          enum: [generated, provided]
          default: generated
          description: '`generated` - the gateway generates the peer key pair (complete export possible); `provided` - only the public key is given.'
        public_key:
          allOf: [{$ref: '#/components/schemas/WireGuardKey'}]
          description: Required with `provided`; set by the server with `generated`.
        preshared_key:
          type: boolean
          default: false
        export_once:
          type: boolean
          default: false
          description: Delete the stored private key after the first download.
        generation:
          type: integer
          minimum: 1
          default: 1
          description: Raising it in a candidate makes the server generate a new key pair (key rotation, `generated` only).
    WireGuardClient:
      type: object
      description: A peer of a hub network. Each client is also a device with the same UUID and name (device namespace); there is no separate `Device` entry for it.
      required: [name, address]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        description: {$ref: '#/components/schemas/Description'}
        address:
          allOf: [{$ref: '#/components/schemas/Ipv4'}]
          description: Tunnel address inside the hub's subnet.
        client_networks:
          type: array
          description: Subnets behind the client (part of its AllowedIPs and routed via the hub).
          items: {$ref: '#/components/schemas/Ipv4Cidr'}
        reachable:
          type: array
          description: |
            Networks the client may reach. They become the routes (AllowedIPs) of the exported
            configuration and implicit `allow` entries from this client in the access matrix.
            `{uplink: true}` means full tunnel (AllowedIPs 0.0.0.0/0).
          items: {$ref: '#/components/schemas/MatrixEndpoint'}
        trusts_test_ca:
          type: boolean
          default: false
          description: As `Device.trusts_test_ca`.
        labels:
          type: array
          items: {type: string, maxLength: 40}
        dns: {$ref: '#/components/schemas/WireGuardClientDns'}
        keepalive:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          default: 25s
        enabled:
          type: boolean
          default: true
          description: Disabled clients are removed from the interface.
        key: {$ref: '#/components/schemas/WireGuardKeySettings'}
    WireGuardClientDns:
      type: object
      description: DNS server written into the client's exported configuration.
      properties:
        mode:
          type: string
          enum: [gateway, none, custom]
          default: gateway
          description: '`gateway` - the hub address (DNS proxy, so DNS faults and hostname selectors apply).'
        servers:
          type: array
          description: Only with `custom`.
          items: {$ref: '#/components/schemas/Ipv4'}
    WireGuardLinkPeer:
      type: object
      required: [address]
      properties:
        address:
          allOf: [{$ref: '#/components/schemas/Ipv4'}]
          description: Remote side's address in the /31 transfer net.
        endpoint:
          allOf: [{$ref: '#/components/schemas/Endpoint'}]
          description: Remote endpoint. If set, the gateway initiates the tunnel (needed behind CGNAT/DS-Lite).
        keepalive:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          default: 25s
        enabled:
          type: boolean
          default: true
        key: {$ref: '#/components/schemas/WireGuardKeySettings'}

    MatrixEndpoint:
      type: object
      description: 'Exactly one of: a network (local or WireGuard; for a hub incl. all clients and client networks; for a link incl. the remote prefixes), a single WireGuard client with its client networks, the uplink, or the management network (`Management.allowed_sources`, or the management interface subnet when none are given; the control plane itself is governed by gateway protection, not by the matrix). Since 2026-10-18 the management network also stands for the WireGuard networks of the role `management`, with their clients and the networks behind them, as a destination and as a source, in both topologies; an entry towards or from such a network or one of its clients is more specific and decides first.'
      minProperties: 1
      maxProperties: 1
      properties:
        network: {$ref: '#/components/schemas/Ref'}
        client: {$ref: '#/components/schemas/Ref'}
        uplink:
          type: boolean
          enum: [true]
        management:
          type: boolean
          enum: [true]
    AccessMatrix:
      type: object
      description: |
        Default policy between networks (firewall layer 2, plan §2.2). Without an entry:
        local test networks → uplink `allow`; everything else `deny`. Access to the gateway
        itself is not part of the matrix (gateway protection, layer 1). A more specific
        endpoint (client) wins over a network entry.
      properties:
        entries:
          type: array
          items: {$ref: '#/components/schemas/MatrixEntry'}
    MatrixEntry:
      type: object
      required: [from, to, policy]
      description: |
        `from` and `to` must not name the same endpoint (`matrix_self_entry`), and the same pair
        must not appear twice (`duplicate_matrix_entry`).
      properties:
        from: {$ref: '#/components/schemas/MatrixEndpoint'}
        to: {$ref: '#/components/schemas/MatrixEndpoint'}
        policy:
          type: string
          enum: [allow, deny]

    Routing:
      type: object
      description: |
        The managed BIRD 2 instance (plan §2.2.2). Learned routes only enter Chaos Gateway's
        tables. Static routes live with their network - `LanNetwork.routes` (downstream
        routers), `WireGuardNetwork.routes` (links), client networks (automatic) - and are
        announced by BIRD like other prefixes when selected in `announce`.
      properties:
        router_id:
          allOf: [{$ref: '#/components/schemas/Ipv4'}]
          description: Default - the numerically lowest gateway address of all local test networks.
        asn:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
          description: Local ASN for BGP (private range recommended).
        protocols:
          type: object
          description: Map keyed by protocol UUID.
          additionalProperties: {$ref: '#/components/schemas/RoutingProtocol'}
        external: {$ref: '#/components/schemas/ExternalRouting'}
    ExternalRouting:
      type: object
      description: Import routes that another daemon writes into a kernel table, with the same filters.
      properties:
        enabled:
          type: boolean
          default: false
        table: {type: integer, minimum: 1, maximum: 4294967294}
        import: {$ref: '#/components/schemas/ImportFilter'}
    RoutingProtocol:
      type: object
      required: [name, type, link]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        type:
          type: string
          enum: [bgp, ospf, babel]
        link:
          allOf: [{$ref: '#/components/schemas/Ref'}]
          description: WireGuard link network the protocol runs on. One link runs at most one protocol of each `type` (`duplicate_protocol` otherwise).
        enabled:
          type: boolean
          default: true
        announce:
          type: array
          description: Prefixes announced to the neighbor.
          items: {$ref: '#/components/schemas/AnnounceEntry'}
        import: {$ref: '#/components/schemas/ImportFilter'}
        bgp: {$ref: '#/components/schemas/BgpSettings'}
        ospf: {$ref: '#/components/schemas/OspfSettings'}
        babel: {$ref: '#/components/schemas/BabelSettings'}
        custom_snippet:
          type: string
          maxLength: 8192
          description: Raw BIRD configuration appended inside the protocol block; validated with `bird -p`, shown as unmanaged.
    AnnounceEntry:
      type: object
      minProperties: 1
      maxProperties: 1
      properties:
        network: {$ref: '#/components/schemas/Ref'}
        client: {$ref: '#/components/schemas/Ref'}
        cidr: {$ref: '#/components/schemas/Ipv4Cidr'}
    ImportFilter:
      type: object
      description: Management, uplink and gateway-own prefixes are always rejected, regardless of this filter.
      properties:
        allowed_prefixes:
          type: array
          description: Empty - accept any prefix not otherwise forbidden.
          items: {$ref: '#/components/schemas/PrefixFilterEntry'}
        allow_default:
          type: boolean
          default: false
          description: >-
            Accept the default route (0.0.0.0/0). It is let through even when allowed_prefixes
            does not name it explicitly.
        max_prefixes:
          type: integer
          minimum: 1
          default: 100
    PrefixFilterEntry:
      type: object
      required: [prefix]
      properties:
        prefix: {$ref: '#/components/schemas/Ipv4Cidr'}
        max_length:
          type: integer
          minimum: 0
          maximum: 32
          description: Also accept more specific prefixes up to this length.
    BgpSettings:
      type: object
      required: [neighbor_asn]
      properties:
        neighbor_address:
          allOf: [{$ref: '#/components/schemas/Ipv4'}]
          description: Default - the link peer's address. On a link, must be the peer itself (`outside_subnet` otherwise).
        neighbor_asn:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
        hold_time:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          default: 90s
          description: Must be at least three times `keepalive_time` (`invalid_timers` otherwise).
        keepalive_time:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          default: 30s
          description: Must be at least 1s.
        passive:
          type: boolean
          default: false
    OspfSettings:
      type: object
      properties:
        area:
          type: string
          pattern: '^[0-9]+(\.[0-9]+\.[0-9]+\.[0-9]+)?$'
          default: '0.0.0.0'
        hello_interval:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          default: 10s
          description: Must be at least 1s.
        dead_interval:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          default: 40s
          description: Must be longer than `hello_interval` (`invalid_timers` otherwise).
        cost:
          type: integer
          minimum: 1
          maximum: 65535
          default: 10
    BabelSettings:
      type: object
      properties:
        hello_interval:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          default: 4s
        rxcost:
          type: integer
          minimum: 1
          maximum: 65535
          default: 96

    Device:
      type: object
      description: |
        A configured device (plan §2.3). Discovered devices have UUIDs too; adopting one stores
        it here under the same UUID. Merging two entries (e.g. after a randomized MAC) is a
        revision that adds the other entry's identifiers to this device; the discovered entry
        whose identifiers are now covered disappears, and overlays targeting it are moved to
        this device.
      required: [name]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        description: {$ref: '#/components/schemas/Description'}
        identifiers: {$ref: '#/components/schemas/DeviceIdentifiers'}
        network:
          allOf: [{$ref: '#/components/schemas/Ref'}]
          description: Expected network; informational except for `fixed_ip`.
        fixed_ip:
          allOf: [{$ref: '#/components/schemas/Ipv4'}]
          description: |-
            DHCP reservation in `network` for the device's first MAC (`identifiers.macs[0]`); the device's
            other MACs get no reservation, so the MAC that asks for DHCP must come first (plan §2.7).
            A new or changed reservation reaches the DHCP server at once, but takes effect when the device
            renews its lease (up to half the lease time); if another client still holds the address,
            the device gets a pool address until that lease is released.
        trusts_test_ca:
          type: boolean
          default: false
          description: Whether the firmware trusts the test CA; decides expected TLS results (plan §2.8).
        labels:
          type: array
          items: {type: string, maxLength: 40}
    DeviceIdentifiers:
      type: object
      properties:
        macs:
          type: array
          items: {$ref: '#/components/schemas/MacAddress'}
        ipv4:
          type: array
          description: Addresses or ranges for devices without a visible MAC (behind a router, in client networks).
          items: {$ref: '#/components/schemas/Ipv4OrCidr'}
    Group:
      type: object
      required: [name]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        description: {$ref: '#/components/schemas/Description'}
        members:
          type: array
          description: Devices (configured, discovered, WireGuard clients, probes).
          items: {$ref: '#/components/schemas/Ref'}
    Probe:
      type: object
      description: A virtual client inside the gateway, a port of the network's bridge (plan §2.12). It is also a device with the same UUID and name (device namespace); there is no separate `Device` entry for it.
      required: [name, network]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        description: {$ref: '#/components/schemas/Description'}
        network:
          allOf: [{$ref: '#/components/schemas/Ref'}]
          description: Local test network.
        trusts_test_ca:
          type: boolean
          default: false
        labels:
          type: array
          items: {type: string, maxLength: 40}

    Settings:
      type: object
      properties:
        commit_confirm_timeout:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          default: 60s
        class_limit_per_interface:
          type: integer
          minimum: 10
          maximum: 8190
          description: |
            tc classes one interface may carry, the default class included (plan §3.3). Without it the limit is the
            gateway's default, 1000 on x86-64 and 200 on ARM64. Faults beyond it are refused with
            `capacity_exceeded`; the preview of a revision counts against the revision's own setting, and
            `limits.class_limit_per_interface` of the capabilities reports the limit of the applied configuration.
        counter_poll_interval:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          default: 1s
        retention: {$ref: '#/components/schemas/RetentionSettings'}
    RetentionSettings:
      type: object
      properties:
        revisions: {type: integer, minimum: 10, default: 200}
        runs:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          default: 720h
        events:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          default: 168h
        audit:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          default: 8760h
        captures_quota:
          allOf: [{$ref: '#/components/schemas/ByteSize'}]
          default: 5GiB

    # ============================================================ selectors (plan §2.4)
    Scope:
      type: object
      description: |
        The source part of a selector (`source` in the configuration, `target` in overlays
        and scenarios). Exactly one property. Specificity levels (plan §2.4): device → 1–4,
        group → 5–6, network and remote_network → 7–8, global → 9–10 (with or without a
        destination/port).
      minProperties: 1
      maxProperties: 1
      properties:
        device: {$ref: '#/components/schemas/Ref'}
        group: {$ref: '#/components/schemas/Ref'}
        network:
          allOf: [{$ref: '#/components/schemas/Ref'}]
          description: Local or WireGuard network (hub - incl. all clients and client networks; link - incl. the remote prefixes).
        remote_network: {$ref: '#/components/schemas/RemoteNetworkRef'}
        global:
          type: boolean
          enum: [true]
          description: Packets whose original source is in a test, WireGuard or remote network (never the gateway's own traffic).
    RemoteNetworkRef:
      type: object
      description: 'Exactly one of: the client networks of a WireGuard client, the prefixes routed via a link, or a CIDR inside those.'
      minProperties: 1
      maxProperties: 1
      properties:
        client: {$ref: '#/components/schemas/Ref'}
        link: {$ref: '#/components/schemas/Ref'}
        cidr: {$ref: '#/components/schemas/Ipv4Cidr'}
    Destination:
      type: object
      description: Exactly one property. Omit the whole destination for "any".
      minProperties: 1
      maxProperties: 1
      properties:
        uplink:
          type: boolean
          enum: [true]
          description: |
            Every address that lies in no configured network (local, WireGuard, the networks behind their
            routes and clients, the prefixes of a link) and in no management prefix. It is decided by the
            configuration, not by the routing table: prefixes that the routing daemon learned (BGP, OSPF,
            Babel) and the service namespace's 169.254.100.0/30 (the DNS proxy) lie in no configured
            network and so count as the uplink. A rule or a fault with the destination `uplink` applies
            to them too: "drop to uplink" also drops traffic to a learned remote site and to the DNS
            proxy's namespace. Name such a destination with `cidr` to tell it apart. Decided by the
            maintainer on 2026-10-11.
        network: {$ref: '#/components/schemas/Ref'}
        cidr: {$ref: '#/components/schemas/Ipv4OrCidr'}
        hostname:
          allOf: [{$ref: '#/components/schemas/Hostname'}]
          description: |
            DNS-derived (best effort, plan §2.6, M20): the addresses the gateway's DNS proxy answered the source for a
            name that matches (an exact name, or `*.suffix` for its subdomains), kept in an address set per selector
            and per requesting device for at least 10 minutes and as long as the connection table shows flows to
            the address. The kernel matches addresses: on a CDN another name on the same address is selected too,
            and a device that does not use the gateway's DNS has no addresses. For a fault the selectors of the same
            family are tried strongest first and in front of the destinations that name addresses; a fault that
            names no destination and no port at a higher precedence covers all of its traffic (docs/development.md,
            "DNS faults and hostname selectors (M20)").
    TrafficMatch:
      type: object
      description: The destination part of a selector. `ports` and `port_ranges` require protocol `tcp` or `udp`.
      properties:
        destination: {$ref: '#/components/schemas/Destination'}
        protocol: {$ref: '#/components/schemas/Protocol'}
        ports:
          type: array
          maxItems: 64
          items: {type: integer, minimum: 1, maximum: 65535}
        port_ranges:
          type: array
          maxItems: 16
          items: {$ref: '#/components/schemas/PortRange'}

    # ============================================================ access rules
    AccessAction:
      type: string
      enum: [allow, drop, reject, reset]
      description: |
        `allow` - accept. `drop` - discard silently. `reject` - answer with an ICMP error (ICMPv6 for
        IPv6), port unreachable unless the rule's `reject_with` names another type, so the sender
        fails at once. `reset` - answer with a TCP reset (TCP only).
    RejectType:
      type: string
      enum: [port_unreachable, host_unreachable, admin_prohibited, no_route]
      default: port_unreachable
      description: |
        The ICMP error a `reject` rule answers with (nftables `reject with icmpx type ...`, the same
        statement for IPv4 and IPv6). `port_unreachable` - the default: clients fail at once with
        "connection refused", for TCP and UDP alike. `host_unreachable` - "no route to host".
        `admin_prohibited` - "a firewall did it" (ICMP communication administratively prohibited).
        `no_route` - network unreachable (ICMPv6 no route; ICMP network unreachable for IPv4).
        Decided by the maintainer on 2026-10-11.
    AccessRuleBody:
      description: |
        The selector and the action of an access rule (plan §2.4). A rule is evaluated on the conntrack
        original tuple in the forward and the input path, so a connection that the gateway redirects
        (the DNS proxy, a TLS case) is judged by the destination the device meant, and a rule on
        `udp/53` also covers queries sent directly to the service namespace's address. The first
        matching rule decides, overlay rules (newest first) before configured rules; traffic no rule
        selects is judged by the access matrix.

        Rules take effect for **new connections**: established traffic is accepted before the rules
        (spike S3). `cut_existing` also cuts the connections that exist when the rule comes into effect.

        An `allow` rule accepts. In the forward path it is an exception to the access matrix. In the
        input path it also opens the gateway's own ports that its protection of the test networks
        closes (everything but DHCP, DNS and ICMP echo) for the rule's selector. Two things stand in
        front of every access rule and cannot be overridden by a rule or an overlay: the management
        sources always reach SSH and the UI/API (anti-lockout), and the UI/API port stays closed to every
        other source, so it is never reachable from a test network. `system_rules` of the list holds the
        anti-lockout rule with its counter; the closure of the UI/API port is described here only, it is
        not listed there and has no counter of its own. Decided by the maintainer on 2026-10-11.

        The same holds for the management network (plan §2.16): the guard that stops devices under test
        from opening connections into it stands in front of the access rules, so no rule, `allow`
        included, opens that network for a device under test. In the two-port topology (the management
        interface is the uplink interface) the guard drops by the management addresses behind the uplink
        (decided by the maintainer on 2026-10-11); in the three-port topology it drops by the management
        addresses, whatever interface the packet would leave through, and anything that would leave
        through the management interface, so a lost uplink default route or a router behind the uplink
        that knows the management network does not open it either (decided on 2026-10-17). In both
        topologies the WireGuard networks of the role `management`, with their clients and the networks
        behind them, are part of the management network for the guard (decided on 2026-10-18). `explain`
        reports the guard as a drop by the access matrix, without a rule. Only an explicit entry of the
        access matrix from the device's network to the management network, or to the WireGuard network of
        the role `management` (or the client of one) the destination lies in, opens it; a client's
        `reachable` list does not. Replies, those of a port forward from the management side included, are
        accepted before the guard.

        **Forwarded connections** (port forwards, `PortForward`, M35a) are initiated from behind the uplink or
        the management network towards a device, so a rule whose source is a device, group or network matches
        them **with the device as responder**: its source is matched against the conntrack reply source (the
        forward's target), its destination against the external peer (the destination `uplink` matches every
        peer behind the uplink; a peer in the management network, which `uplink` excludes, is matched by a
        `cidr` destination or by a rule without a destination), its ports against the target port. This holds
        for every rule, configured and overlay, including rules that exist before the forward is added: a rule
        "device X → uplink: drop" also stops the forwarded connections to X, and `cut_existing` cuts them too.
        A forwarded connection that no rule decides is accepted by the forward itself, in front of the access
        matrix. `explain` names the rule that decided a forwarded connection (plan §2.4, D34).
      allOf:
        - $ref: '#/components/schemas/TrafficMatch'
        - type: object
          required: [action]
          properties:
            action: {$ref: '#/components/schemas/AccessAction'}
            cut_existing:
              type: boolean
              default: false
              description: |
                Also cut established connections (plan §2.4): for a short time, TCP packets of established
                connections that the rule decides get a TCP reset towards the sender, who can reconnect
                (the server side stays half-open, as in a real outage), and the rule's conntrack entries
                are deleted so that other protocols are judged again as new traffic. Not allowed with
                `allow`; the protocol must be `tcp` or `any`.
            reject_with:
              allOf: [{$ref: '#/components/schemas/RejectType'}]
              description: Only with action `reject`; the default is `port_unreachable`. A type on another action is refused.
    AccessRule:
      description: |
        A configured access rule. Evaluated in forward and input on the conntrack original tuple;
        overlay rules come first. A configuration (with its overlays) of more than 1000 rules, or whose
        rules select more than 65536 source addresses together, is refused with `capacity_exceeded`
        naming the overlays or rules that caused it.
      allOf:
        - $ref: '#/components/schemas/AccessRuleBody'
        - type: object
          required: [source]
          properties:
            name: {$ref: '#/components/schemas/Name'}
            description: {$ref: '#/components/schemas/Description'}
            source: {$ref: '#/components/schemas/Scope'}
            enabled:
              type: boolean
              default: true
    SystemAccessRule:
      type: object
      description: A rule the gateway adds that no configuration and no overlay can override (plan §2.17), shown locked at the top of the list.
      required: [key, name, description]
      properties:
        key: {type: string, example: system:anti_lockout}
        name: {type: string, example: Control plane access}
        description: {type: string}
        counters: {$ref: '#/components/schemas/Counter'}

    # ============================================================ port forwards (plan §2.2, M35a)
    PortForwardProtocol:
      type: string
      enum: [tcp, udp]
    PortForwardEntry:
      type: string
      enum: [uplink, management]
      description: |
        Where the forwarded connections come in: `uplink` - on the uplink interface, on every IPv4 address of
        it; `management` - on the management interface, on every IPv4 address of it, in the three-port
        topology only (in the two-port topology both are one interface, so `management` is refused as a
        duplicate of `uplink`: `management_is_uplink`). The addresses are followed like the masquerade's
        (plan §2.2). The replies of a `management` forward go back through the management interface by a
        table of their own, which knows the interface's connected subnet and its default gateway (the
        default route of the management interface in the host's main table) only: a peer that the host
        reaches through another route of the management interface (a static route to an admin network
        while the main default goes via the uplink) gets no reply. The compiler warns when the management
        interface has no default route (P31-M35a-05).
    PortForwardTarget:
      type: object
      description: |
        Exactly one property. `device` - a device in a local test network (a configured device or a probe;
        a WireGuard client is refused): the forward follows the device's current address, and while the
        device has no known address in a local test network the forward is inactive. `address` - an IPv4
        address in a local test network, never the gateway's own address there.
      minProperties: 1
      maxProperties: 1
      properties:
        device: {$ref: '#/components/schemas/Ref'}
        address: {$ref: '#/components/schemas/Ipv4'}
    PortForward:
      type: object
      description: |
        A port forward (plan §2.2 layer 4, M35a, D34): connections that come in on an address of the entry side
        with the protocol and an external port are sent (DNAT) to the target and the target port.
        A port range is shifted one to one: `external_port` 8000 to `external_port_end` 8010 with
        `target_port` 9000 forwards 8000 to 9000, 8001 to 9001, ..., 8010 to 9010.

        The forward itself opens the path through the access matrix; the access rules apply to the
        forwarded connections with the device as responder (see `AccessRuleBody`). Faults do not apply to
        forwarded connections (M35b); the preview and `explain` say so. Hairpin access (a device in a test
        network using the entry address of a forward) is not supported.

        Refused with `validation_failed` at the forward's field: two forwards on the same protocol whose
        external ports overlap (`overlapping_forward`, whatever their entry side); ranges of different
        length (`port_range_length`), a range that ends before it starts or a target range that would end
        past 65535 (`invalid_port_range`); enabled forwards that forward more than 16384 ports together
        (`invalid_port_range` at the range of the forward, in the order of the names, that crosses the limit:
        every forwarded port is an element of the gateway's DNAT map, and the move of a target device
        replaces all of them in one transaction); an external port that is the UI/API port (`management.ui_port`, by default the port the API listens
        on), a listen port of a WireGuard network of the gateway (udp), 22/tcp on the management side or
        on the two-port topology's shared interface, or 179/tcp while an enabled BGP protocol is
        configured (`reserved_port`); `management` in the two-port topology (`management_is_uplink`); a
        target outside the local test networks, on the gateway or in the management network
        (`invalid_target`). A forward is not lockout-relevant: the ports of the control plane are refused,
        so applying one never waits for commit-confirm.
      required: [protocol, entry, external_port, target]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        description: {$ref: '#/components/schemas/Description'}
        protocol: {$ref: '#/components/schemas/PortForwardProtocol'}
        entry: {$ref: '#/components/schemas/PortForwardEntry'}
        external_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The external port, or the first port of the external range.
        external_port_end:
          type: integer
          minimum: 1
          maximum: 65535
          description: The last port of the external range (inclusive). Absent - a single port.
        target: {$ref: '#/components/schemas/PortForwardTarget'}
        target_port:
          type: integer
          minimum: 1
          maximum: 65535
          description: The target port, or the first port of the target range. Default - `external_port`.
        target_port_end:
          type: integer
          minimum: 1
          maximum: 65535
          description: |
            The last port of the target range (inclusive). Default - the target range is as long as the
            external one; when given, it must make it so (`port_range_length` otherwise).
        enabled:
          type: boolean
          default: true
    PortForwardStatus:
      type: object
      description: Whether the forward is in effect, and why not.
      required: [state]
      properties:
        state:
          type: string
          enum: [active, inactive]
        reason:
          type: string
          enum: [disabled, device_without_address, device_outside_test_network, management_is_uplink, entry_without_address]
          description: |
            Only with `inactive`. `disabled` - `enabled: false`. `device_without_address` - the target device has
            no known address. `device_outside_test_network` - the device's addresses lie in no local test network.
            `management_is_uplink` - the management interface is the uplink interface (two-port topology).
            `entry_without_address` - the entry interface has no IPv4 address now.
        message:
          type: string
          description: 'The reason in words, e.g. "inactive: the device has no address".'
        target_address:
          allOf: [{$ref: '#/components/schemas/Ipv4'}]
          description: The address the connections are sent to now (the device's current address for a device target).
    PortForwardView:
      type: object
      required: [id, config, status]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        config: {$ref: '#/components/schemas/PortForward'}
        status: {$ref: '#/components/schemas/PortForwardStatus'}
        counters:
          allOf: [{$ref: '#/components/schemas/Counter'}]
          description: |
            The connections that arrived through the forward: `packets` counts the first packet of each
            connection on the forward's entry side, protocol and external ports (the forward's rule in the
            NAT chain, which sees the first packet of a connection only), `bytes` the bytes of those
            packets, and
            `last_match` is when the last one arrived. A connection is counted whatever the access rules
            decide about it afterwards (allowed, dropped or rejected); a TCP connection whose SYN is dropped
            is counted once per attempt, since a dropped packet leaves no tracked connection. The connections
            of an inactive forward whose device has no address are counted too: they are not translated and
            reach the gateway's own input path instead (and its protection). Monotonic
            across applies; `epoch` changes on a restart. Only for the revision the kernel runs; absent
            while the forward is not in the kernel.

    # ============================================================ faults (plan §2.4, §2.5)
    FaultFamily:
      type: string
      enum: [impairment, mtu, dns, tls, dhcp, tunnel]
    NetemParams:
      type: object
      description: |
        One-way impairment of one direction (plan §2.5). Unset parameters are neutral;
        the compiler always emits complete parameter sets. Validation: `jitter` ≤ `latency`;
        `reorder` requires `latency`; `loss` and `burst_loss` are exclusive; `blackout`
        and `flapping` are exclusive.
      properties:
        latency: {$ref: '#/components/schemas/Duration'}
        jitter: {$ref: '#/components/schemas/Duration'}
        distribution: {$ref: '#/components/schemas/DelayDistribution'}
        keep_order:
          type: boolean
          default: false
          description: Prevent reordering by jitter (netem rate; shifts the delay distribution).
        loss: {$ref: '#/components/schemas/Percentage'}
        loss_correlation: {$ref: '#/components/schemas/Percentage'}
        burst_loss: {$ref: '#/components/schemas/GilbertElliott'}
        rate:
          allOf: [{$ref: '#/components/schemas/Bitrate'}]
          description: |
            Per device (D18). At least 8 bit/s: the kernel limits in bytes per second, so a lower rate
            would not limit at all and is refused with `invalid_rate`. Decided by the maintainer on 2026-10-11.
        queue_limit:
          type: integer
          minimum: 1
          maximum: 1000000
          description: Packets, per device (D18). Default computed from latency × rate (plan §2.5).
        reorder: {$ref: '#/components/schemas/Percentage'}
        duplicate: {$ref: '#/components/schemas/Percentage'}
        corrupt: {$ref: '#/components/schemas/Percentage'}
        blackout:
          type: boolean
          description: Drop everything (netem loss 100 %).
        flapping: {$ref: '#/components/schemas/Flapping'}
    DelayDistribution:
      type: string
      enum: [uniform, normal, pareto, paretonormal]
      default: uniform
    GilbertElliott:
      type: object
      description: Gilbert-Elliott burst-loss model (netem `loss gemodel p r 1-h 1-k`).
      required: [p, r]
      properties:
        p:
          allOf: [{$ref: '#/components/schemas/Percentage'}]
          description: Probability good → bad.
        r:
          allOf: [{$ref: '#/components/schemas/Percentage'}]
          description: Probability bad → good.
        h:
          allOf: [{$ref: '#/components/schemas/Percentage'}]
          description: Delivery probability in the bad state (default 0%).
        k:
          allOf: [{$ref: '#/components/schemas/Percentage'}]
          description: Delivery probability in the good state (default 100%).
    Flapping:
      type: object
      required: [up, down]
      description: Timed blackout, starting with `up`.
      properties:
        up: {$ref: '#/components/schemas/Duration'}
        down: {$ref: '#/components/schemas/Duration'}
    ImpairmentParams:
      description: |
        Flat `NetemParams` apply to both directions. Alternatively `upload` and/or `download`
        give each direction its own complete parameter set (a missing direction is
        unimpaired); flat parameters and `upload`/`download` must not be mixed. Upload =
        packets in the connection's original direction (of the initiator), download = replies.
      allOf:
        - $ref: '#/components/schemas/NetemParams'
        - type: object
          properties:
            upload: {$ref: '#/components/schemas/NetemParams'}
            download: {$ref: '#/components/schemas/NetemParams'}
    MtuParams:
      type: object
      required: [size]
      properties:
        size:
          type: integer
          minimum: 552
          maximum: 1500
          description: Maximum packet size in bytes (IP).
        mode:
          type: string
          enum: [icmp, blackhole, mss_clamp]
          default: icmp
          description: '`icmp` - policy route with `mtu lock` (fragmentation-needed is sent); `blackhole` - drop larger packets silently; `mss_clamp` - rewrite TCP MSS only. At most 7 distinct `icmp` sizes can be active at once (PMTU mirror tables, plan §3.3); more give `capacity_exceeded`.'
    TunnelRef:
      type: object
      description: The WireGuard client or link whose encrypted underlay traffic is impaired.
      minProperties: 1
      maxProperties: 1
      properties:
        client: {$ref: '#/components/schemas/Ref'}
        link: {$ref: '#/components/schemas/Ref'}
    FaultBody:
      description: |
        A fault of family `impairment` (default), `mtu` or `tunnel`. Families `dns`, `tls`
        and `dhcp` have their own bodies (`DnsFault`, `TlsCase`, `DhcpAction`).
        - `impairment` - `ImpairmentParams` plus an optional `TrafficMatch`.
        - `mtu` - `mtu` plus an optional `TrafficMatch`.
        - `tunnel` - `tunnel` plus `ImpairmentParams` limited to latency, jitter, loss,
          burst_loss, blackout and flapping; no `TrafficMatch`, no source/target. The directions
          are the remote side's: `upload` is what the client or the remote site sends (the encrypted
          UDP from the peer to the gateway), `download` what it receives (from the gateway to the
          peer). The peer is found by the address it is reached at: a client that has not connected
          yet has none, and its fault takes effect when it does.
      allOf:
        - $ref: '#/components/schemas/TrafficMatch'
        - $ref: '#/components/schemas/ImpairmentParams'
        - type: object
          properties:
            family:
              type: string
              enum: [impairment, mtu, tunnel]
              default: impairment
            mtu: {$ref: '#/components/schemas/MtuParams'}
            tunnel: {$ref: '#/components/schemas/TunnelRef'}
    ConfigFault:
      description: |
        A persistent fault (configuration layer). Only families `impairment`, `mtu` and
        `tunnel`; DNS faults, TLS cases and DHCP actions exist only as overlays (plan §2.6–2.8).
        `source` is required except for `tunnel`.
      allOf:
        - $ref: '#/components/schemas/FaultBody'
        - type: object
          properties:
            name: {$ref: '#/components/schemas/Name'}
            description: {$ref: '#/components/schemas/Description'}
            source: {$ref: '#/components/schemas/Scope'}
            enabled:
              type: boolean
              default: true
            created_at:
              type: string
              format: date-time
              description: Set by the server when the fault first appears in a revision and preserved for its id afterwards; any value sent by a client is ignored. Decides "newer wins" at the same level (D26).
    DnsFault:
      type: object
      description: |
        DNS family (plan §2.6, M20), implemented by the DNS proxy: an overlay of the kind `dns`, or the `dns` part of an
        activated profile. The proxy answers a query with the first fault whose scope contains the client and whose
        `names` match the name asked (or that names none); the faults of one client are ordered by the precedence of
        §2.4 (a more specific scope or level first, the newer first at the same level, a fault before a part of a
        profile on the same scope). A DNS fault competes only with other DNS faults: a latency fault of the device
        does not cancel a "DNS broken" profile of its network (E5).
      required: [action]
      properties:
        names:
          type: array
          description: Names the fault applies to (exact or `*.suffix`). Empty - all names.
          items: {$ref: '#/components/schemas/Hostname'}
        action:
          type: string
          enum: [nxdomain, servfail, timeout, delay, wrong_answer, truncate, short_ttl]
        delay:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          description: Required for `delay`.
        answers:
          type: array
          description: Required for `wrong_answer` (A records returned instead).
          items: {$ref: '#/components/schemas/Ipv4'}
        ttl:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          description: Required for `short_ttl`. Must not be negative.
    TlsCase:
      description: |
        TLS family (plan §2.8). Selected new connections are redirected to the TLS responder
        (certificate and handshake cases, M21). The case `intercept` (M22) is also decided by the responder, which hands the
        connection to the interception proxy (mitmproxy sidecar) instead of answering it: the proxy terminates the device's TLS
        with a certificate of the test CA, opens its own connection to the real server and applies the `http_rules`. It needs a
        device that trusts the test CA (`GET /tls/ca`); a device that does not rejects the certificate, which the handshake events
        show. Default ports 443 and 8883; protocol must be `tcp` or omitted. For the specificity
        level (plan §2.4) a TLS case always has a port part, its ports or the default ones, and
        `sni` or a destination count as destination: a case without selectors on a device has
        level 3, with an SNI level 1.
      allOf:
        - $ref: '#/components/schemas/TrafficMatch'
        - type: object
          required: [case]
          properties:
            case:
              type: string
              enum: [untrusted_ca, expired, not_yet_valid, hostname_mismatch, self_signed, handshake_reset, handshake_close, handshake_stall, intercept]
            sni:
              type: array
              description: Only connections whose ClientHello SNI matches.
              items: {$ref: '#/components/schemas/Hostname'}
            cut_existing:
              type: boolean
              default: false
            intercept: {$ref: '#/components/schemas/InterceptSettings'}
    InterceptSettings:
      type: object
      description: Only with case `intercept` (M22). Requires the device to trust the test CA.
      properties:
        keylog:
          type: boolean
          default: true
          description: |
            Give the TLS secrets of the intercepted connections to the captures that run while the device talks
            (`GET /captures/{id}/download?part=keylog`), so Wireshark can decrypt the capture. A capture that receives
            secrets is marked `sensitive`. The proxy writes the log whatever this says; `false` keeps it from the captures.
        block_quic:
          type: boolean
          default: true
          description: |
            Drop UDP 443 of the selected clients (and destination, when the case names one) while the case is in force, so
            that a client that tries QUIC / HTTP/3 falls back to TCP, which the proxy can intercept. QUIC itself is not
            intercepted.
        upstream:
          type: string
          enum: [verify, own_ca, insecure]
          description: |
            How the proxy treats the certificate of the real server it opens its own connection to (P5-M22-03). Omitted: the
            installation's default, which is `verify` unless the proxy's container sets `CHAOSGW_UPSTREAM_CA_FILE` (then `own_ca`)
            or `CHAOSGW_UPSTREAM_INSECURE=1` (then `insecure`).

            - `verify`: the certificate must be valid for the server name and chain to a CA of the default bundle that the
              proxy ships (mitmproxy's). A server with a private CA, an expired certificate or one for another name is refused:
              the device is answered with a 502 over the proxy's certificate, the server sees no request, and the exchange is logged
              with the error `TLS to the server failed`. A test of the device's own checks is not made a test of the proxy.
            - `own_ca`: the certificate must be valid and chain to the CA file the installation gave the proxy
              (`CHAOSGW_UPSTREAM_CA_FILE`, a lab's private CA), and to no other. Without such a file the connection is refused.
            - `insecure`: the certificate of the server is not verified (a lab with servers whose certificates are wrong on
              purpose or not yet right). The device is still shown a certificate of the test CA, valid for the name it asked for.
        http_rules:
          type: array
          description: |
            Applied in order to every HTTP request of the intercepted connections (HTTP/1.1 and HTTP/2, WebSocket handshakes
            included) that the rule's `match` selects. Every matching rule applies, in the order written, until one of the
            terminal actions (`block`, `status`, `abort`) has acted: nothing after it does. `delay` holds the request (and so the
            response) back, `modify` changes headers and bodies, `throttle` paces the bytes towards the device. A
            connection that is no HTTP (MQTT over TLS, a raw stream) is matched by the rules that name no `path_prefix` and no
            `method`: `block` and `abort` close it, `delay` holds it back once, `throttle` paces it.
          items: {$ref: '#/components/schemas/HttpRule'}
    HttpRule:
      type: object
      required: [action]
      properties:
        match: {$ref: '#/components/schemas/HttpMatch'}
        action:
          type: string
          description: |
            `block` answers 403 with a short text and never reaches the server; `status` answers with the given status code and an
            empty body, also without the server; `delay` waits for `delay` before the request goes on; `throttle` paces the bytes
            sent to the device at `rate`, for the response to the request the rule matches (the next request of the connection
            sets its own pacing, none when no throttle rule matches it; the streams of one HTTP/2 connection share it); `abort` resets the
            connection to the device; `modify` changes the request and response as `modify` says (its response headers are also
            set on the answer of a later `block` or `status` rule, e.g. `Retry-After` on a 503).
          enum: [block, status, delay, throttle, abort, modify]
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: For `status` (e.g. 500, 503, 429).
        delay:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          description: For `delay`.
        rate:
          allOf: [{$ref: '#/components/schemas/Bitrate'}]
          description: For `throttle`.
        modify: {$ref: '#/components/schemas/HttpModify'}
    HttpMatch:
      type: object
      description: A rule without `match` selects every request. Every given field must match.
      properties:
        host: {$ref: '#/components/schemas/Hostname'}
        path_prefix: {type: string, maxLength: 512, description: 'The request path, without the query, starts with it.'}
        method: {type: string, maxLength: 16, description: 'The request method, compared without regard to case.'}
    HttpModify:
      type: object
      properties:
        request_headers:
          type: object
          description: Header → value; empty value removes the header.
          additionalProperties: {type: string}
        response_headers:
          type: object
          additionalProperties: {type: string}
        response_body_replace:
          type: array
          items: {$ref: '#/components/schemas/BodyReplace'}
    BodyReplace:
      type: object
      required: [search, replace]
      properties:
        search: {type: string}
        replace: {type: string}
    DhcpAction:
      type: object
      description: |
        DHCP family (plan §2.7, M23), target a network or a device (never a group or the global
        scope). `short_lease`, `set_options`, `silence` and `force_new_ip` last as long as the
        overlay; `delete_lease` acts once, when it is written (writing it again acts again), and
        stays in the list until its TTL or its owner removes it.

        - `short_lease`: the lease time of the network's clients, or of the device, is `lease_time`
          (Kea hands out leases below 120 s), and a client that asks for a longer one is given the
          short one. The clients keep the lease they have until they renew it.
        - `delete_lease`: the leases of the network, or of the device, are deleted. A client that
          renews simply gets the same address again.
        - `force_new_ip` (a device only): the device's DHCP reservation moves to another address of
          its network's pools, so the renewing client is refused (NAK) and asks for the new address.
          While the overlay exists the reservation replaces the device's `fixed_ip`; when it goes the
          device keeps what it was given until its lease runs out. The device's first MAC is the one
          reserved (plan §2.7), and the device's network must serve DHCP.
        - `set_options`: the options of the network's scope, or of the device's reservation, are
          the configured ones with the fields of `options` replaced (as in the scope, an empty list
          sets nothing).
        - `silence`: the server does not answer the network's clients, or the device's.

        The more specific scope wins (a device beats its network; one effective action per device,
        plan §2.4), and the newer overlay wins at the same scope. The overlay is `effective` while
        the DHCP server is configured with it, `overridden` while another action wins for all its
        clients and `disabled` while its network has DHCP off or its device has no MAC.

        The write is refused with `validation_failed` when the DHCP server, asked with its own
        configuration check, refuses the configuration the action makes (an option it cannot parse,
        a lease time it does not take); a server that is down does not refuse it.
      required: [action]
      properties:
        action:
          type: string
          enum: [short_lease, delete_lease, force_new_ip, set_options, silence]
        lease_time:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          description: For `short_lease` (Kea, may be below 120 s), at least 1 s.
        options: {$ref: '#/components/schemas/DhcpOptions'}
        ip:
          allOf: [{$ref: '#/components/schemas/Ipv4'}]
          description: |
            Only for `force_new_ip`: the address the device is moved to. Without it in the request the
            gateway chooses one when the action is written, a free address of the network's pools that
            is neither leased nor reserved nor known to belong to a device, from the end of the last
            pool downwards (every write of the action chooses again), and the overlay as read always
            has it. A request may name an address inside the device's network instead.

    # ============================================================ profiles
    Profile:
      type: object
      description: A named bundle across families (plan §2.9). Each part competes in its own family when the profile is activated (overlay).
      required: [name, parts]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        description: {$ref: '#/components/schemas/Description'}
        parts: {$ref: '#/components/schemas/ProfileParts'}
    ProfileParts:
      type: object
      minProperties: 1
      properties:
        impairment: {$ref: '#/components/schemas/ImpairmentParams'}
        mtu: {$ref: '#/components/schemas/MtuParams'}
        dns: {$ref: '#/components/schemas/DnsFault'}
        tls: {$ref: '#/components/schemas/TlsCase'}

    # ============================================================ scenarios (plan §2.10)
    Scenario:
      type: object
      description: |
        A timeline of steps; YAML is the import/export format. Every step creates or replaces
        an overlay owned by the run (key = kind, target, selector); `remove` removes one
        step's overlay, `restore` all of them. Steps inherit `target` and may narrow it, never
        widen it.
      required: [name, target, steps]
      properties:
        name: {$ref: '#/components/schemas/Name'}
        description: {$ref: '#/components/schemas/Description'}
        target:
          allOf: [{$ref: '#/components/schemas/Scope'}]
          description: Device, group or network (not `global`, not `remote_network`). One run per target at a time.
        capture:
          type: boolean
          default: false
          description: |
            Capture the target's traffic for the whole run: a capture of the target (a device's, a group's or a
            network's traffic) starts when the run's timeline starts, after its preconditions, and stops when the run
            ends (`stop_reason: run_end`); it is attached to the run (`Capture.run`, an `Artifact` of kind `capture`).
            A capture that cannot start or ends early (a disk below 10 % free space, a lost interface) does not stop
            the run: the run gets the warning `capture_missing`.
        zero_hit:
          type: string
          enum: [warning, error]
          default: warning
          description: |
            How a fault, rule or profile step of the run that matched no packet is reported. `warning` adds the run
            warning `zero_hit` for the step; `error` also ends a run that would have passed as `failed` (the reason
            names the steps) and adds a failed test case for each such step to the JUnit report. A step that replaces
            the overlay of an earlier one is judged by what the overlay matched from then on. A run that ended as
            `error` or `aborted` gets no zero-hit warnings: its steps may never have had the time to match.
        preconditions: {$ref: '#/components/schemas/ScenarioPreconditions'}
        steps:
          type: array
          minItems: 1
          maxItems: 500
          items: {$ref: '#/components/schemas/Step'}
        checks:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Check'}
    ScenarioPreconditions:
      type: object
      properties:
        skip:
          type: array
          description: Preconditions not to check.
          items: {$ref: '#/components/schemas/PreconditionId'}
    PreconditionId:
      type: string
      enum: [target_online, uses_gateway_dns, no_foreign_overlays]
    Step:
      type: object
      description: |
        Exactly one of `profile`, `fault`, `rule`, `dns`, `tls`, `dhcp`, `wireguard`,
        `capture`, `wait`, `remove`, `restore`. `at` is the offset on the run's timeline; a
        `wait` step stops the timeline until its condition holds, so later steps shift by the
        waiting time. Steps with the same `at` run in list order. Tunnel faults and WireGuard
        actions affect everything in the tunnel; they are only allowed when the client or link
        lies inside the target (the target is that WireGuard network or that client).
      required: [id, at]
      properties:
        id: {$ref: '#/components/schemas/StepId'}
        at: {$ref: '#/components/schemas/Duration'}
        target:
          allOf: [{$ref: '#/components/schemas/Scope'}]
          description: Narrows the scenario target (e.g. one device of the target group).
        profile: {$ref: '#/components/schemas/Ref'}
        fault: {$ref: '#/components/schemas/FaultBody'}
        rule: {$ref: '#/components/schemas/AccessRuleBody'}
        dns: {$ref: '#/components/schemas/DnsFault'}
        tls: {$ref: '#/components/schemas/TlsCase'}
        dhcp: {$ref: '#/components/schemas/DhcpAction'}
        wireguard: {$ref: '#/components/schemas/WireGuardAction'}
        capture:
          type: string
          enum: [start, stop]
          description: |
            `start` records the traffic of the step's target (the scenario's, or the narrower one of the step) into a
            capture attached to the run; a start while a capture of that target that an earlier step started is
            still running is `skipped`. `stop` stops the captures that earlier steps started for that target
            (`skipped` when none runs). Captures that are still running when the run ends are stopped with it. A
            `capture: true` capture is stopped by neither.
        wait: {$ref: '#/components/schemas/WaitCondition'}
        remove:
          allOf: [{$ref: '#/components/schemas/StepId'}]
          description: Remove the overlay of this earlier step.
        restore:
          type: boolean
          enum: [true]
          description: Remove all overlays of the run.
    WaitCondition:
      description: Waits until the condition holds for the step target; on timeout the run ends as `error` (like a failed precondition).
      allOf:
        - $ref: '#/components/schemas/TrafficMatch'
        - type: object
          required: [for, timeout]
          properties:
            for:
              type: string
              enum: [online, connected, dns_query]
              description: '`connected` - a new connection matching the `TrafficMatch`; `dns_query` - a query for `name`.'
            name: {$ref: '#/components/schemas/Hostname'}
            timeout: {$ref: '#/components/schemas/Duration'}
    Check:
      type: object
      description: |
        Exactly one check type besides `window` and `name`. Checks observe the scenario
        target (flows, DNS log, TLS handshake events) inside the window. A step has two moments: the timeline
        hands its change to the engine, and the engine answers that the apply is verified; the change takes effect
        in the kernel somewhere between the two. The window is placed so that this cannot make the check wrong.
        A positive check (`reconnected`, `traffic_seen`, `dns_query_seen`) looks for what the change makes possible:
        its window opens when `window.from` is handed over and, with `until`, closes at the answer of that step.
        A negative check (`no_connection`, `traffic_not_seen`) claims that nothing happens while the change is in
        force: its window opens at the answer of `window.from` and, with `until`, closes when that step is handed over.
        With `within` the window is that long from its opening; `start` opens at the beginning of the timeline.
        `CheckResult.window_start` and `window_end` are the wall times of these moments.

        Connections are read every 250 ms. What counts is what changed between two polls inside the window; the
        first poll after the window opened is the baseline, and a connection it finds is not news unless its start
        time in the connection table (conntrack) is at or after `window_start`. After the window has closed, a
        connection that began after `window_end` does not count, however late the poll reads it. A connection
        without a start time cannot be dated and is judged by the poll. DNS queries are placed by the time stamp
        in the DNS log, not by the moment the log is read. A positive check (`reconnected`, `traffic_seen`,
        `dns_query_seen`) passes at its first observation and fails when the window closes without one;
        a negative check (`no_connection`, `traffic_not_seen`) fails at its first observation and passes when
        the window closes. A run lasts until its last check is decided, so a window may reach past the last
        step; the overlays of the run stay until then. A run with a failed check ends as `failed`; one with a
        check that could not be decided (`error`) ends as `error`.

        **What the traffic checks see.** `reconnected`, `no_connection`, `traffic_seen` and `traffic_not_seen`
        read the connection table of the gateway (conntrack). A packet that the gateway drops in the forward
        path (a `drop` rule, a cut) leaves no entry there, so it is invisible to them: while a drop is in force
        `traffic_not_seen` passes for a device that keeps sending to the blocked destination, and `traffic_seen`
        of that destination fails. Counting such packets is what the zero-hit counters of the run's own rules
        do. A destination `network` is the network's whole address set (its subnet, the networks behind a hub's
        clients, a link's routes and a LAN's downstream routes), and `uplink` is every address outside every
        network and outside the management prefixes, as in the rules.
      required: [window]
      properties:
        name:
          type: string
          maxLength: 100
          description: Name in the report (JUnit testcase). Default derived from the type.
        window: {$ref: '#/components/schemas/CheckWindow'}
        reconnected:
          allOf: [{$ref: '#/components/schemas/TrafficMatch'}]
          description: |
            A new connection of the target matching the selector is established inside the window: one that was there
            when the window opened does not count, one that is only trying (TCP before the handshake is through, a UDP
            flow nobody answered) does not count until it is answered.
        no_connection:
          allOf: [{$ref: '#/components/schemas/TrafficMatch'}]
          description: No connection matching the selector is established inside the window.
        traffic_seen:
          allOf: [{$ref: '#/components/schemas/TrafficMatch'}]
          description: |
            A packet of a connection of the target matching the selector is seen inside the window - a new connection in
            any state, or an old one that carries packets. The connection table is what is read: a packet that the
            gateway drops in the forward path leaves no entry, so a blocked destination is never "seen" (see `Check`).
        traffic_not_seen: {$ref: '#/components/schemas/TrafficNotSeenCheck'}
        dns_query_seen: {$ref: '#/components/schemas/DnsQueryCheck'}
        tls_rejected:
          allOf: [{$ref: '#/components/schemas/TrafficMatch'}]
          description: |
            A device of the target aborts a TLS handshake with the gateway's TLS responder inside the window (M21): it
            was shown the certificate of a case and did not take it (an alert, or a close or reset of the connection). The
            handshake cases show no certificate and never satisfy this check (the device's reaction to a reset or a stall is
            for a traffic check). The selector is the connection the device meant, its original destination (`destination`,
            `ports`; `protocol` is `tcp`).
            It needs a TLS case that selects the connection, which the run's own steps provide; a connection that no
            case selects never reaches the responder, so the check fails.
        tls_accepted:
          allOf: [{$ref: '#/components/schemas/TrafficMatch'}]
          description: |
            A device of the target completes a TLS handshake with the responder inside the window: it took the
            certificate the responder showed. For a case that must be rejected (every certificate case, plan §2.8) that
            is the finding of the security check, so a scenario that expects it uses the check to assert the broken
            device; a scenario that expects a correct device uses `tls_rejected`.
    DnsQueryCheck:
      type: object
      description: |
        A device of the target asks the gateway's DNS proxy for the name inside the window. The time stamp of the
        query in the DNS log decides, not the moment it is read; the log arrives after the answer, so the check is
        decided about a second after its window has closed, and a query asked at the end of the window still counts.
      required: [name]
      properties:
        name: {$ref: '#/components/schemas/Hostname'}
    TrafficNotSeenCheck:
      description: |
        No packet of a connection of the target matching the selector (and none of `except`) is seen inside the window.
        Only the connection table is read: a packet that the gateway drops in the forward path is not seen (see `Check`).
      allOf:
        - $ref: '#/components/schemas/TrafficMatch'
        - type: object
          properties:
            except:
              type: array
              description: Destinations that are allowed ("no traffic to unexpected destinations").
              items: {$ref: '#/components/schemas/Destination'}
    CheckWindow:
      type: object
      required: [from]
      properties:
        from:
          type: string
          pattern: '^([a-z][a-z0-9_-]{0,31})$'
          description: |
            Step id whose hand-over (positive checks) or answer (negative checks) opens the window, or `start` (the beginning
            of the timeline); see `Check`.
        within:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          description: Window length. Exactly one of `within` and `until`.
        until:
          allOf: [{$ref: '#/components/schemas/StepId'}]
          description: |
            Step that ends the window: its answer for a positive check, its hand-over for a negative one (see `Check`).

    # ============================================================ actors and overlays (plan §2.1.1)
    Actor:
      type: object
      required: [type, id]
      properties:
        type:
          type: string
          enum: [user, token, run, system]
        id:
          type: string
          description: '`admin` for the user, token UUID, run UUID, `system`.'
        name: {type: string}
    Owner:
      allOf: [{$ref: '#/components/schemas/Actor'}]
      description: Owner of an overlay - `user`, `token` or `run`.
    OverlayKind:
      type: string
      enum: [fault, profile, rule, dns, tls, dhcp, wireguard]
    OverlayRequest:
      type: object
      description: |
        Exactly one of `profile`, `fault`, `rule`, `dns`, `tls`, `dhcp`, `wireguard`.
        `target` is required except for tunnel faults and WireGuard actions. Example (plan §2.15):
        `{"target": {"device": "esp32-42"}, "profile": "bad-lte", "ttl": "5m"}`.

        **Overlay key** (writing an overlay with an existing key replaces it, plan §2.1.1):
        owner + kind + target + the kind's selector:

        | Kind | Selector part of the key |
        |---|---|
        | `fault` | `family` + `TrafficMatch` (impairment, mtu) or `tunnel` (tunnel) |
        | `profile` | none - one profile activation per owner and target |
        | `rule` | `TrafficMatch` (changing the action replaces the rule) |
        | `dns` | the set of `names` |
        | `tls` | `TrafficMatch` + `sni` |
        | `dhcp` | `action` |
        | `wireguard` | `client` or `link` + `action` |

        **Order of overlay rules:** newest first (by `updated_at`), all before configured rules.

        **Specificity of non-impairment families** (plan §2.4 levels): DNS `names` and TLS
        `TrafficMatch`/`sni` count as destination/port; DHCP actions target a device (level 4)
        or a network (level 8); tunnel faults are resolved per tunnel only (overlay before
        configuration, newest wins) and have no level.
      properties:
        target: {$ref: '#/components/schemas/Scope'}
        ttl:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          description: Remove the overlay after this time.
        expires_in:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          writeOnly: true
          description: |
            Only with `ttl`, at most `ttl`: this write removes the overlay after this time instead of
            after `ttl`; `ttl` stays the overlay's TTL (shown, and started over by a later write
            without `expires_in`). An edit keeps an overlay's remaining time this way, also when it
            takes over the overlay of another owner (the web UI's fault dialog, P3-M13-06). Write-only:
            an overlay as read has `ttl` and `expires_at`, never `expires_in`.
        lease:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          description: The owner must renew the overlay within this interval (`POST /overlays/{id}/renew`).
        profile: {$ref: '#/components/schemas/Ref'}
        fault: {$ref: '#/components/schemas/FaultBody'}
        rule: {$ref: '#/components/schemas/AccessRuleBody'}
        dns: {$ref: '#/components/schemas/DnsFault'}
        tls: {$ref: '#/components/schemas/TlsCase'}
        dhcp: {$ref: '#/components/schemas/DhcpAction'}
        wireguard: {$ref: '#/components/schemas/WireGuardAction'}
    WireGuardAction:
      type: object
      description: |
        WireGuard test action (plan §2.2.1, §2.2.2), lasting as long as the overlay:
        `disable` removes the peer from the interface ("peer offline", for a link "link
        down"); `key_mismatch` replaces the peer's public key on the gateway by a key derived from
        the overlay's id and the real key (no one holds its private key, and the same overlay always
        gives the same key, so a re-apply leaves the interface as it is), as if a rotated key was not
        deployed; `block_endpoint` drops the peer's encrypted UDP in both directions (output and
        input hook, before connection tracking).

        The overlay is `effective` while it changes something: the peer is on its interface, and
        for `block_endpoint` the IPv4 address and port the peer is reached at are known: the peer
        has connected once from an IPv4 endpoint, or the link's configured endpoint is an IPv4
        `address:port` (a host name is not resolved for this). A `block_endpoint` overlay counts
        the packets it dropped. A peer that is disabled in the configuration is not on its
        interface, so the overlay has nothing to change and shows `disabled`, as does a
        `block_endpoint` whose peer has no known IPv4 endpoint. Decided by the maintainer on
        2026-10-11.
      required: [action]
      minProperties: 2
      properties:
        client: {$ref: '#/components/schemas/Ref'}
        link: {$ref: '#/components/schemas/Ref'}
        action:
          type: string
          enum: [disable, key_mismatch, block_endpoint]
    Overlay:
      allOf:
        - $ref: '#/components/schemas/OverlayRequest'
        - type: object
          required: [id, kind, owner, created_at, updated_at, generation]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            kind: {$ref: '#/components/schemas/OverlayKind'}
            owner: {$ref: '#/components/schemas/Owner'}
            run: {$ref: '#/components/schemas/OverlayRunRef'}
            expires_at:
              type: string
              format: date-time
            lease_expires_at:
              type: string
              format: date-time
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
              description: Last replacement; decides "newer wins" among overlays at the same level (D26).
            generation:
              type: integer
              format: int64
              description: Generation in which the current version became active.
            counters: {$ref: '#/components/schemas/Counter'}
            queues:
              type: array
              description: netem queues currently fed by this overlay (impairment and tunnel faults, profile impairment parts).
              items: {$ref: '#/components/schemas/QueueStats'}
            state: {$ref: '#/components/schemas/EffectState'}
            overridden_by:
              type: array
              description: |
                For a fault or profile overlay that is `overridden` or `partially_overridden`, the faults
                that beat it (the winners over the devices of its target at a destination and port it
                selects), as `FaultView.overridden_by` gives them for a configured fault. A profile is
                counted per part: the winners of the families its parts compete in.
              items: {$ref: '#/components/schemas/FaultRef'}
    OverlayRunRef:
      type: object
      description: Set when a run owns the overlay.
      required: [id, step]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        step: {$ref: '#/components/schemas/StepId'}
    EffectState:
      type: string
      enum: [effective, partially_overridden, overridden, disabled]
      description: |
        How much of the traffic it selects the fault, profile part or rule wins (plan §2.4), over
        every source of its scope: `effective` all of it, `partially_overridden` a part (other faults
        beat it on the rest, e.g. a device fault on one device of a network fault's network, or a fault
        on one port), `overridden` none, `disabled` for a fault with `enabled: false` and for what the
        kernel does not run. Impairment and MTU faults are counted against the classification of every
        source; a fault of another family, or one that names a hostname, is `effective` when it wins at
        all. A profile activation has one part per family, each counted like a fault of its family:
        `effective` when every part wins all of its traffic, `overridden` when none wins anything,
        `partially_overridden` otherwise. `GET /explain` names the winner of one traffic tuple.
    Counter:
      type: object
      required: [packets, bytes, epoch]
      properties:
        packets: {type: integer, format: int64}
        bytes: {type: integer, format: int64}
        epoch:
          type: integer
          format: int64
          description: Changes when counters restart (reboot, recreated object).
        last_match:
          type: string
          format: date-time
          description: |
            Access rules (configured, overlay and system rules) and port forwards only: when the rule last
            matched a new connection, as the kernel notes it (the nftables `last` statement of the rule, kernel 5.17
            or newer). An apply that makes the rule anew carries the time over (late by at most the
            length of the apply). Absent while the rule has not matched since it was created (a new
            rule, or a table made anew, e.g. after a reboot).
    QueueStats:
      type: object
      description: |
        The counters of one netem queue: the leaf below the class of one fault id and direction on one
        interface, as the kernel counts them when the object is read. `epoch` is the generation of the
        apply that made the queue; it changes whenever the queue is created again (its counters start at
        zero), so two readings with the same epoch may be subtracted and readings with different ones
        must not be. A change of the fault's parameters keeps the queue and its epoch.
      properties:
        interface: {type: string}
        direction:
          type: string
          enum: [upload, download]
        device:
          allOf: [{$ref: '#/components/schemas/Uuid'}]
          description: Set for per-device queues (D18).
        sent_packets:
          type: integer
          format: int64
          description: Packets that left the queue (i.e. were delayed and sent).
        sent_bytes:
          type: integer
          format: int64
          description: Bytes of the packets that left the queue.
        dropped_packets:
          type: integer
          format: int64
          description: Packets the queue dropped, the loss the fault configures and the packets that did not fit into the queue limit.
        overlimits: {type: integer, format: int64}
        backlog_packets:
          type: integer
          format: int64
          description: Packets held in the queue now.
        backlog_bytes: {type: integer, format: int64}
        epoch: {type: integer, format: int64}
        flapping:
          allOf: [{$ref: '#/components/schemas/FlapState'}]
          description: Set for the queues of a flapping fault (plan §2.5).
    FlapState:
      type: object
      description: |
        Where a flapping fault is in its cycle (up for `up`, then a blackout for `down`, starting up).
        All queues of one fault and direction flap in step. The phase is the engine's clock's, not the
        configuration's: a gateway that restarts starts every flapping up. A boundary is made within
        100 ms of its time on a native or KVM machine (plan §2.10), or right after the apply it fell into.
      required: [phase, since, next_change_at]
      properties:
        phase:
          type: string
          enum: [up, down]
          description: The phase the kernel holds now.
        since:
          type: string
          format: date-time
          description: When the queue entered the phase.
        next_change_at:
          type: string
          format: date-time
          description: When the schedule ends the phase.

    # ============================================================ revisions and apply
    RevisionStatus:
      type: string
      enum: [candidate, pending_confirm, active, superseded, rolled_back]
    Revision:
      type: object
      required: [id, status, created_at, created_by, schema_version]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        status: {$ref: '#/components/schemas/RevisionStatus'}
        base:
          type: integer
          format: int64
          description: Revision this candidate was created against.
        message: {type: string}
        schema_version: {type: integer}
        created_at: {type: string, format: date-time}
        created_by: {$ref: '#/components/schemas/Actor'}
        applied_at: {type: string, format: date-time}
        confirmed_at: {type: string, format: date-time}
        last_known_good:
          type: boolean
          description: |
            The last revision that was applied, verified and (if it needed it) confirmed. It is
            the one applied after a failed start, and a revision that was never confirmed never
            becomes it.
    RevisionWithConfiguration:
      allOf:
        - $ref: '#/components/schemas/Revision'
        - type: object
          required: [configuration]
          properties:
            configuration: {$ref: '#/components/schemas/Configuration'}
    DomainChange:
      type: object
      description: One change in the user's terms (plan §3.2 "domain diff").
      required: [op, kind, path, summary]
      properties:
        op:
          type: string
          enum: [added, removed, changed]
        kind:
          type: string
          enum: [uplink, management, network, client, link_peer, routing, routing_protocol, device, group, probe, access_rule, access_matrix, port_forward, fault, profile, scenario, settings]
        id: {type: string}
        name: {type: string}
        path:
          type: string
          description: JSON pointer in the configuration.
        summary:
          type: string
          example: 'ESP32-42 upload: +200 ms'
        fields:
          type: array
          items:
            type: object
            required: [path]
            properties:
              path: {type: string}
              old: {}
              new: {}
    Preview:
      type: object
      required: [revision, domain, linux, requires_confirm]
      properties:
        revision: {type: integer, format: int64}
        base: {type: integer, format: int64}
        domain:
          type: array
          items: {$ref: '#/components/schemas/DomainChange'}
        linux:
          type: object
          description: Unified diffs of the normalized target state per subsystem (empty when unchanged).
          properties:
            nftables: {type: string}
            tc:
              type: string
              description: |
                The tc trees per interface, one object per line led by the interface (`br-iot: qdisc 12: parent 1:12 netem …`):
                the HTB root, the classes, the netem leaves with their parameters and the filters, and the ingress filters of
                the tunnel faults (`wan0 ingress: …`). Seeds, counters and the values the kernel derives are left out.
            routes: {type: string}
            wireguard:
              type: string
              description: Without private keys.
            bird: {type: string}
            services: {type: string}
        requires_confirm:
          type: boolean
          description: Lockout-relevant change; applying it starts commit-confirm.
        warnings:
          type: array
          description: |
            What the candidate allows but may not do as expected; a warning does not stop the apply. `path` is the
            JSON pointer of the field concerned when there is one: `fixed_ip_in_pool` at `/devices/{id}/fixed_ip` for a
            fixed address inside a DHCP pool of its network (while another client holds the address the device gets a
            pool address until that lease is released), `fixed_ip_dhcp_off` at `/devices/{id}/fixed_ip` for a fixed
            address in a network with DHCP off (no reservation is made), `faults_not_on_forwards` at a port forward, a
            compiler warning at its network.
          items:
            type: object
            required: [code, message]
            properties:
              code: {type: string}
              message: {type: string}
              path: {type: string}
        capacity:
          type: array
          description: |
            tc classes per interface after the change: every interface that carries a tree (the IFB device of the tunnel
            faults included), with the default class, against the limit per interface (`class_limit_per_interface` of
            the capabilities). Absent when no fault needs a class; a change above the limit is `capacity_exceeded`.
          items:
            type: object
            required: [interface, classes, limit]
            properties:
              interface: {type: string}
              classes: {type: integer}
              limit: {type: integer}
        queues:
          type: array
          description: |
            The queues each winning fault (or part of an activated profile) creates after the change (plan §2.4, D18): with a
            rate, an explicit queue limit or keep order one per matched device plus one that the addresses no device owns
            share, otherwise one. Each has a class in every direction the fault impairs. Absent when no fault needs a class.
          items:
            type: object
            required: [fault, layer, scope, queues]
            properties:
              fault:
                allOf: [{$ref: '#/components/schemas/Uuid'}]
                description: Overlay id or configured fault id.
              layer:
                type: string
                enum: [overlay, config]
              profile:
                type: string
                description: Name of the activated profile when the fault is one of its parts.
              scope: {type: string, description: 'Where it applies, in words (`network IoT`).'}
              queues: {type: integer}
        references:
          type: array
          description: Active overlays and runs that applying would orphan (needs `force=true`).
          items: {$ref: '#/components/schemas/BlockingReference'}
        rules:
          type: array
          description: |
            The access rules in the order they are evaluated after the change, overlay rules first (plan §2.4):
            the effective list. A rule with a hostname destination is in it (it looks up the DNS-derived address set of
            the name). Absent when there is no rule.
          items: {$ref: '#/components/schemas/PreviewRule'}
        port_forwards:
          type: array
          description: |
            The enabled port forwards after the change (M35a), sorted by name and id. Faults do not apply to
            forwarded connections (M35b): when a fault would select a forward's target, the `warnings` say so
            (`faults_not_on_forwards`, with the forward's path). Absent when there is none.
          items: {$ref: '#/components/schemas/PreviewPortForward'}
        faults:
          type: array
          description: |
            The faults and the parts of activated profiles that win for some traffic after the
            change, with the profile each part comes from (plan §2.4): the origin of the effective
            parameters. Overlays count as they are now, so a revision that changes a profile shows
            what its activations will produce. A winner that impairs nothing (the profile
            `normal`) is listed with the summary `no impairment`. Absent when there is none.
          items: {$ref: '#/components/schemas/PreviewFault'}
    PreviewFault:
      type: object
      required: [family, layer, id, scope, summary]
      properties:
        family: {$ref: '#/components/schemas/FaultFamily'}
        layer:
          type: string
          enum: [overlay, config]
        id:
          allOf: [{$ref: '#/components/schemas/Uuid'}]
          description: Overlay id or configured fault id.
        profile:
          type: string
          description: Name of the activated profile when this is one of its parts.
        scope: {type: string, description: 'Where it applies, in words (`network IoT`, `device esp32-42`).'}
        summary:
          type: string
          example: 'latency 150ms ± 50ms, loss 3%, rate 2Mbit'
    PreviewRule:
      type: object
      required: [key, layer, position, action, protocol]
      properties:
        key:
          type: string
          description: '`config:<uuid>` or `overlay:<uuid>`; the named counter of the rule is derived from it, so it keeps its counter while the key stays.'
        layer: {type: string, enum: [overlay, config]}
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        position: {type: integer, description: '0-based place in the effective order.'}
        action: {$ref: '#/components/schemas/AccessAction'}
        reject_with: {$ref: '#/components/schemas/RejectType'}
        cut_existing: {type: boolean}
        scope: {type: string, description: 'Who the rule applies to, in words (`network IoT`, `device esp32-42`).'}
        destination: {type: string, description: 'Where to, in words; absent for any destination.'}
        protocol: {$ref: '#/components/schemas/Protocol'}
        ports:
          type: array
          items: {type: string, example: '8883', description: 'A port or a range `from-to`.'}
        new:
          type: boolean
          description: The rule is not in the kernel yet (a new rule, or one that comes with this revision).
    PreviewPortForward:
      type: object
      required: [id, protocol, entry, external_ports, target, target_ports, faults_apply]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string}
        protocol: {$ref: '#/components/schemas/PortForwardProtocol'}
        entry: {$ref: '#/components/schemas/PortForwardEntry'}
        external_ports: {type: string, example: '8000-8010', description: 'A port or a range `from-to`.'}
        target: {type: string, description: 'The target in words (`device esp32-42`, `10.10.0.20`).'}
        target_ports: {type: string, example: '9000-9010'}
        faults_apply:
          type: boolean
          description: Always false - faults do not apply to forwarded connections (M35b).
        new:
          type: boolean
          description: The forward is not in the active revision, or it changed.
    ApplyResult:
      type: object
      required: [revision, status, generation]
      properties:
        revision: {type: integer, format: int64}
        status:
          type: string
          enum: [active, pending_confirm]
        generation: {type: integer, format: int64}
        confirm_deadline:
          type: string
          format: date-time
        duration_ms: {type: integer}
        removed_overlays:
          type: array
          description: Overlays removed by `force=true` (event `overlay_orphaned`).
          items: {$ref: '#/components/schemas/Uuid'}
        aborted_runs:
          type: array
          description: |
            Queued and running runs that `force=true` aborted because they refer to what the revision deletes, in the
            order the runs were made. Their overlays went with them and are not in `removed_overlays`.
          items: {$ref: '#/components/schemas/Uuid'}

    # ============================================================ system
    GatewayState:
      type: object
      required: [generation, active_revision, safe_mode]
      properties:
        generation: {type: integer, format: int64}
        active_revision: {type: integer, format: int64}
        last_known_good: {type: integer, format: int64}
        pending_confirm:
          type: object
          properties:
            revision: {type: integer, format: int64}
            deadline: {type: string, format: date-time}
        last_apply:
          type: object
          properties:
            revision: {type: integer, format: int64}
            generation: {type: integer, format: int64}
            at: {type: string, format: date-time}
            result:
              type: string
              enum: [ok, rolled_back, failed]
            duration_ms: {type: integer}
            error: {type: string}
        safe_mode: {type: boolean}
        safe_mode_reason: {type: string}
        degraded_networks:
          type: array
          items: {$ref: '#/components/schemas/Uuid'}
        counter_epoch:
          type: integer
          format: int64
          description: Epoch of the named nftables counters as a whole; changes when they start over (the table was made anew, or the gateway restarted and cannot tell). The epoch of one counter is in its `Counter`.
        boot_id: {type: string}
        overlays_active: {type: integer}
        runs_active: {type: integer}
    LinuxState:
      type: object
      required: [revision, generation, read_at, nftables, tc, routes, wireguard]
      properties:
        revision:
          type: integer
          format: int64
          description: The active revision.
        generation:
          type: integer
          format: int64
          description: The generation of the desired state when the kernel was read.
        read_at: {type: string, format: date-time}
        nftables:
          type: string
          description: The table `inet chaosgw` in nft syntax, rules with `counter packets N bytes M` (the generation chain left out).
        tc:
          type: string
          description: 'One line per qdisc, class and filter, led by the interface (`br-iot: qdisc 12: parent 1:12 netem …`), each netem queue followed by its counters.'
        routes:
          type: string
          description: Bridges with their addresses and ports, the policy rules and the routes of Chaos Gateway's tables.
        wireguard:
          type: string
          description: The WireGuard interfaces with address, MTU, port and peers (public key, allowed IPs, endpoint, last handshake, bytes); without keys.
    LinuxObjectState:
      type: object
      required: [kind, id, revision, generation, read_at, keys, nftables, tc]
      properties:
        kind:
          type: string
          enum: [device, rule, fault]
        id: {type: string, description: The object as asked for.}
        revision:
          type: integer
          format: int64
          description: The active revision.
        generation:
          type: integer
          format: int64
          description: The generation of the desired state when the kernel was read.
        read_at: {type: string, format: date-time}
        keys:
          type: array
          description: One entry per kernel object found for the object, by the name the compiler gave it (`counter rule_8e9ca98e27`, `chain mark_7`, `map ident4_4c1a7e 10.10.0.5`, `class br-iot 1:1e`); empty when the kernel holds nothing of it.
          items: {type: string}
        nftables:
          type: string
          description: Those objects of the table `inet chaosgw` in nft syntax (rules with `counter` and `last used`), empty when there is none.
        tc:
          type: string
          description: Its tc classes, netem queues and filters, one line each led by the interface, each followed by its counters; empty when there is none.
    Capabilities:
      type: object
      required: [version, features, overlay_kinds, fault_families, step_types, check_types]
      properties:
        version: {type: string}
        features:
          type: array
          description: Feature flags of this build, e.g. `networks.lan`, `networks.wireguard`, `routing.bird`, `dhcp`, `dns.proxy`, `dns.faults`, `dns.hostname_selectors`, `tls.cases`, `faults.impairment`, `faults.mtu`, `faults.tunnel`, `wireguard.actions`, `rules`, `profiles`, `runs`, `checks`, `captures`, `tls.responder`, `tls.intercept`, `dhcp.actions`, `diagnostics`, `probes`, `metrics`, `port_forwards`.
          items: {type: string}
        overlay_kinds:
          type: array
          items: {$ref: '#/components/schemas/OverlayKind'}
        fault_families:
          type: array
          items: {$ref: '#/components/schemas/FaultFamily'}
        step_types:
          type: array
          items: {type: string}
        check_types:
          type: array
          items: {type: string}
        diagnostic_types:
          type: array
          description: The types `POST /diagnostics` accepts in this build.
          items: {type: string}
        limits:
          type: object
          description: The capacity limits of this gateway (plan §3.3); a change above one is `capacity_exceeded`.
          properties:
            fault_ids:
              type: integer
              example: 4095
              description: Fault ids in use at the same time (the mark layout).
            class_limit_per_interface:
              type: integer
              example: 1000
              description: tc classes one interface may carry, the default class included, as this gateway enforces it (by default 1000 on x86-64 and 200 on arm64).
    SystemInfo:
      type: object
      properties:
        version: {type: string}
        commit: {type: string}
        build_date: {type: string, format: date-time}
        api_version: {type: string}
        os: {type: string, example: Ubuntu 24.04.3 LTS}
        kernel: {type: string}
        arch:
          type: string
          enum: [amd64, arm64]
        hostname: {type: string}
        boot_id: {type: string}
        started_at: {type: string, format: date-time}
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        components:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name:
                type: string
                enum: [api, executor, svcns, dns, tls, tls_proxy, kea, bird]
              status:
                type: string
                enum: [healthy, degraded, unhealthy, disabled]
              detail: {type: string}
    PreflightReport:
      type: object
      required: [status, checks]
      properties:
        at: {type: string, format: date-time}
        status:
          type: string
          enum: [ok, warn, fail]
          description: >-
            The worst status of the host's checks and of the checks of the interfaces assigned to test
            networks. The check of an interface that may become a test interface (before the setup every
            interface) keeps its own status but does not count here.
        checks:
          type: array
          items:
            type: object
            required: [id, status, message]
            properties:
              id:
                type: string
                example: module.sch_netem
              status:
                type: string
                enum: [ok, warn, fail]
              message: {type: string}
              fix: {type: string}
              interface:
                type: string
                description: The host interface the check is about (the OS-configuration check of a test interface).
    HostInterface:
      type: object
      required: [name, mac]
      properties:
        name: {type: string}
        mac: {$ref: '#/components/schemas/MacAddress'}
        driver: {type: string}
        bus:
          type: string
          enum: [pci, usb, platform, virtual, unknown]
        link_up: {type: boolean}
        speed_mbps: {type: integer}
        addresses:
          type: array
          items: {$ref: '#/components/schemas/Ipv4Interface'}
        os_managed:
          type: boolean
          description: Configured by netplan, NetworkManager or systemd-networkd (must be false for test interfaces); absent when the configuration of the operating system could not be read. The preflight's check of the interface names the entry.
        assigned:
          type: object
          properties:
            role:
              type: string
              enum: [uplink, management, network]
            network: {$ref: '#/components/schemas/Uuid'}
    Busy:
      type: object
      required: [busy]
      properties:
        busy: {type: boolean}
        runs_active: {type: integer}
        runs_queued: {type: integer}
        run_ids:
          type: array
          items: {$ref: '#/components/schemas/Uuid'}
    ResetResult:
      type: object
      required: [removed_overlays, aborted_runs, generation]
      properties:
        removed_overlays:
          type: integer
          description: Overlays removed, including the ones that the aborted runs removed when they ended.
        aborted_runs:
          type: integer
          description: Queued and running runs that were aborted (the caller's, or every run with `owner=all`).
        generation: {type: integer, format: int64}

    # ============================================================ auth and setup
    TokenScope:
      type: string
      enum: [read, overlays, full]
    LoginRequest:
      type: object
      required: [password]
      properties:
        username:
          type: string
          enum: [admin]
          default: admin
        password: {type: string, format: password}
    Session:
      type: object
      required: [kind, scope]
      properties:
        kind:
          type: string
          enum: [session, token]
        scope: {$ref: '#/components/schemas/TokenScope'}
        user:
          type: string
          enum: [admin]
        token:
          type: object
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            name: {type: string}
        csrf_token:
          type: string
          description: Sessions only; send as `X-CSRF-Token` on unsafe methods.
        expires_at: {type: string, format: date-time}
    PasswordChange:
      type: object
      required: [current, new]
      properties:
        current: {type: string, format: password}
        new: {type: string, format: password, minLength: 12}
    ApiToken:
      type: object
      required: [id, name, scope, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name: {type: string, maxLength: 64}
        scope: {$ref: '#/components/schemas/TokenScope'}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    ApiTokenCreate:
      type: object
      required: [name, scope]
      properties:
        name: {type: string, maxLength: 64}
        scope: {$ref: '#/components/schemas/TokenScope'}
        expires_in:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          description: Default - no expiry.
    ApiTokenCreated:
      allOf:
        - $ref: '#/components/schemas/ApiToken'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: Shown only in this response; stored as a hash.
    SetupStatus:
      type: object
      required: [completed]
      properties:
        completed: {type: boolean}
        interfaces:
          type: array
          items: {$ref: '#/components/schemas/HostInterface'}
        preflight: {$ref: '#/components/schemas/PreflightReport'}
        suggested_uplink: {$ref: '#/components/schemas/InterfaceRef'}
    SetupRequest:
      type: object
      required: [admin_password, configuration]
      properties:
        admin_password: {type: string, format: password, minLength: 12}
        configuration:
          allOf: [{$ref: '#/components/schemas/Configuration'}]
          description: Initial configuration (revision 1) - uplink, management and at least one test network.

    # ============================================================ views (configuration + observed state)
    UplinkView:
      type: object
      required: [config, status]
      properties:
        config: {$ref: '#/components/schemas/Uplink'}
        status:
          type: object
          properties:
            interface: {type: string}
            link_up: {type: boolean}
            address: {$ref: '#/components/schemas/Ipv4Interface'}
            gateway: {$ref: '#/components/schemas/Ipv4'}
            dns_servers:
              type: array
              items: {$ref: '#/components/schemas/Ipv4'}
            speed_mbps: {type: integer}
            rx_bytes:
              type: integer
              format: int64
              description: Bytes the uplink interface received since it came up (the kernel's interface counter); `GET /uplink/traffic` has the rates the gateway derives from it.
            tx_bytes:
              type: integer
              format: int64
              description: Bytes the uplink interface sent since it came up.
    UplinkTraffic:
      type: object
      required: [interval_seconds, period_seconds, counters, samples]
      properties:
        interval_seconds:
          type: integer
          description: How often the uplink's counters are read.
        period_seconds:
          type: integer
          description: How long a sample is kept.
        interface:
          type: string
          description: The uplink interface of the last reading.
        counters:
          type: boolean
          description: The last reading found the uplink interface's byte counters (false - no uplink interface, or it reports none).
        samples:
          type: array
          description: Oldest first.
          items: {$ref: '#/components/schemas/UplinkTrafficSample'}
    UplinkTrafficSample:
      type: object
      required: [time, down_bps, up_bps]
      properties:
        time:
          type: string
          format: date-time
          description: When the reading that ends the interval was taken (millisecond precision).
        down_bps:
          type: number
          format: double
          description: Bits per second the uplink interface received in the interval.
        up_bps:
          type: number
          format: double
          description: Bits per second the uplink interface sent in the interval.
    NetworkView:
      type: object
      required: [id, config, status]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        config: {$ref: '#/components/schemas/Network'}
        status: {$ref: '#/components/schemas/NetworkStatus'}
    NetworkStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [ok, degraded, pending]
          description: '`degraded` - an assigned interface is missing; `pending` - not applied yet (candidate view).'
        interface:
          type: string
          description: Linux interface (bridge or WireGuard interface).
        ports:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              mac: {$ref: '#/components/schemas/MacAddress'}
              present: {type: boolean}
              link_up: {type: boolean}
              speed_mbps: {type: integer}
              offloads_disabled: {type: boolean}
        public_key:
          allOf: [{$ref: '#/components/schemas/WireGuardKey'}]
          description: WireGuard networks - the gateway's public key.
        peers_online: {type: integer}
        peers_total: {type: integer}
        link_peer: {$ref: '#/components/schemas/WireGuardPeerStatus'}
        dhcp:
          type: object
          properties:
            enabled: {type: boolean}
            leases_active: {type: integer}
            pool_free: {type: integer}
        rx_bytes: {type: integer, format: int64}
        tx_bytes: {type: integer, format: int64}
    WireGuardClientView:
      type: object
      required: [id, network, config, status]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        network: {$ref: '#/components/schemas/Uuid'}
        config: {$ref: '#/components/schemas/WireGuardClient'}
        status: {$ref: '#/components/schemas/WireGuardPeerStatus'}
        private_key_stored:
          type: boolean
          description: Whether a complete export (with private key) is still possible.
    WireGuardPeerStatus:
      type: object
      required: [online]
      properties:
        online:
          type: boolean
          description: Handshake younger than 3 min.
        last_handshake: {type: string, format: date-time}
        endpoint: {type: string}
        rx_bytes: {type: integer, format: int64}
        tx_bytes: {type: integer, format: int64}
        learned_routes:
          type: array
          items: {$ref: '#/components/schemas/Ipv4Cidr'}
    RoutingStatus:
      type: object
      properties:
        bird:
          type: object
          properties:
            running: {type: boolean}
            version: {type: string}
            router_id: {$ref: '#/components/schemas/Ipv4'}
            last_reconfigure: {type: string, format: date-time}
            last_error: {type: string}
        protocols:
          type: array
          items:
            type: object
            required: [id, name, type, state]
            properties:
              id: {$ref: '#/components/schemas/Uuid'}
              name: {type: string}
              type:
                type: string
                enum: [bgp, ospf, babel, static, external]
              state:
                type: string
                enum: [up, down, starting, disabled, error]
              info:
                type: string
                description: BIRD's state detail (e.g. `Established`, `Full/PtP`).
              since: {type: string, format: date-time}
              routes:
                type: object
                properties:
                  imported: {type: integer}
                  filtered: {type: integer}
                  exported: {type: integer}
                  limit_hit:
                    type: boolean
                    description: "The configured import limit has been reached (action block): the session stays up, routes beyond it are not imported."
              announced:
                type: array
                description: Prefixes announced to the neighbor.
                items: {$ref: '#/components/schemas/Ipv4Cidr'}
              received:
                type: array
                description: Prefixes received (accepted and filtered are listed under `/routing/routes`).
                items: {$ref: '#/components/schemas/Ipv4Cidr'}
              last_error: {type: string}
    RouteOrigin:
      type: string
      enum: [connected, static, client, learned, external]
    RouteEntry:
      type: object
      required: [destination, table, origin]
      properties:
        destination: {$ref: '#/components/schemas/Ipv4Cidr'}
        gateway: {$ref: '#/components/schemas/Ipv4'}
        interface: {type: string}
        table: {type: integer}
        origin: {$ref: '#/components/schemas/RouteOrigin'}
        protocol:
          type: object
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            name: {type: string}
        network: {$ref: '#/components/schemas/Uuid'}
        metric: {type: integer}
    DeviceOrigin:
      type: string
      enum: [configured, discovered, wireguard_client, probe]
    DeviceView:
      type: object
      required: [id, name, origin, observed]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        name:
          type: string
          description: Configured name, or a generated one (`dev-<mac>`) for discovered devices.
        origin: {$ref: '#/components/schemas/DeviceOrigin'}
        config: {$ref: '#/components/schemas/Device'}
        network: {$ref: '#/components/schemas/Uuid'}
        groups:
          type: array
          items: {$ref: '#/components/schemas/Uuid'}
        observed: {$ref: '#/components/schemas/DeviceObserved'}
        effective:
          type: array
          description: Winning fault per family for the device's traffic without destination (use `/explain` for a destination).
          items: {$ref: '#/components/schemas/FaultRef'}
        overlays:
          type: array
          items: {$ref: '#/components/schemas/Uuid'}
    DeviceObserved:
      type: object
      required: [online]
      properties:
        online:
          type: boolean
          description: >-
            The device gave a sign of life within the last 60 s (last_seen): a confirmed (REACHABLE) neighbor entry, traffic
            it sent on a tracked connection, a new or renewed DHCP lease, or a WireGuard handshake younger than 3 min. A
            connection that only exists, or an existing lease, does not count. It turns online at the first sign of life
            and offline 60 s after the last one; device_online and device_offline are sent on these transitions.
        last_seen:
          type: string
          format: date-time
          description: When the device last gave a sign of life (see online).
        macs:
          type: array
          items: {$ref: '#/components/schemas/MacAddress'}
        addresses:
          type: array
          items: {$ref: '#/components/schemas/Ipv4'}
        sources:
          type: array
          items:
            type: string
            enum: [config, dhcp, neighbor, conntrack, wireguard, probe]
        lease: {$ref: '#/components/schemas/DhcpLease'}
        wireguard: {$ref: '#/components/schemas/WireGuardPeerStatus'}
        upload_bps:
          type: integer
          format: int64
          description: >-
            Bytes per second the device sent, averaged over the conntrack reads of the last 10 s (each connection counted
            by what it moved since the previous read; a port-forwarded connection counts for its target device). 0 when
            the device moved nothing; left out while unknown (before the second conntrack read, or when the last read
            failed).
        download_bps:
          type: integer
          format: int64
          description: Bytes per second the device received; as upload_bps.
        flows_active:
          type: integer
          description: Tracked connections the device is a party to, as of the last conntrack read; left out while unknown, as upload_bps.
    DhcpLease:
      type: object
      required: [ip, mac, network, expires_at]
      properties:
        ip: {$ref: '#/components/schemas/Ipv4'}
        mac: {$ref: '#/components/schemas/MacAddress'}
        hostname: {type: string}
        network: {$ref: '#/components/schemas/Uuid'}
        device: {$ref: '#/components/schemas/Uuid'}
        expires_at: {type: string, format: date-time}
        state:
          type: string
          enum: [active, expired, declined]
    Flow:
      type: object
      required: [id, protocol, src, dst]
      properties:
        id: {type: string}
        device: {$ref: '#/components/schemas/Uuid'}
        network: {$ref: '#/components/schemas/Uuid'}
        protocol:
          type: string
          enum: [tcp, udp, icmp, other]
        src: {$ref: '#/components/schemas/Ipv4'}
        sport: {type: integer}
        dst: {$ref: '#/components/schemas/Ipv4'}
        dport: {type: integer}
        dst_hostname:
          type: string
          description: |
            A name the DNS proxy returned for `dst` to this device: one that a hostname selector of a rule or a fault
            selects (the DNS-derived address sets hold them) or that appears in the proxy's query log (the name asked
            and the CNAME targets of the answer; the last 20000 queries are kept).
        nat_src: {$ref: '#/components/schemas/Ipv4'}
        forwarded:
          type: boolean
          description: |
            The connection came in through a port forward (M35a, listed since M26): `src` is the peer behind the entry
            side, `dst` the entry side's address and `dport` the external port, and `device` and `network` are those of
            the forward's target. `GET /explain` with `src`, `dst`, `protocol` and `port` of the flow explains it.
        state:
          type: string
          description: TCP state from conntrack (e.g. `ESTABLISHED`), or `ASSURED`/`UNREPLIED`.
        service:
          type: string
          enum: [dns_proxy, tls_responder, tls_proxy]
          description: Set when the flow is redirected into the service namespace.
        started_at: {type: string, format: date-time}
        upload:
          type: object
          properties:
            packets: {type: integer, format: int64}
            bytes: {type: integer, format: int64}
        download:
          type: object
          properties:
            packets: {type: integer, format: int64}
            bytes: {type: integer, format: int64}
    GroupView:
      type: object
      required: [id, config]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        config: {$ref: '#/components/schemas/Group'}
    AccessRuleView:
      type: object
      required: [id, position, config]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        position:
          type: integer
          description: 0-based position in `access_rule_order`.
        config: {$ref: '#/components/schemas/AccessRule'}
        state:
          allOf: [{$ref: '#/components/schemas/EffectState'}]
          description: '`effective` for a rule that is in the packet path, `disabled` for one with `enabled: false` and for one the kernel does not run (a change the apply loop has not verified yet).'
        counters:
          allOf: [{$ref: '#/components/schemas/Counter'}]
          description: Packets and bytes of the **new connections** the rule decided (established traffic is accepted before the rules). Monotonic across applies; `epoch` changes on a restart.
    FaultView:
      type: object
      required: [id, config, state]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        config: {$ref: '#/components/schemas/ConfigFault'}
        state: {$ref: '#/components/schemas/EffectState'}
        overridden_by:
          type: array
          description: For an `overridden` or `partially_overridden` fault, the faults that beat it (the winners over the devices of its scope at a destination and port it selects).
          items: {$ref: '#/components/schemas/FaultRef'}
        counters: {$ref: '#/components/schemas/Counter'}
        queues:
          type: array
          items: {$ref: '#/components/schemas/QueueStats'}
    FaultRef:
      type: object
      description: A fault or profile part as a candidate in precedence resolution.
      required: [family, layer, id]
      properties:
        family: {$ref: '#/components/schemas/FaultFamily'}
        layer:
          type: string
          enum: [overlay, config]
        id:
          allOf: [{$ref: '#/components/schemas/Uuid'}]
          description: Overlay id or configured fault id.
        name: {type: string}
        profile:
          type: object
          description: Set when the candidate is a part of an activated profile.
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            name: {type: string}
        level:
          type: integer
          minimum: 1
          maximum: 10
          description: Specificity level of plan §2.4 (absent for tunnel faults).
        since:
          type: string
          format: date-time
          description: '`created_at` (configuration) or `updated_at` (overlay).'
        summary:
          type: string
          example: 'upload 200 ms ± 50 ms, download 200 ms ± 50 ms'
        reason:
          type: string
          description: For overridden candidates - why they lost (e.g. `overlay layer wins (D24)`, `level 3 beats level 6`, `newer at same level`).
    ProfileView:
      type: object
      required: [id, builtin, available, config]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        builtin:
          type: boolean
          description: Built-in profiles have fixed UUIDs and reserved names (`normal`, `lte`, `bad-lte`, `satellite`, `congested-wifi`, `offline`, `intermittent`, `dns-broken`, `tls-broken`).
        available:
          type: boolean
          description: |
            False while a part of the profile is not in this build. Every part is available since M22 (the `dns` family
            since M20, the certificate and handshake cases of the `tls` family, `tls-broken` among them, since M21, and the
            case `intercept` since M22), so this is true for every profile today; the field stays for a part a later
            milestone adds. A profile with a part that is not in the build can be defined and shown, but activating it
            is refused with `unsupported_feature`. So is applying a revision that gives a profile
            such a part while an overlay activates it (the profile and the milestone are named; remove
            the activation first, `force` does not lift it), so that no activation runs half a profile.
            Decided by the maintainer on 2026-10-11.
        unavailable_reason:
          type: string
          description: Set when `available` is false - the part and the milestone that brings it.
          example: 'the <part> part arrives with milestone <Mnn>'
        config: {$ref: '#/components/schemas/Profile'}
        activations:
          type: array
          description: |
            The overlays that activate this profile now (active revision only). An activation
            follows the definition: a new revision that changes the profile changes what the
            activation produces.
          items: {$ref: '#/components/schemas/ProfileActivation'}
    ProfileActivation:
      type: object
      required: [overlay, target, owner]
      properties:
        overlay: {$ref: '#/components/schemas/Uuid'}
        target: {$ref: '#/components/schemas/Scope'}
        owner: {$ref: '#/components/schemas/Owner'}
        expires_at:
          type: string
          format: date-time
        state:
          allOf: [{$ref: '#/components/schemas/EffectState'}]
          description: '`partially_overridden` when the parts of the profile win only a part of their traffic (e.g. a fault of the same scope beats its impairment part but its MTU part stays, or a device fault takes one device of the activation''s network).'
    ScenarioView:
      type: object
      required: [id, config]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        config: {$ref: '#/components/schemas/Scenario'}
    ProbeView:
      type: object
      required: [id, config, observed]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        config: {$ref: '#/components/schemas/Probe'}
        observed: {$ref: '#/components/schemas/DeviceObserved'}

    # ============================================================ explain
    Explanation:
      type: object
      required: [generation, source, access, faults]
      properties:
        generation: {type: integer, format: int64}
        source:
          type: object
          properties:
            ip: {$ref: '#/components/schemas/Ipv4'}
            device:
              type: object
              properties:
                id: {$ref: '#/components/schemas/Uuid'}
                name: {type: string}
            network:
              type: object
              properties:
                id: {$ref: '#/components/schemas/Uuid'}
                name: {type: string}
            groups:
              type: array
              items: {$ref: '#/components/schemas/Uuid'}
        destination:
          type: object
          properties:
            ip: {$ref: '#/components/schemas/Ipv4'}
            hostname: {type: string}
            resolved:
              type: array
              description: For a hostname - addresses in the device's DNS-derived set.
              items: {$ref: '#/components/schemas/Ipv4'}
        access:
          type: object
          required: [verdict, layer]
          properties:
            verdict: {$ref: '#/components/schemas/AccessAction'}
            layer:
              type: string
              enum: [gateway_protection, overlay_rule, config_rule, access_matrix, port_forward]
              description: '`port_forward` - a forwarded connection that no access rule decided is accepted by the forward itself (M35a).'
            rule:
              allOf: [{$ref: '#/components/schemas/Uuid'}]
              description: The overlay or configured rule that decided; absent for `gateway_protection`, `access_matrix` and `port_forward`.
            reason:
              type: string
              description: Which entry or default decided, in words.
        forward:
          type: object
          description: |
            Set when the traffic is a forwarded connection (M35a): `src` is a peer behind the entry side, `dst`
            the entry side's address and `port` an external port of an enabled forward. The access verdict is
            then decided with the forward's target as responder (see `AccessRuleBody`), and `faults` is empty:
            faults do not apply to forwarded connections (M35b), which `note` says.
          required: [id, entry, target_port, note]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            name: {type: string}
            entry: {$ref: '#/components/schemas/PortForwardEntry'}
            target_ip:
              allOf: [{$ref: '#/components/schemas/Ipv4'}]
              description: Absent while the forward is inactive (its target device has no address).
            target_port: {type: integer}
            device:
              type: object
              properties:
                id: {$ref: '#/components/schemas/Uuid'}
                name: {type: string}
            status: {$ref: '#/components/schemas/PortForwardStatus'}
            note:
              type: string
              example: faults do not apply to forwarded connections (M35b)
        faults:
          type: array
          description: |
            One entry per family (families without candidates are omitted). The faults are resolved for the
            traffic whatever the access verdict is: they take effect only when the verdict is `allow`, because
            access rules are evaluated first and a refused packet reaches no fault (plan §2.4). One exception:
            the black hole of an MTU fault (`mode: blackhole`) drops its too-long packets before the access
            rules run, so a too-long packet that a `reject` or `reset` rule would refuse is dropped silently
            and counted by the MTU fault, not by the rule (a `drop` rule drops it either way). Decided by the
            maintainer on 2026-10-11. The families `dns` and `dhcp` are resolved for every destination: a DHCP
            action overlay whose scope covers the device and a DNS fault without names are winners for any
            address asked, although they act on the device's name resolution and lease, not on a connection to
            that address; a client that draws what acts on a connection takes `impairment`, `mtu`, `tls` and
            `tunnel`.
          items:
            type: object
            required: [family]
            properties:
              family: {$ref: '#/components/schemas/FaultFamily'}
              tunnel:
                type: string
                description: 'For the family `tunnel`: the tunnel the traffic crosses, `client:<id>` or `link:<id>`. Traffic that crosses two tunnels (from a client network into a link) has one entry per tunnel.'
              winner: {$ref: '#/components/schemas/FaultRef'}
              overridden:
                type: array
                items: {$ref: '#/components/schemas/FaultRef'}
        service:
          type: string
          enum: [none, dns_proxy, tls_responder, tls_proxy]
          description: Whether the connection is redirected into the service namespace.
        kernel:
          type: object
          description: Classification as compiled (plan §3.3).
          properties:
            fault_id: {type: integer, minimum: 1, maximum: 4095}
            mark_upload: {type: string, example: '0x000000a0'}
            mark_download: {type: string, example: '0x000100a0'}
            pmtu_table:
              type: integer
              minimum: 1
              maximum: 7
              description: The index of the PMTU mirror table (bits 17-19 of the mark, plan §3.3) the traffic is routed through, when the winner of the `mtu` family is in `icmp` mode. Absent for `blackhole` and `mss_clamp` and when no `mtu` fault applies. `fault_id` and the marks are absent when only an `mtu` fault applies.
            tunnels:
              type: array
              description: The tunnel faults in the packet path of the traffic, as compiled (plan §2.2.1); a tunnel fault of a peer with no known address is not among them.
              items:
                type: object
                required: [tunnel, fault_id, endpoint]
                properties:
                  tunnel: {type: string, description: '`client:<id>` or `link:<id>`.'}
                  fault_id: {type: integer, minimum: 1, maximum: 4095}
                  endpoint: {type: string, description: 'The address and port the peer''s encrypted UDP comes from and goes to; the packets are selected by it.', example: '198.51.100.2:51820'}
                  mark_download: {type: string, description: 'The mark of the packets towards the peer (the output hook).', example: '0x000100a0'}
        route:
          type: object
          description: The route the kernel takes for the packet (`ip route get`, through the policy rules); absent for a hostname destination or a source without an address.
          properties:
            table: {type: integer}
            gateway: {$ref: '#/components/schemas/Ipv4'}
            interface: {type: string}
            unreachable:
              type: boolean
              description: The kernel has no route (or a prohibit or blackhole route) for the packet.
            error: {type: string, description: 'The kernel''s message when `unreachable`.'}

    # ============================================================ runs
    RunStatus:
      type: string
      enum: [queued, running, passed, failed, error, aborted]
    RunOptions:
      type: object
      properties:
        parameters:
          type: object
          description: |
            Overrides of scenario fields by dotted path, e.g. `{"target.device": "esp32-42"}` (`chaosctl run --set`).
            A path is a chain of field names; a segment into a list is the position (`steps.1.at`) or the `id` of the
            step (`steps.slow.fault.latency`). A value is a string, except that `true`, `false` and whole numbers are
            read as such and a value that starts with `[` or `{` as JSON. Setting a member of a `target` (the
            scenario's or a step's) replaces the whole target (`target.network` after `target.device` leaves only the
            network). The scenario is changed before it is validated, so an inline scenario may leave out what the
            parameters give (`target`); a path that names no field, or an element that is not there, is
            `validation_failed` at `/parameters/<path>`. The run stores the scenario as executed (`snapshot`).
          additionalProperties: {type: string}
        lease:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          description: |
            The client must renew the run (`POST /runs/{id}/renew`) within this interval, else the server aborts it
            (`reason: lease expired`) and removes its overlays. At least 1 s. It starts when the run is created, so a
            run that waits in `queued` and whose client has gone never starts.
    RunRequest:
      description: Exactly one of `scenario` and `inline`.
      allOf:
        - $ref: '#/components/schemas/RunOptions'
        - type: object
          properties:
            scenario:
              allOf: [{$ref: '#/components/schemas/Ref'}]
              description: Stored scenario of the active revision.
            inline:
              allOf: [{$ref: '#/components/schemas/Scenario'}]
              description: Scenario sent with the request (stored with the run only).
    Run:
      type: object
      required: [id, scenario, revision, target, owner, status, created_at]
      properties:
        id: {$ref: '#/components/schemas/Uuid'}
        scenario:
          type: object
          required: [name, inline]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            name: {type: string}
            inline: {type: boolean}
        snapshot:
          allOf: [{$ref: '#/components/schemas/Scenario'}]
          description: The scenario as executed (after parameters), taken at start.
        revision:
          type: integer
          format: int64
          description: Active revision when the run started.
        target: {$ref: '#/components/schemas/Scope'}
        owner: {$ref: '#/components/schemas/Actor'}
        status: {$ref: '#/components/schemas/RunStatus'}
        reason:
          type: string
          description: For `error` and `aborted` (e.g. `precondition target_online failed`, `lease expired`, `service restart`).
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
        lease_expires_at: {type: string, format: date-time}
        steps:
          type: array
          items: {$ref: '#/components/schemas/RunStep'}
        checks:
          type: array
          items: {$ref: '#/components/schemas/CheckResult'}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/RunWarning'}
        artifacts:
          type: array
          items: {$ref: '#/components/schemas/Artifact'}
    RunStep:
      type: object
      required: [id, status]
      properties:
        id: {$ref: '#/components/schemas/StepId'}
        type:
          type: string
          enum: [profile, fault, rule, dns, tls, dhcp, wireguard, capture, wait, remove, restore]
        status:
          type: string
          enum: [pending, applied, skipped, error]
        scheduled_offset: {$ref: '#/components/schemas/Duration'}
        applied_at:
          type: string
          format: date-time
          description: Executor commit time stamp.
        offset_ms:
          type: integer
          description: Actual offset from run start in milliseconds (monotonic clock), when the engine answered that the step's change is applied and verified. For a `wait` step, when its condition held.
        start_offset_ms:
          type: integer
          minimum: 0
          description: |
            Offset from run start in milliseconds (monotonic clock) at which the timeline handed the step's change to the
            engine. Against `scheduled_offset` (plus the time the `wait` steps before it shifted the timeline) it is the
            accuracy of the timeline itself (a step is handed over late only when an earlier step is still being applied,
            or the counters that are read before it takes an overlay away took their time; more than 100 ms makes the
            run warning `step_late`); `offset_ms` minus it is how long the apply took, which depends on
            the machine and on the size of the configuration (the queue wait is part of it). The change takes effect in
            the kernel at some moment between the two. Absent for a step that changes nothing in the kernel (`wait`,
            `capture`) and for one that was not applied.
        queue_wait_ms:
          type: integer
          minimum: 0
          description: |
            How long the step's change waited before the executor began to apply it, in milliseconds: the time behind the
            apply in flight (a revision apply, or the change of an earlier step or of another writer) and in the executor's
            queue (plan §3.11). A step that waited for more than 100 ms makes the run warning `step_late` (as does a step that was
            handed over more than 100 ms late, see `start_offset_ms`; the step has one warning for both). Absent for a
            step that changes nothing in the kernel (`wait`) and for one that was not applied.
        generation: {type: integer, format: int64}
        overlay:
          allOf: [{$ref: '#/components/schemas/Uuid'}]
          description: The overlay the step created or replaced, or removed (`remove`).
        error:
          type: string
          description: Why the step is `error` or `skipped`.
    CheckResult:
      type: object
      required: [index, name, type, status]
      properties:
        index: {type: integer}
        name: {type: string}
        type:
          type: string
          enum: [reconnected, no_connection, traffic_seen, traffic_not_seen, dns_query_seen, tls_rejected, tls_accepted]
        status:
          type: string
          description: '`pending` until decided (and for good when the run ended first); `error` when the check could not be decided, e.g. the connections could not be read when its window closed.'
          enum: [pending, passed, failed, error]
        window_start: {type: string, format: date-time, description: 'Wall time at which the window opened (see `Check`). Absent while the window has not opened.'}
        window_end: {type: string, format: date-time, description: 'Wall time at which the window closes (see `Check`). For a window of `within` it is set when the window opens, as the planned end; for a window with `until` it is set when that step reaches its moment. Absent until then.'}
        message: {type: string}
        evidence:
          type: array
          description: Observations that decided the result (flows, queries, handshakes).
          items:
            type: object
            additionalProperties: true
    RunWarning:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            `step_late`: the step was handed to the executor more than 100 ms after its scheduled time (plus the shift of
            the `wait` steps before it), or its change waited more than 100 ms for the executor (`queue_wait_ms`); one
            warning for the step, and its message names the cause (the step before it was still being applied, the counters
            read before the change took their time, the executor was busy with other changes).
          enum: [zero_hit, step_late, capture_missing]
        step: {$ref: '#/components/schemas/StepId'}
        overlay: {$ref: '#/components/schemas/Uuid'}
        message: {type: string}
    Artifact:
      type: object
      required: [kind, url]
      properties:
        kind:
          type: string
          enum: [report_json, report_xml, events, capture, keylog]
        url: {type: string}
        size_bytes: {type: integer, format: int64}
        capture: {$ref: '#/components/schemas/Uuid'}
    RunReport:
      allOf:
        - $ref: '#/components/schemas/Run'
        - type: object
          properties:
            counters:
              type: array
              description: Final counters of every overlay the run created.
              items:
                type: object
                properties:
                  step: {$ref: '#/components/schemas/StepId'}
                  overlay: {$ref: '#/components/schemas/Uuid'}
                  counters: {$ref: '#/components/schemas/Counter'}

    # ============================================================ captures
    CaptureScope:
      type: object
      description: 'Exactly one of: a network (incl. WireGuard interfaces, raw IP), a device, a selector, or the uplink (not attributable to devices after NAT).'
      minProperties: 1
      maxProperties: 1
      properties:
        network: {$ref: '#/components/schemas/Ref'}
        device: {$ref: '#/components/schemas/Ref'}
        selector:
          allOf:
            - $ref: '#/components/schemas/TrafficMatch'
            - type: object
              required: [source]
              properties:
                source: {$ref: '#/components/schemas/Scope'}
        uplink:
          type: boolean
          enum: [true]
    CaptureRequest:
      type: object
      required: [scope]
      description: |
        `ring_buffer` keeps the newest `files` files of about `file_size` bytes (at least 64 KiB) and takes no
        `max_size`. Without a ring buffer, `max_size` bounds the files, headers included (1 GiB when absent).
      properties:
        name: {type: string, maxLength: 64}
        scope: {$ref: '#/components/schemas/CaptureScope'}
        format:
          type: string
          enum: [pcapng, pcap]
          default: pcapng
        snaplen:
          type: integer
          minimum: 64
          maximum: 262144
          default: 262144
        duration: {$ref: '#/components/schemas/Duration'}
        max_size: {$ref: '#/components/schemas/ByteSize'}
        ring_buffer:
          type: object
          required: [files, file_size]
          properties:
            files: {type: integer, minimum: 2, maximum: 100}
            file_size: {$ref: '#/components/schemas/ByteSize'}
    Capture:
      allOf:
        - $ref: '#/components/schemas/CaptureRequest'
        - type: object
          required: [id, status, started_at]
          properties:
            id: {$ref: '#/components/schemas/Uuid'}
            status:
              type: string
              enum: [running, stopped, failed]
            stop_reason:
              type: string
              enum: [user, duration, size, disk_low, run_end, error]
            started_at: {type: string, format: date-time}
            stopped_at: {type: string, format: date-time}
            size_bytes: {type: integer, format: int64}
            packets: {type: integer, format: int64}
            run: {$ref: '#/components/schemas/Uuid'}
            message:
              type: string
              description: Why the capture ended early (`disk_low`, `size` by the quota, `error`), or what failed.
            dropped:
              type: integer
              format: int64
              description: Packets the kernel dropped because the reader was too slow; a capture without loss has none.
            interfaces:
              type: array
              description: The interfaces the capture reads, with the link type of each and the filter in words.
              items:
                type: object
                required: [name, link_type]
                properties:
                  name: {type: string}
                  link_type:
                    type: string
                    enum: [ethernet, raw]
                  filter: {type: string}
            keylog:
              type: boolean
              description: A TLS key log is attached.
            sensitive:
              type: boolean
              description: Contains a key log or decrypted traffic.

    CaptureStorage:
      type: object
      required: [quota_bytes, used_bytes, min_free_percent, disk_low, running, max_running]
      properties:
        quota_bytes: {type: integer, format: int64, description: The total size all captures may take.}
        used_bytes: {type: integer, format: int64, description: 'The size of all captures, a running one as of the last second.'}
        volume_total_bytes: {type: integer, format: int64, description: Absent when the gateway cannot read the volume.}
        volume_free_bytes: {type: integer, format: int64, description: Absent when the gateway cannot read the volume.}
        free_percent:
          type: number
          description: The free space of the volume in percent; absent when the gateway cannot read the volume.
        min_free_percent: {type: number, description: Below this free space new captures are refused and running ones stop (`disk_low`).}
        disk_low: {type: boolean, description: The volume has less free space than the limit.}
        running: {type: integer, description: Captures that run now.}
        max_running: {type: integer, description: The most captures that run at once.}

    # ============================================================ diagnostics and probes
    DiagnosticRequest:
      type: object
      required: [type, host]
      properties:
        type:
          type: string
          enum: [ping, tcp, udp, dns, http, tls, path]
          description: |
            `ping` sends ICMP echoes; `tcp` connects to `port`; `udp` sends one datagram (`payload`) to `port` and
            waits for a reply, an ICMP port unreachable says the port is closed; `dns` asks for an A record; `http`
            makes one GET request and does not follow redirects; `tls` makes a handshake and reports what the server
            presented; `path` runs DNS → route → TCP → TLS and reports each step, up to the first one that fails.
        from:
          type: object
          description: Default - the gateway itself (not subject to device faults). `probe` runs the diagnostic from the probe (a probe of the active revision, by id or name); its traffic meets the faults that target it.
          minProperties: 1
          maxProperties: 1
          properties:
            gateway:
              type: boolean
              enum: [true]
            probe: {$ref: '#/components/schemas/Ref'}
        host:
          type: string
          maxLength: 253
          description: Hostname or IPv4 address (not a URL, no port); for `http` the URL host is used if `url` is set. For `dns` with `dns_name` it is the server to ask.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Required for `tcp`, `udp` and `path`. Defaults - `dns` 53, `tls` 443. Not used by `ping`; `http` takes it from the URL (or, without `url`, builds `http://host:port/`).
        count:
          type: integer
          minimum: 1
          maximum: 100
          default: 5
          description: Ping only - the echoes sent, 200 ms apart.
        timeout:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          default: 5s
          description: How long to wait for a connection, a reply or a handshake, 60 s at most. For `ping` the wait for the last reply; for `path` the limit of each step.
        dns_name:
          allOf: [{$ref: '#/components/schemas/Hostname'}]
          description: '`dns` - the name to resolve; `host` is then the server to ask. Without it `host` is the name and the server is the gateway DNS proxy. No wildcard.'
        url:
          type: string
          maxLength: 2048
          description: '`http` - full http or https URL.'
        sni:
          type: string
          maxLength: 253
          description: '`tls` and `path` - SNI (default `host`; none for an address).'
        payload:
          type: string
          maxLength: 1024
          description: '`udp` - the text sent as the datagram (default an empty datagram, which many services ignore).'
        tls:
          type: boolean
          default: true
          description: '`path` - false leaves out the TLS step, for a plain TCP service.'
    DiagnosticResult:
      type: object
      required: [type, ok, started_at, duration_ms]
      properties:
        type: {type: string}
        from: {type: string, description: '`gateway`, or `probe:` and the probe''s namespace.'}
        ok:
          type: boolean
          description: |
            `ping` - at least one reply; `tcp` - connected; `udp` - a reply came back; `dns` - NOERROR with an answer;
            `http` - a response with a status below 400; `tls` - a handshake whose certificate verifies; `path` - every step.
        started_at: {type: string, format: date-time}
        duration_ms: {type: number}
        address:
          type: string
          description: The IPv4 address the diagnostic ran against, when `host` was a name that resolved.
        error:
          type: string
          description: Why `ok` is false, in a sentence.
        ping:
          type: object
          properties:
            sent: {type: integer}
            received: {type: integer}
            loss_percent: {type: number}
            rtt_min_ms: {type: number}
            rtt_avg_ms: {type: number}
            rtt_max_ms: {type: number}
            rtt_mdev_ms: {type: number}
        connect:
          type: object
          description: '`tcp` and `udp`.'
          properties:
            reachable: {type: boolean}
            rtt_ms: {type: number}
            detail:
              type: string
              example: connection refused
        dns:
          type: object
          properties:
            name: {type: string, description: The name asked for.}
            server: {type: string, description: 'The server that answered or was asked, `address:port`.'}
            rcode:
              type: string
              example: NOERROR
            answers:
              type: array
              items: {type: string}
            rtt_ms: {type: number}
        http:
          type: object
          properties:
            status: {type: integer}
            rtt_ms: {type: number}
            headers:
              type: object
              additionalProperties: {type: string}
        tls:
          type: object
          properties:
            version: {type: string}
            cipher: {type: string}
            alpn: {type: string}
            verified: {type: boolean}
            verify_error:
              type: string
              example: certificate has expired
            certificates:
              type: array
              items:
                type: object
                properties:
                  subject: {type: string}
                  issuer: {type: string}
                  not_before: {type: string, format: date-time}
                  not_after: {type: string, format: date-time}
                  dns_names:
                    type: array
                    items: {type: string}
        path:
          type: array
          items:
            type: object
            required: [step, ok]
            properties:
              step:
                type: string
                enum: [dns, route, tcp, tls]
              ok: {type: boolean}
              detail: {type: string}
    CalibrationRequest:
      type: object
      description: Activates `profile` or `fault` on the probe for the measurement (an overlay owned by the caller, removed afterwards), or measures the probe's current faults if neither is given. Not both.
      required: [host]
      properties:
        profile: {$ref: '#/components/schemas/Ref'}
        fault: {$ref: '#/components/schemas/ImpairmentParams'}
        host:
          type: string
          description: Echo target, an IPv4 address (UDP and TCP echo on `port`, e.g. the testbed server).
        port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 7
        duration:
          allOf: [{$ref: '#/components/schemas/Duration'}]
          description: 5 s to 5 min. The loss check is a statistic from 2000 datagrams, one every 10 ms, so it needs at least 20 s.
          default: 30s
    CalibrationResult:
      type: object
      required: [within_tolerance]
      properties:
        within_tolerance:
          type: boolean
          description: Every check that applies to the parameters passed.
        expected: {$ref: '#/components/schemas/CalibrationExpected'}
        measured: {$ref: '#/components/schemas/CalibrationMeasured'}
        samples: {$ref: '#/components/schemas/CalibrationSamples'}
        checks:
          type: array
          description: One check for each of delay, jitter, loss and rate that the parameters ask for.
          items: {$ref: '#/components/schemas/CalibrationCheck'}
        detail:
          type: string
          description: The checks in a sentence each, and what the parameters ask for that the calibration does not measure (reordering, duplication, corruption).
    CalibrationExpected:
      type: object
      description: What the parameters should make of the probe's round trip to the echo server.
      properties:
        rtt_ms: {type: number, description: 'The unimpaired round trip plus the delay of both directions.'}
        loss_percent: {type: number, description: 'The chance that a round trip is lost; absent when the parameters flap.'}
        rate_bps: {type: integer, format: int64, description: 'The smaller limit of the two directions.'}
    CalibrationMeasured:
      type: object
      properties:
        baseline_rtt_ms: {type: number, description: 'The median round trip from the gateway to the echo server, which no fault of a device touches.'}
        rtt_median_ms: {type: number}
        rtt_p95_ms: {type: number}
        loss_percent: {type: number}
        loss_ci99:
          type: array
          description: 99 % confidence interval of the loss rate in percent (Wilson score).
          items: {type: number}
        rate_bps: {type: integer, format: int64, description: 'Throughput of the TCP echo; present when the parameters have a rate limit.'}
    CalibrationSamples:
      type: object
      required: [sent, received]
      properties:
        sent: {type: integer, description: 'Datagrams the probe sent.'}
        received: {type: integer, description: 'Answers that came back.'}
    CalibrationCheck:
      type: object
      required: [name, ok, detail]
      properties:
        name:
          type: string
          enum: [latency, jitter, loss, rate]
        ok: {type: boolean}
        detail: {type: string}

    # ============================================================ events and audit
    EventType:
      type: string
      description: |
        Every type the event bus can carry. `observed_changed` fires when the observed state
        (devices, leases, flows) changes without a configuration change behind it.
        `service_restarted` is declared for a managed service (Kea, BIRD, the DNS proxy) restart,
        produced from M28 on. `dhcp_leases_deleted` says that the DHCP action `delete_lease` deleted leases
        (`data`: `overlay`, `network`, for a device's action `device`, and `count`). `events_lost` is synthetic: the server sends it instead of a replay
        when a client's `Last-Event-ID` is from an earlier boot or older than the replay buffer, so
        the client knows to treat its own state as possibly stale (`data.reason`: `restart` or
        `expired`).
      enum:
        - applied
        - apply_failed
        - confirm_pending
        - revision_created
        - revision_applied
        - revision_confirmed
        - revision_rolled_back
        - overlay_created
        - overlay_updated
        - overlay_removed
        - overlay_expired
        - overlay_orphaned
        - run_queued
        - run_started
        - run_step
        - run_check
        - run_finished
        - device_discovered
        - device_online
        - device_offline
        - device_identity_changed
        - observed_changed
        - dhcp_lease
        - dhcp_leases_deleted
        - dns_fault_triggered
        - dns_set_epoch
        - tls_handshake
        - http_fault_triggered
        - wireguard_peer_online
        - wireguard_peer_offline
        - routing_session_changed
        - routing_routes_changed
        - uplink_changed
        - network_degraded
        - network_restored
        - capture_started
        - capture_stopped
        - safe_mode
        - counter_epoch
        - disk_low
        - service_restarted
        - events_lost
    Event:
      type: object
      required: [id, type, time]
      properties:
        id:
          type: string
          description: Monotonic within a boot; used as SSE `id`.
        type: {$ref: '#/components/schemas/EventType'}
        time: {type: string, format: date-time}
        generation:
          type: integer
          format: int64
          description: Set for events that change the effective state (`applied`, overlay events, identity changes).
        actor: {$ref: '#/components/schemas/Actor'}
        subject:
          type: object
          properties:
            kind: {type: string}
            id: {type: string}
            name: {type: string}
        run:
          allOf: [{$ref: '#/components/schemas/Uuid'}]
          description: Set for events caused by or relevant to a run.
        message:
          type: string
          description: Human-readable summary (activity log).
        data:
          type: object
          description: Type-specific details.
          additionalProperties: true
    AuditEntry:
      type: object
      required: [id, time, actor, via, action]
      properties:
        id: {type: string}
        time: {type: string, format: date-time}
        actor: {$ref: '#/components/schemas/Actor'}
        via:
          type: string
          enum: [ui, api, cli, system]
        action:
          type: string
          example: revision.apply
        object:
          type: object
          properties:
            kind: {type: string}
            id: {type: string}
            name: {type: string}
        revision: {type: integer, format: int64}
        detail: {type: string}

    # ============================================================ pages
    RevisionPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Revision'}
        next_cursor: {type: string}
    NetworkPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/NetworkView'}
        next_cursor: {type: string}
    DevicePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/DeviceView'}
        next_cursor: {type: string}
    FlowPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Flow'}
        next_cursor: {type: string}
    GroupPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/GroupView'}
        next_cursor: {type: string}
    PortForwardPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PortForwardView'}
        next_cursor: {type: string}
    AccessRulePage:
      type: object
      required: [items]
      properties:
        system_rules:
          type: array
          description: |
            Rules that stand in front of `items` and cannot be overridden: the anti-lockout rule
            (`system:anti_lockout`). The closure of the UI/API port to every other source stands in front of
            `items` too, but is not listed (see `AccessRuleBody`).
          items: {$ref: '#/components/schemas/SystemAccessRule'}
        items:
          type: array
          items: {$ref: '#/components/schemas/AccessRuleView'}
        next_cursor: {type: string}
    FaultPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/FaultView'}
        next_cursor: {type: string}
    OverlayPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Overlay'}
        next_cursor: {type: string}
    RunPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Run'}
        next_cursor: {type: string}
    CapturePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Capture'}
        next_cursor: {type: string}
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AuditEntry'}
        next_cursor: {type: string}
    HostInterfacePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/HostInterface'}
        next_cursor: {type: string}
    ApiTokenPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ApiToken'}
        next_cursor: {type: string}
    DhcpLeasePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/DhcpLease'}
        next_cursor: {type: string}
    WireGuardClientViewPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/WireGuardClientView'}
        next_cursor: {type: string}
    RouteEntryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/RouteEntry'}
        next_cursor: {type: string}
    ProfileViewPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ProfileView'}
        next_cursor: {type: string}
    ScenarioViewPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ScenarioView'}
        next_cursor: {type: string}
    ProbeViewPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ProbeView'}
        next_cursor: {type: string}
    # ============================================================ DNS log, certificate, internal
    DnsQueryLogEntry:
      type: object
      required: [time, client, name, type, rcode]
      properties:
        time: {type: string, format: date-time}
        client: {$ref: '#/components/schemas/Ipv4'}
        device:
          allOf: [{$ref: '#/components/schemas/Uuid'}]
          description: Filled in by the API from the observed state.
        protocol:
          type: string
          enum: [udp, tcp]
        name: {type: string}
        type:
          type: string
          example: A
        rcode:
          type: string
          example: NOERROR
          description: The response code of the answer; `TIMEOUT` for a query that a `timeout` fault left without an answer (M20).
        answers:
          type: array
          items: {type: string}
        duration_ms: {type: number}
        cached: {type: boolean}
        fault:
          allOf: [{$ref: '#/components/schemas/Uuid'}]
          description: DNS fault overlay that changed the answer.
        stripped_aaaa: {type: boolean}
    DnsQueryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/DnsQueryLogEntry'}
        next_cursor: {type: string}
    InterceptFlowReport:
      type: object
      required: [time, client, original_dst, protocol]
      properties:
        time: {type: string, format: date-time, description: 'When the request arrived at the proxy (the connection was opened, for a stream).'}
        client: {$ref: '#/components/schemas/Ipv4'}
        original_dst:
          type: string
          description: '`ip:port` the device meant.'
        overlay: {$ref: '#/components/schemas/Uuid'}
        protocol:
          type: string
          enum: [http, websocket, tcp]
          description: '`tcp` is a connection that is no HTTP: its bytes are counted, not read.'
        method: {type: string, maxLength: 16}
        host: {type: string, maxLength: 253}
        path: {type: string, maxLength: 1024, description: 'The request target, cut at 1024 characters.'}
        status: {type: integer, description: 'The status code the device got, absent when it got none.'}
        request_bytes: {type: integer, format: int64}
        response_bytes: {type: integer, format: int64}
        messages: {type: integer, format: int64, description: 'WebSocket messages, both directions.'}
        duration_ms: {type: number}
        actions:
          type: array
          description: The actions of the rules that acted on the exchange, in the order they acted.
          items: {type: string, enum: [block, status, delay, throttle, abort, modify]}
        error: {type: string, maxLength: 512, description: 'Why the exchange ended without a response (the server did not answer, the device went away).'}
    InterceptFlow:
      allOf:
        - $ref: '#/components/schemas/InterceptFlowReport'
        - type: object
          properties:
            device:
              allOf: [{$ref: '#/components/schemas/Uuid'}]
              description: Filled in by the API from the observed state.
    InterceptFlowPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/InterceptFlow'}
        next_cursor: {type: string}
    InterceptKeylogBatch:
      type: object
      required: [client, lines]
      properties:
        client: {$ref: '#/components/schemas/Ipv4'}
        overlay: {$ref: '#/components/schemas/Uuid'}
        lines:
          type: array
          maxItems: 1000
          items: {type: string, maxLength: 512}
    CertificateInfo:
      type: object
      properties:
        subject: {type: string}
        issuer: {type: string}
        not_before: {type: string, format: date-time}
        not_after: {type: string, format: date-time}
        dns_names:
          type: array
          items: {type: string}
        ip_addresses:
          type: array
          items: {type: string}
        self_signed: {type: boolean}
        fingerprint_sha256: {type: string}
    CertificateUpload:
      type: object
      required: [certificate, private_key]
      properties:
        certificate:
          type: string
          description: PEM, leaf first, then intermediates.
        private_key:
          type: string
          format: password
          description: PEM (PKCS#8, RSA or EC). Stored in the secrets directory, never returned.
    KeaLeaseEvent:
      type: object
      required: [event, ip, mac, subnet_id]
      properties:
        event:
          type: string
          enum: [select, renew, rebind, release, expire, decline, recover]
          description: Kea `run_script` hook point (`lease4_select`, …) without the prefix.
        ip: {$ref: '#/components/schemas/Ipv4'}
        mac: {$ref: '#/components/schemas/MacAddress'}
        hostname: {type: string}
        client_id: {type: string}
        subnet_id:
          type: integer
          description: Kea subnet id; the API maps it to the network.
        valid_lifetime:
          type: integer
          description: Seconds.
    DnsServiceConfig:
      type: object
      required: [generation, upstream, networks, faults]
      properties:
        generation: {type: integer, format: int64}
        upstream:
          type: array
          items: {$ref: '#/components/schemas/Ipv4'}
        strip_aaaa:
          type: boolean
          default: true
        networks:
          type: array
          items:
            type: object
            required: [network, gateway]
            properties:
              network: {$ref: '#/components/schemas/Uuid'}
              gateway:
                allOf: [{$ref: '#/components/schemas/Ipv4'}]
                description: The network's gateway address the clients query.
              clients:
                allOf: [{$ref: '#/components/schemas/Ipv4Cidr'}]
                description: Source range of the network's clients.
              static_entries:
                type: array
                items: {$ref: '#/components/schemas/DnsStaticEntry'}
        faults:
          type: array
          description: Resolved DNS faults (precedence already applied); the first entry whose `sources` and `names` match wins.
          items:
            allOf:
              - $ref: '#/components/schemas/DnsFault'
              - type: object
                required: [overlay, sources]
                properties:
                  overlay: {$ref: '#/components/schemas/Uuid'}
                  sources:
                    type: array
                    items: {$ref: '#/components/schemas/Ipv4OrCidr'}
        hostname_sets:
          type: array
          description: Names whose answers must be reported via `/internal/dns/resolutions` before answering.
          items:
            type: object
            required: [set, names]
            properties:
              set:
                type: string
                description: Opaque set id.
              names:
                type: array
                items: {$ref: '#/components/schemas/Hostname'}
              sources:
                type: array
                description: Only queries from these clients (empty - all).
                items: {$ref: '#/components/schemas/Ipv4OrCidr'}
    DnsResolution:
      type: object
      required: [set, client, name, addresses, ttl]
      properties:
        set: {type: string}
        client: {$ref: '#/components/schemas/Ipv4'}
        name:
          type: string
          description: Queried name (after following CNAMEs, the name of the matching hostname selector).
        addresses:
          type: array
          items: {$ref: '#/components/schemas/Ipv4'}
        ttl:
          type: integer
          description: Seconds, as in the answer; the API applies max(ttl, 10 min) (plan §2.6).
    TlsServiceConfig:
      type: object
      required: [generation, cases]
      properties:
        generation: {type: integer, format: int64}
        cases:
          type: array
          description: Resolved TLS cases; the service looks up a connection by client address and original destination.
          items:
            allOf:
              - $ref: '#/components/schemas/TlsCase'
              - type: object
                required: [overlay, sources, expected]
                properties:
                  overlay: {$ref: '#/components/schemas/Uuid'}
                  sources:
                    type: array
                    items: {$ref: '#/components/schemas/Ipv4OrCidr'}
                  expected:
                    type: string
                    enum: [reject, accept, any]
                    description: Expected device behavior, from the case and `trusts_test_ca` (plan §2.8).
    TlsResolveRequest:
      type: object
      required: [client, original_dst]
      properties:
        client: {$ref: '#/components/schemas/Ipv4'}
        original_dst:
          type: string
          description: '`ip:port` from `SO_ORIGINAL_DST`.'
          example: '203.0.113.10:8883'
        sni:
          type: string
          description: The server name of the ClientHello, absent without one.
    TlsResolveResponse:
      type: object
      required: [generation]
      properties:
        generation:
          type: integer
          format: int64
          description: |
            The generation of the configuration (`/internal/tls/config`) the decision belongs to. The responder resets the
            connections of an overlay that a configuration of a later generation no longer holds (plan §2.8: "reset on
            removal"), and leaves alone one whose decision is of the same or a later generation.
        overlay:
          allOf: [{$ref: '#/components/schemas/Uuid'}]
          description: The overlay that decides the connection (the activation, for the `tls` part of a profile); absent when no case does.
        case:
          allOf: [{$ref: '#/components/schemas/TlsCase'}]
          description: The deciding case as it was written; absent when no case decides the connection.
        expected:
          type: string
          enum: [reject, accept, any]
          description: What a correct device does with the case (plan §2.8); absent without a case.
        device:
          allOf: [{$ref: '#/components/schemas/Uuid'}]
          description: The device the client is, absent for an address no device owns.
        trusts_test_ca:
          type: boolean
          description: Whether the device's firmware trusts the test CA (`trusts_test_ca` of the device), false for an unknown device.
        name:
          type: string
          description: The name for the certificate when the ClientHello has no SNI (see the operation).
        passthrough:
          type: boolean
          description: |
            Without a `case`, and with the case `intercept`: whether the gateway would have forwarded the connection if it had not been selected, judged
            by the access rules and the access matrix on the original destination. The responder passes the connection through
            only when this is true and resets it otherwise: the answer of the gateway must not let a device reach a server that the
            matrix keeps it from.
    TlsHandshakeReport:
      type: object
      required: [time, client, original_dst, outcome]
      properties:
        time: {type: string, format: date-time}
        client: {$ref: '#/components/schemas/Ipv4'}
        original_dst:
          type: string
          description: '`ip:port` from `SO_ORIGINAL_DST`.'
        sni: {type: string}
        overlay: {$ref: '#/components/schemas/Uuid'}
        case: {type: string}
        outcome:
          type: string
          enum: [rejected, accepted, client_closed, timeout, reset_sent, close_sent, stalled, intercepted, proxy_unavailable, server_unreachable]
          description: |
            `rejected` - the client aborted (an alert, or closing the connection) after it was shown the certificate;
            `accepted` - the handshake completed, the client took the certificate (a security failure for a case that
            must be rejected); `client_closed` - the client went away before it was shown a certificate;
            `timeout` - the handshake did not finish in time; `reset_sent`, `close_sent` and `stalled` - the
            responder answered the ClientHello with a reset (`handshake_reset`), a FIN (`handshake_close`) or nothing
            (`handshake_stall`); `intercepted` - the responder handed the connection to the interception proxy (case
            `intercept`; this is the report that counts the connection for its overlay), `proxy_unavailable` - it could not
            (the proxy is not running or refused the connection) and reset the connection, `server_unreachable` - the proxy
            answered that it cannot reach the server the device meant, and the responder reset the connection. The proxy reports what the
            device did with its certificate as `accepted`, `rejected`, `client_closed` or `timeout`, with the case `intercept`;
            those reports are not counted again.
        alert:
          type: string
          example: bad_certificate
        tls_version: {type: string}
