  /revisions/{revisionId}/confirm:
    post:
      tags: [revisions]
      operationId: confirmRevision
      summary: Confirm a revision waiting for commit-confirm
      x-milestone: M5
      x-required-scope: full
      parameters:
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: Confirmed; it is now last-known-good
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Revision'}
        default: {$ref: '#/components/responses/Problem'}
  /revisions/{revisionId}/rollback:
    post:
      tags: [revisions]
      operationId: rollbackRevision
      summary: Roll back a revision waiting for commit-confirm now, without waiting for its deadline
      description: |
        Only for the revision that is `pending_confirm` (`409 not_a_candidate` otherwise, as for `confirmRevision`). It is the
        rollback the deadline would run: the previous revision is applied again and the overlays
        follow (see `applyRevision`); the event `revision_rolled_back` has `data.reason` `requested`
        and `data.restored`, the revision that is active again. Returns before the previous
        revision is verified again, like the rollback at the deadline. The audit log has one entry,
        `revision.rollback`, with the caller as its actor. When the revision is the setup's first
        one (nothing is committed before it), the setup is open again afterwards, as after its
        deadline: a new setup token is written to the log.
      x-milestone: M14
      x-required-scope: full
      parameters:
        - $ref: '#/components/parameters/RevisionId'
      responses:
        '200':
          description: Rolled back
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Revision'}
        default: {$ref: '#/components/responses/Problem'}
