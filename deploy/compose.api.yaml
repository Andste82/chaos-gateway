# The API container (plan §2.15, §2.16, §3.8): the REST API, and later the web UI and the scheduler.
# It is unprivileged: it runs as the user the executor lets through its socket, drops every
# capability and has a read-only root file system. It owns the engine: it compiles revisions and has
# the executor apply them, it keeps the revisions, the credentials and the audit log, and it writes
# the WireGuard keys the executor reads, and it configures Kea through its control socket.
#
# It runs in the host's network namespace to listen on the management network (and, until the setup is
# finished, on every address of the host) and to watch the interfaces; the port is above 1024, so it
# needs no capability for that. The first start prints a one-time setup token to its log
# (`docker compose logs api`).
services:
  api:
    image: ${CHAOSGW_IMAGE:-chaos-gateway}:${CHAOSGW_VERSION:-latest}
    command: ["api", "--socket", "/run/chaosgw/exec.sock", "--state-dir", "/var/lib/chaosgw/state", "--secrets-dir", "/var/lib/chaosgw/secrets", "--data-dir", "/var/lib/chaosgw/api", "--kea-socket", "/run/kea/kea4-ctrl.sock", "--kea-events-socket", "/run/chaosgw-kea-events/events.sock", "--service-token-file", "/var/lib/chaosgw/service/token", "--service-ns", "cgsvc", "--service-holder-pid-file", "/run/chaosgw-svcns/pid", "--captures-dir", "/var/lib/chaosgw/captures", "--tls-ca-dir", "/var/lib/chaosgw/tlsca", "--port", "${CHAOSGW_UI_PORT:-8443}"]
    user: "65532:65532"
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=0700
    volumes:
      # the executor's socket
      - chaosgw-run:/run/chaosgw
      # the revisions
      - type: bind
        source: /var/lib/chaosgw/state
        target: /var/lib/chaosgw/state
        bind:
          create_host_path: false
      # WireGuard keys, credentials, the HTTPS key: the executor mounts this directory read-only
      - type: bind
        source: /var/lib/chaosgw/secrets
        target: /var/lib/chaosgw/secrets
        bind:
          create_host_path: false
      # the audit log, the runs and the idempotency keys
      - type: bind
        source: /var/lib/chaosgw/api
        target: /var/lib/chaosgw/api
        bind:
          create_host_path: false
      # the packet captures (M17): the API makes the directory of a capture, the executor writes the packet files in it
      # (as the owner of the directory), and the API serves and deletes them and keeps the quota
      - type: bind
        source: /var/lib/chaosgw/captures
        target: /var/lib/chaosgw/captures
        bind:
          create_host_path: false
      # the CAs of the TLS responder (M21): the API makes them at its start and serves the test CA's certificate; the
      # responder's container (compose.tls.yaml) reads the directory
      - type: bind
        source: /var/lib/chaosgw/tlsca
        target: /var/lib/chaosgw/tlsca
        bind:
          create_host_path: false
      # Kea's control socket (the Kea container creates it, in the group of this user)
      - chaosgw-kea-run:/run/kea
      # the datagram socket of Kea's lease events: this user's directory, where it creates the socket;
      # the Kea container mounts it read-only (issue #57 F3)
      - chaosgw-kea-events:/run/chaosgw-kea-events
      # the token of the service containers and the API's published certificate: written here, read by Kea's hook and the
      # service containers
      - type: bind
        source: /var/lib/chaosgw/service
        target: /var/lib/chaosgw/service
        bind:
          create_host_path: false
      # the resolvers of a host with systemd-resolved (its stub 127.0.0.53 is no use to the DNS proxy)
      - type: bind
        source: /run/systemd/resolve
        target: /run/systemd/resolve
        read_only: true
        bind:
          create_host_path: true
      # the PID of the service namespace's holder, written by the svcns container (compose.dns.yaml)
      - type: volume
        source: chaosgw-svcns
        target: /run/chaosgw-svcns
        read_only: true
    depends_on:
      exec:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      # the port is the one the setup configured (.env: CHAOSGW_UI_PORT), the same the command gives as the default
      test: ["CMD", "chaosgw", "api", "--health", "--port", "${CHAOSGW_UI_PORT:-8443}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  chaosgw-run:
  chaosgw-kea-run:
  chaosgw-kea-events:
  chaosgw-svcns:
