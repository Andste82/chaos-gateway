# The BIRD container (plan §2.2.2): the routing daemon of the dynamic routing protocols. It reads the
# configuration the executor writes into the shared volume (the executor reconfigures it through the
# control socket in the same place) and speaks BGP, OSPF and Babel on the host's network stack, in
# the host's network namespace so it sees the WireGuard interfaces and writes table 100. It is not
# privileged: it needs the network capabilities and nothing else.
services:
  bird:
    image: chaos-gateway:${CHAOSGW_VERSION:-latest}
    entrypoint: ["/usr/sbin/bird"]
    command: ["-f", "-c", "/run/chaosgw/bird/chaosgw.conf", "-s", "/run/chaosgw/bird/chaosgw.ctl"]
    user: "0:0"
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=4m,mode=0700
    volumes:
      # the configuration and the control socket; the executor writes the file, BIRD only reads it
      - chaosgw-bird:/run/chaosgw/bird
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  chaosgw-bird:
