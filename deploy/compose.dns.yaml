# The gateway services' namespace and the DNS proxy (plan §2.6, §3.3, §3.8).
#
# `svcns` is the holder of the service namespace: an unprivileged container without a network that
# only keeps its namespace alive. It runs in the host's PID namespace, so the PID it writes is the one
# the executor (privileged, also in the host's PID namespace) attaches the namespace of before it
# connects the namespace to the gateway with the veth pair svc0/svc1 (169.254.100.0/30).
#
# `dns` joins that namespace (`network_mode: service:svcns`): it binds port 53 there and has no other
# network. Queries to each test network's gateway address are redirected into it by the gateway's
# nftables; it fetches its configuration from the API at 169.254.100.1 and posts its query log. It
# keeps no state: restarting it costs nothing, restarting the holder is healed by the next apply
# (the pair is created again) followed by a restart of `dns`, which re-joins the new namespace.
services:
  svcns:
    image: chaos-gateway:${CHAOSGW_VERSION:-latest}
    command: ["svcns", "--pid-file", "/run/chaosgw-svcns/pid"]
    user: "65532:65532"
    network_mode: none
    pid: host
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - chaosgw-svcns:/run/chaosgw-svcns
    restart: unless-stopped
    stop_grace_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
  dns:
    image: chaos-gateway:${CHAOSGW_VERSION:-latest}
    command: ["dns", "--listen", ":53", "--api", "https://169.254.100.1:${CHAOSGW_UI_PORT:-8443}", "--service-token-file", "/var/lib/chaosgw/service/token"]
    user: "65532:65532"
    network_mode: "service:svcns"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=4m,mode=0700
    volumes:
      # the token the proxy authenticates with: nothing else of the secrets volume
      - type: volume
        source: chaosgw-service
        target: /var/lib/chaosgw/service
        read_only: true
    depends_on:
      - svcns
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "chaosgw", "dns", "--health", "--listen", ":53"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  chaosgw-svcns:
  chaosgw-service:
