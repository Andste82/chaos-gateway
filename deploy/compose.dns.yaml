# The gateway services' namespace and the DNS proxy (plan §2.6, §3.3, §3.8).
#
# `svcns` is the holder of the service namespace: an unprivileged container without a network that
# only keeps its namespace alive. It runs in the host's PID namespace, so the PID it writes is the one
# the executor (privileged, also in the host's PID namespace) attaches the namespace of before it
# connects the namespace to the gateway with the veth pair svc0/svc1 (169.254.100.0/30).
#
# `dns` joins that namespace (`network_mode: service:svcns`): it binds port 53 there and has no other
# network. Queries to each test network's gateway address are redirected into it by the gateway's
# nftables; it fetches its configuration from the API at 169.254.100.1 and posts its query log. It
# keeps no state: restarting it costs nothing, restarting the holder is healed by the next apply
# (the pair is created again), and Compose restarts `dns` with it (`depends_on ... restart: true`), which
# re-joins the new namespace.
services:
  svcns:
    image: ${CHAOSGW_IMAGE:-chaos-gateway}:${CHAOSGW_VERSION:-latest}
    command: ["svcns", "--pid-file", "/run/chaosgw-svcns/pid"]
    user: "65532:65532"
    network_mode: none
    pid: host
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - chaosgw-svcns:/run/chaosgw-svcns
    depends_on:
      # start order (plan §3.8): the executor first, then the holder, whose namespace the executor attaches the veth pair to
      exec:
        condition: service_healthy
        required: false
    restart: unless-stopped
    stop_grace_period: 5s
    healthcheck:
      # the holder is ready when it has written its PID file
      test: ["CMD", "test", "-s", "/run/chaosgw-svcns/pid"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
  dns:
    image: ${CHAOSGW_IMAGE:-chaos-gateway}:${CHAOSGW_VERSION:-latest}
    command: ["dns", "--listen", ":53", "--api", "https://169.254.100.1:${CHAOSGW_UI_PORT:-8443}", "--service-token-file", "/var/lib/chaosgw/service/token", "--api-cert-file", "/var/lib/chaosgw/service/api.pem"]
    user: "65532:65532"
    network_mode: "service:svcns"
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=4m,mode=0700
    volumes:
      # the token the proxy authenticates with and the API's certificate: nothing else of the secrets
      - type: bind
        source: /var/lib/chaosgw/service
        target: /var/lib/chaosgw/service
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      svcns:
        condition: service_healthy
        # a recreated holder has a new namespace: the proxy has to join it again
        restart: true
      # the proxy fetches its configuration from the API (169.254.100.1)
      api:
        condition: service_healthy
        required: false
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "chaosgw", "dns", "--health", "--listen", ":53"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  chaosgw-svcns:
