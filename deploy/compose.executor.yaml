# Container hardening profile of the executor (plan §2.16, §3.8). The compose file of M-final
# (the full set of containers) includes this service unchanged; internal/executor/hardening_test.go
# pins the settings that matter.
#
# The executor is the only privileged container: it writes nftables, tc, routes and sysctls on the
# host's network stack, and per-interface sysctls of new bridges need a writable /proc/sys, which
# only a privileged container has (spike S7). Everything else about it is closed down:
#   - read-only root file system; the only writable places are the three volumes and a tmpfs
#   - no-new-privileges, and `chaosgw exec` sets PR_SET_NO_NEW_PRIVS itself
#   - it runs no shell: operations are typed, commands are argument arrays with fixed binary paths
#   - the socket is reachable only for root and the API container's user (SO_PEERCRED check)
services:
  exec:
    image: chaos-gateway:${CHAOSGW_VERSION:-latest}
    command: ["exec", "--socket", "/run/chaosgw/exec.sock", "--state", "/var/lib/chaosgw/exec/state.json", "--secrets-dir", "/var/lib/chaosgw/secrets", "--bird-dir", "/run/chaosgw-bird", "--allow-uid", "65532", "--socket-owner", "65532", "--host-root", "/host", "--captures-dir", "/var/lib/chaosgw/captures"]
    user: "0:0"
    privileged: true
    network_mode: host
    # the service namespace of the gateway services is the namespace of the holder container: the
    # executor attaches it by the holder's PID, which it can only see in the host's PID namespace
    pid: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=0700
      # iptables -w keeps its lock file in /run; the volumes below are mounted on top
      - /run:size=4m,mode=0755
    volumes:
      # the socket the API container connects to
      - chaosgw-run:/run/chaosgw
      # BIRD's configuration file and control socket, shared with the BIRD container (compose.bird.yaml)
      - chaosgw-bird:/run/chaosgw-bird
      # the interfaces assigned to Chaos Gateway; nothing else is stored
      - chaosgw-exec-state:/var/lib/chaosgw/exec
      # the packet captures (M17): the executor holds the privilege for the raw sockets and writes the files into the
      # directories the API container makes; the API container reads, serves and deletes them
      - chaosgw-captures:/var/lib/chaosgw/captures
      # the WireGuard keys: the executor only reads them (the API container writes)
      - type: volume
        source: chaosgw-secrets
        target: /var/lib/chaosgw/secrets
        read_only: true
      # named network namespaces are shared with the host (probes, the service namespace)
      - type: bind
        source: /run/netns
        target: /run/netns
        bind:
          propagation: rshared
          create_host_path: true
      # missing kernel modules are loaded from the host's modules
      - type: bind
        source: /lib/modules
        target: /lib/modules
        read_only: true
      # the host's /etc, read-only: the preflight reads where netplan, NetworkManager and systemd-networkd configure an
      # interface (/etc/netplan, /etc/NetworkManager/system-connections, /etc/systemd/network; their files are root's), so the
      # setup wizard can say which entry to remove from a test interface. Only the file, the entry and the
      # interface it names leave the executor, never a file's content. The whole /etc, not only those
      # directories: a bind mount needs its source, and a host without netplan or NetworkManager has none
      # (create_host_path would create them on the host).
      - type: bind
        source: /etc
        target: /host/etc
        read_only: true
      # the host's systemd-networkd defaults, read-only: the preflight reads the .network files of every directory
      # networkd reads (internal/preflight/networkd.go), and a distribution's default here can configure a test
      # interface (I64-02, decided 2026-10-18). /usr/lib/systemd/network is part of systemd's package, so the bind
      # mount always has its source. /run/systemd/network is not mounted: it exists only while networkd or
      # netplan has written to it, and the host setup's check (host-setup.sh --check) reads it.
      - type: bind
        source: /usr/lib/systemd/network
        target: /host/usr/lib/systemd/network
        read_only: true
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "chaosgw", "exec", "--health", "--socket", "/run/chaosgw/exec.sock"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  chaosgw-run:
  chaosgw-exec-state:
  chaosgw-secrets:
  chaosgw-bird:
  chaosgw-captures:
