# The Kea DHCP server container (plan §2.7, §3.8): one Kea instance for all networks, one subnet per
# network on the network's bridge. It listens with raw sockets on the host's bridges, so it runs in the
# host network namespace, and it needs only NET_RAW and NET_BIND_SERVICE (plus CHOWN, FOWNER and DAC_OVERRIDE to give
# its control socket directory to the API's group at start). It runs as root without any other
# capability; its root file system is read-only. The API container configures it through the control
# socket (`config-set`) and gets the lease events from Kea's run_script hook (`chaosgw-kea-hook`),
# which posts them over the datagram socket the API serves in the shared chaosgw-kea-run volume
# (M6a-09; HTTP with the service token is the fallback when that socket is unavailable).
services:
  kea:
    image: chaos-gateway:${CHAOSGW_VERSION:-latest}
    entrypoint: ["/usr/local/bin/chaosgw-kea-start"]
    user: "0:65532"
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_BIND_SERVICE, CHOWN, FOWNER, DAC_OVERRIDE]
    tmpfs:
      - /tmp:size=4m,mode=0700
    volumes:
      # the control socket, shared with the API container
      - chaosgw-kea-run:/run/kea
      # the leases and the configuration Kea was started with
      - chaosgw-kea-state:/var/lib/kea
      # the service token and the API's certificate the hook reads: nothing else of the secrets volume
      - type: volume
        source: chaosgw-service
        target: /var/lib/chaosgw/service
        read_only: true
    environment:
      # where the hook reports lease events: the API on the loopback of the host
      CHAOSGW_API: https://127.0.0.1:${CHAOSGW_UI_PORT:-8443}
      # the API's certificate, so the hook verifies it instead of trusting whatever is presented
      CHAOSGW_API_CERT: /var/lib/chaosgw/service/api.pem
      # the hook posts over this datagram socket instead of HTTP when it is available (M6a-09);
      # HTTP (CHAOSGW_API above) stays the fallback
      CHAOSGW_KEA_EVENTS_SOCKET: /run/kea/chaosgw-events.sock
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  chaosgw-kea-run:
  chaosgw-kea-state:
  chaosgw-service:
