# The teardown container (plan §3.8 "Stop", D35, M27): `chaosgw teardown` removes what Chaos Gateway created in the kernel for a
# gateway whose executor was killed, and with --purge empties the data directories of the host (plan §3.6). The executor's own
# container mounts only the directories it needs (the secrets read-only, no revisions, no audit log), so this service mounts every
# one of them writable; it is the executor's profile otherwise (privileged, the host's network stack and /run/netns), and it
# refuses while an executor is serving on the socket in chaosgw-run.
#
# It is under a profile: `docker compose up` never starts it. Run it with the project name of the deployment (compose.yaml has
# the service too, and names the project chaosgw):
#   docker compose --profile teardown run --rm teardown [--purge]      (in the directory of compose.yaml)
#   docker compose -p chaosgw -f compose.teardown.yaml run --rm teardown [--purge]
services:
  teardown:
    image: ${CHAOSGW_IMAGE:-chaos-gateway}:${CHAOSGW_VERSION:-latest}
    # the flags that name this container's places are in the entrypoint, because `compose run teardown --purge` replaces the command
    entrypoint: ["chaosgw", "teardown", "--socket", "/run/chaosgw/exec.sock", "--state", "/var/lib/chaosgw/exec/state.json", "--bird-dir", "/run/chaosgw-bird"]
    profiles: ["teardown"]
    user: "0:0"
    privileged: true
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=0700
      # iptables -w keeps its lock file in /run; the volumes below are mounted on top
      - /run:size=4m,mode=0755
    volumes:
      # the executor's socket: a serving executor is refused
      - chaosgw-run:/run/chaosgw
      - chaosgw-bird:/run/chaosgw-bird
      # the directories --purge empties (cmd/chaosgw/teardown.go, dataDirs)
      - type: bind
        source: /var/lib/chaosgw/state
        target: /var/lib/chaosgw/state
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/chaosgw/secrets
        target: /var/lib/chaosgw/secrets
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/chaosgw/api
        target: /var/lib/chaosgw/api
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/chaosgw/service
        target: /var/lib/chaosgw/service
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/chaosgw/tlsca
        target: /var/lib/chaosgw/tlsca
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/chaosgw/captures
        target: /var/lib/chaosgw/captures
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/chaosgw/exec
        target: /var/lib/chaosgw/exec
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/chaosgw/kea
        target: /var/lib/kea
        bind:
          create_host_path: false
      # the names of the probes' namespaces and of the service namespace are removed with the host
      - type: bind
        source: /run/netns
        target: /run/netns
        bind:
          propagation: rshared
          create_host_path: true

volumes:
  chaosgw-run:
  chaosgw-bird:
