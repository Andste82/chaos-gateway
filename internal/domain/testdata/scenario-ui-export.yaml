name: mqtt-outage
target:
  device: ESP32-42
capture: true
steps:
  - id: normal
    at: 0s
    profile: normal
  - id: slow
    at: 10s
    fault:
      latency: 200ms
      jitter: 50ms
  - id: lossy
    at: 20s
    fault:
      latency: 200ms
      jitter: 50ms
      loss: 10%
  - id: cut
    at: 30s
    rule:
      action: drop
      protocol: tcp
      ports:
        - 8883
      cut_existing: true
  - id: restore
    at: 45s
    restore: true
checks:
  - reconnected:
      protocol: tcp
      ports:
        - 8883
    window:
      from: restore
      within: 30s
  - dns_query_seen:
      name: broker.example.com
    window:
      from: restore
      within: 30s
